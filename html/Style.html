<style>
/* ============================================================================
   DESIGN SYSTEM v2.0 — RADAR POA (Rekapitulasi Data Strategis)
   Direktorat Pengendalian Operasi Armada · Ditjen PSDKP · KKP RI
   Visual Identity: Full-Width Hydrographic Briefing & Floating Maritime Dock
   - Top Institutional Bar (56px, solid #FFFFFF) + Floating Bottom Dock (#0E1722, #C88A2E)
   - Cool Hydrographic Workspace (#F4F7F9) + Clean Plate Surfaces (#FFFFFF)
   - Deep Admiralty Blue Primary Action (#0B4F6C)
   - Public Sans (single-family institutional sans, 6 optical steps >= 12px, tabular-nums)
   - Sharp Architectural Radii (6px / 4px / 3px), 1px Hairlines, 0 Static Card Shadow
   - 3-Tier Control Geometry (LG: 40px, MD: 32px, SM: 26px)
   ============================================================================ */

:root {
  /* ── 1. Floating Bottom Maritime Dock (#0E1722) & Alias Rail Legacy ──── */
  --dock-bg:              #0E1722;
  --dock-hover:           #172434;
  --dock-active:          #1D2E42;
  --dock-ink:             #F5F2EB;
  --dock-ink-muted:       #93A2B5;
  --dock-accent:          #C88A2E;
  --dock-border:          rgba(255, 255, 255, 0.12);
  --dock-highlight:       inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --dock-shadow:          0 12px 32px rgba(14, 23, 34, 0.24);

  --rail-bg:              var(--dock-bg);
  --rail-hover:           var(--dock-hover);
  --rail-active:          var(--dock-active);
  --rail-rule:            var(--dock-border);
  --rail-ink:             var(--dock-ink);
  --rail-ink-muted:       var(--dock-ink-muted);
  --rail-accent:          var(--dock-accent);

  /* ── 2. Cool Hydrographic Chart Workspace ─────────────────────────────── */
  --bg-ground:            #F4F7F9;
  --bg-header:            #FFFFFF;
  --bg-surface:           #FFFFFF;
  --bg-raised:            #E6EDF2;
  --bg-active:            #D9E4EC;
  --bg-auth-panel:        #FAFCFD;

  --border-card:          #D1DCE5;
  --border-rule:          #E2EAF0;
  --border-ctl:           #B5C4D1;

  --ink-primary:          #14191F;
  --ink-secondary:        #3E4752;
  --ink-muted:            #535D68;
  --ink-faint:            #5D656F;

  /* ── 3. Deep Admiralty Primary & Brass Accents ────────────────────────── */
  --action-primary:       #0B4F6C;
  --action-primary-hover: #083B52;
  --accent-radar:         #0B4F6C;
  --accent-radar-soft:    #E1EFF5;
  --accent-radar-ink:     #07384D;

  --accent-brass:         #B4761F;
  --accent-brass-soft:    #FBF1DF;
  --accent-brass-ink:     #6D450B;

  /* ── 4. Satellite Source & Semantic Status Coding ─────────────────────── */
  --sat-sikap:            #0F766E;
  --sat-sikap-soft:       #D9F2EE;
  --sat-nakhoda:          #C2410C;
  --sat-nakhoda-soft:     #FDE8DC;
  --sat-pusat:            #0B4F6C;
  --sat-pusat-soft:       #E1EFF5;

  --sem-pos:              #15803D;
  --sem-pos-bg:           #DCFCE7;
  --sem-pos-ink:          #052E16;

  --sem-warn:             #B45309;
  --sem-warn-bg:          #FEF3C7;
  --sem-warn-ink:         #78350F;

  --sem-crit:             #B91C1C;
  --sem-crit-bg:          #FEE2E2;
  --sem-crit-ink:         #7F1D1D;

  --sem-neut:             #475569;
  --sem-neut-bg:          #E6EDF2;
  --sem-neut-ink:         #1E293B;

  --focus-ring:           #0B4F6C;

  /* ── 5. Alias Kompatibilitas Token View / Script (--n-*) ──────────────── */
  --n-primary:            var(--accent-radar);
  --n-primary-light:      var(--accent-radar-soft);
  --n-ok:                 var(--sem-pos);
  --n-status-success:     var(--sem-pos);
  --n-warn:               var(--sem-warn);
  --n-crit:               var(--sem-crit);
  --n-status-critical:    var(--sem-crit);
  --n-border-subtle:      var(--border-rule);
  --n-surface-2:          var(--bg-raised);
  --n-text-primary:       var(--ink-primary);
  --n-text-secondary:     var(--ink-secondary);
  --n-text-muted:         var(--ink-muted);
  --n-r-sm:               var(--r-sm);

  /* ── 6. Tipografi Publikasi (6 Skala >= 12px) & Geometri Tajam ────────── */
  --font-sans:            'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

  --fs-hero-num:          28px;
  --fs-kpi-num:           28px;
  --fs-h1:                26px;
  --fs-h2:                16px;
  --fs-section:           16px;
  --fs-body:              14px;
  --fs-md:                13px;
  --fs-sm:                12px;

  /* Sharp Architectural Radii */
  --r-card:               6px;
  --r-lg:                 4px;
  --r-md:                 4px;
  --r-sm:                 3px;
  --r-pill:               999px;

  /* Shell Proportions (4px grid) */
  --topbar-h:             56px;
  --canvas-max:           1440px;
  --edge-pad:             28px;
  --card-pad:             20px;

  /* Floating Overlay Shadows Only (0 shadow on static cards) */
  --shadow-popover:       0 12px 28px -8px rgba(14, 23, 34, 0.22), 0 0 0 1px var(--border-card);
  --shadow-modal:         0 24px 48px -14px rgba(14, 23, 34, 0.28), 0 0 0 1px var(--border-card);

  /* ── 7. Skala Geometri Kontrol 3-Tier Tunggal ────────────────────────── */
  --ctl-h-lg:             40px;
  --ctl-px-lg:            14px;
  --ctl-fs-lg:            14px;
  --ctl-r-lg:             4px;

  --ctl-h-md:             32px;
  --ctl-px-md:            12px;
  --ctl-fs-md:            13px;
  --ctl-r-md:             4px;

  --ctl-h-sm:             26px;
  --ctl-px-sm:            10px;
  --ctl-fs-sm:            12px;
  --ctl-r-sm:             3px;

  /* ── 8. Fisika Gerak ─────────────────────────────────────────────────── */
  --ease-out:             cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out:          cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer:          cubic-bezier(0.32, 0.72, 0, 1);

  --dur-press:            100ms;
  --dur-fast:             150ms;
  --dur-modal:            200ms;
  --dur-drawer:           240ms;
}

/* ============================================================================
   1. RESET & CRAFT-FLOOR BASE (Mobile-Native + Clear Type Hierarchy)
   ============================================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  height: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

body {
  min-height: 100dvh;
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.5;
  color: var(--ink-primary);
  background-color: var(--bg-ground);
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1,
.page-title {
  font-size: var(--fs-h1);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--ink-primary);
}

h2,
.auth-title,
.n-modal h2,
.n-drawer-hd h2 {
  font-size: var(--fs-h2);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.005em;
  color: var(--ink-primary);
}

::selection {
  background-color: var(--accent-radar-soft);
  color: var(--accent-radar-ink);
}

::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(20, 25, 31, 0.18);
  border-radius: var(--r-pill);
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(11, 79, 108, 0.45);
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}

button, a, [role="button"], .dock-item, .dock-more-item {
  touch-action: manipulation;
  user-select: none;
}

input, select, textarea {
  font-family: inherit;
  touch-action: manipulation;
  caret-color: var(--accent-radar);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: transparent;
  color: inherit;
}

a {
  text-decoration: none;
  color: inherit;
}

/* Mandatory Tabular Numerals */
.tnum,
.tabular-nums,
.table-num,
.kpi-val,
.kpi-value,
.kpi-foot-val,
.div-metric-val,
.kt-hero-score-val,
.kt-score-num,
.kt-table td,
.ov-map-rank-val,
.bar-line-val,
.legend-val,
.legend-pct,
.ship-pop-val,
.nav-badge,
td.num,
th.num,
input[type="number"] {
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
}

.font-bold     { font-weight: 700; }
.font-semibold { font-weight: 600; }
.font-medium   { font-weight: 500; }
.text-center   { text-align: center; }
.text-right    { text-align: right; }
.text-muted    { color: var(--ink-muted); }
.text-xs       { font-size: var(--fs-sm); }
.py-4          { padding-top: 16px; padding-bottom: 16px; }
.n-hidden      { display: none !important; }

/* Institutional PSDKP Crest Filter (Identik dengan SIKAP & Nakhoda) */
.psdkp-crest-img,
.brand-crest-img {
  display: block;
  object-fit: contain;
  padding: 3px;
  box-sizing: content-box;
  overflow: visible;
  filter: url(#psdkp-crest-outline);
}

/* ============================================================================
   2. LOADING SPLASH, SPINNERS & SKELETONS
   ============================================================================ */
#n-loading {
  position: fixed;
  inset: 0;
  background-color: var(--bg-ground);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  z-index: 999;
  transition: opacity 220ms var(--ease-out);
}

.n-loading-brand {
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--ink-primary);
  line-height: 1.2;
}

.n-loading-sub {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  margin-bottom: 4px;
  text-align: center;
}

.n-loading-spin {
  width: 24px;
  height: 24px;
  border: 2px solid var(--border-ctl);
  border-top-color: var(--accent-radar);
  border-radius: 50%;
  animation: _spin 750ms linear infinite;
}

.n-spin {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid var(--border-ctl);
  border-top-color: var(--accent-radar);
  border-radius: 50%;
  animation: _spin 750ms linear infinite;
  vertical-align: middle;
}

.n-spin-sm {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border-ctl);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: _spin 750ms linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

.n-spin-lg {
  display: inline-block;
  width: 28px;
  height: 28px;
  border: 2.5px solid var(--border-ctl);
  border-top-color: var(--accent-radar);
  border-radius: 50%;
  animation: _spin 750ms linear infinite;
}

@keyframes _spin {
  to { transform: rotate(360deg); }
}

.md-loading-inline {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 20px 24px;
  color: var(--ink-muted);
  font-size: var(--fs-md);
}

.kpi-skeleton {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
}

.kpi-skeleton-item {
  min-height: 96px;
}

.sk-bar {
  height: 12px;
  border-radius: var(--r-sm);
  background: var(--bg-raised);
  width: 100%;
}

.sk-bar-lg {
  height: 24px;
  width: 55%;
}

.sk-bar-sm {
  height: 12px;
  width: 75%;
}

/* ============================================================================
   3. AUTH SCREENS — 50/50 PHOTOGRAPHIC SPLIT SCREEN
   ============================================================================ */
#auth-wrapper {
  min-height: 100dvh;
}

.auth-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100dvh;
  width: 100%;
}

/* Left Panel — Sticky Full-Bleed PSDKP Personnel Photograph */
.auth-media {
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow: hidden;
  background-color: var(--dock-bg);
}

.auth-media::after {
  content: '';
  position: absolute;
  inset: auto 0 0 0;
  height: 22%;
  background: linear-gradient(to top, rgba(14, 23, 34, 0.34), transparent);
  pointer-events: none;
}

.auth-media-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 54% 20%;
  display: block;
}

/* Right Panel — Quiet Institutional Form Workspace with Bottom Anchor */
.auth-panel {
  min-height: 100dvh;
  background-color: var(--bg-auth-panel);
  border-left: 1px solid var(--border-rule);
  padding: 28px clamp(28px, 5vw, 64px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
}

.auth-panel-spacer {
  height: 16px;
  flex: 0 0 auto;
}

.auth-panel-inner {
  width: 100%;
  max-width: 396px;
}

.auth-panel-foot {
  width: 100%;
  max-width: 396px;
  padding-top: 16px;
  border-top: 1px solid var(--border-rule);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  text-align: center;
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}

.auth-brand-crest {
  flex-shrink: 0;
}

.auth-brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.auth-brand-name {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.08;
  color: var(--dock-bg);
}

.auth-brand-poa {
  color: var(--action-primary);
}

.auth-brand-exp {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink-primary);
  margin-top: 4px;
}

.auth-brand-org {
  font-size: 12.5px;
  font-weight: 400;
  line-height: 1.35;
  color: var(--ink-muted);
  margin-top: 2px;
}

.auth-screen {
  width: 100%;
}

.auth-screen .auth-title {
  margin-bottom: 16px;
}

.auth-screen .form-grp input,
.auth-screen .form-grp select,
.btn-primary.auth-submit-btn,
.auth-submit-btn,
#form-register button[type="submit"],
#reg-otp-step button {
  height: var(--ctl-h-lg);
  font-size: var(--ctl-fs-lg);
  border-radius: var(--ctl-r-lg);
}

.btn-primary.auth-submit-btn,
.auth-submit-btn,
#form-register button[type="submit"] {
  width: 100%;
  margin-top: 8px;
}

.auth-btn-mt {
  width: 100%;
  margin-top: 8px;
}

.auth-foot {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-rule);
  font-size: var(--fs-md);
  color: var(--ink-secondary);
}

.auth-foot a {
  color: var(--accent-radar);
  font-weight: 600;
  cursor: pointer;
}

/* Pending Details & Banners */
.info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-card);
  font-size: var(--fs-md);
}

.info-row .lbl { color: var(--ink-muted); }
.info-row .val { color: var(--ink-primary); font-weight: 500; text-align: right; }

.pending-live-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
  padding: 10px 12px;
  background-color: var(--bg-raised);
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  color: var(--ink-secondary);
}

.pending-pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--sem-warn);
  box-shadow: 0 0 0 3px var(--sem-warn-bg);
  flex-shrink: 0;
}

.n-banner-approved {
  padding: 14px 16px;
  border-radius: var(--r-lg);
  background-color: var(--sem-pos-bg);
  border: 1px solid rgba(21, 128, 61, 0.25);
  color: var(--sem-pos-ink);
  margin-bottom: 16px;
}

.n-banner-approved-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: var(--fs-body);
  margin-bottom: 6px;
}

.n-banner-approved-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: var(--sem-pos);
  color: #FFFFFF;
  font-size: 12px;
}

.n-banner-approved-text {
  font-size: var(--fs-md);
  line-height: 1.45;
  margin-bottom: 12px;
}

.n-banner-approved-actions {
  display: flex;
  gap: 8px;
}

.n-banner-rejected {
  padding: 14px 16px;
  border-radius: var(--r-lg);
  background-color: var(--sem-crit-bg);
  border: 1px solid rgba(185, 28, 28, 0.25);
  color: var(--sem-crit-ink);
  margin-bottom: 16px;
}

.n-banner-rejected-head {
  font-weight: 600;
  font-size: var(--fs-body);
  margin-bottom: 6px;
}

.n-banner-rejected-text {
  font-size: var(--fs-md);
  line-height: 1.45;
  margin-bottom: 12px;
}

/* ============================================================================
   4. FORMS & 3-TIER CONTROL GEOMETRY (LG: 40px · MD: 32px · SM: 26px)
   ============================================================================ */
.form-grp {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.form-grp label {
  font-size: var(--fs-md);
  font-weight: 500;
  color: var(--ink-primary);
}

.n-form-hint {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  line-height: 1.4;
}

.form-grp input[type="text"],
.form-grp input[type="email"],
.form-grp input[type="password"],
.form-grp input[type="number"],
.form-grp input[type="date"],
.form-grp select,
.n-input,
.md-opsi-input {
  width: 100%;
  height: var(--ctl-h-lg);
  padding: 0 var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  color: var(--ink-primary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-ctl);
  border-radius: var(--ctl-r-lg);
  transition: border-color var(--dur-fast) var(--ease-out),
              background-color var(--dur-fast) var(--ease-out);
}

.form-grp input[type="file"] {
  width: 100%;
  padding: 8px 10px;
  font-size: var(--fs-md);
  color: var(--ink-secondary);
  background-color: var(--bg-surface);
  border: 1px dashed var(--border-ctl);
  border-radius: var(--ctl-r-lg);
}

.form-grp textarea {
  width: 100%;
  min-height: 88px;
  padding: 10px var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  line-height: 1.5;
  color: var(--ink-primary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-ctl);
  border-radius: var(--ctl-r-lg);
  resize: vertical;
  transition: border-color var(--dur-fast) var(--ease-out);
}

input::placeholder,
textarea::placeholder {
  color: var(--ink-faint);
}

input:disabled,
select:disabled,
textarea:disabled {
  background-color: var(--bg-raised);
  color: var(--ink-muted);
  cursor: not-allowed;
}

.n-input {
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  font-size: var(--ctl-fs-md);
  border-radius: var(--ctl-r-md);
}

/* Base Buttons — Default MD 32px */
.btn,
.btn-primary,
.btn-secondary,
.btn-outline,
.btn-ghost,
.btn-danger,
.btn-danger-solid,
.btn-mini,
.btn-sm,
.btn-sm-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  font-size: var(--ctl-fs-md);
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  border-radius: var(--ctl-r-md);
  border: 1px solid transparent;
  transition: background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              transform var(--dur-press) var(--ease-out);
}

.btn-primary {
  background-color: var(--action-primary);
  color: #FFFFFF;
  border-color: var(--action-primary);
}

.btn-secondary,
.btn-outline {
  background-color: var(--bg-surface);
  color: var(--ink-primary);
  border-color: var(--border-ctl);
}

.btn-ghost,
.btn-sm-ghost {
  background-color: transparent;
  color: var(--ink-secondary);
  border-color: transparent;
}

.btn-danger {
  background-color: var(--sem-crit-bg);
  color: var(--sem-crit-ink);
  border-color: rgba(185, 28, 28, 0.22);
}

.btn-danger-solid {
  background-color: var(--sem-crit);
  color: #FFFFFF;
  border-color: var(--sem-crit);
}

.btn-mini,
.btn-sm,
.btn-sm-ghost {
  height: var(--ctl-h-sm);
  padding: 0 var(--ctl-px-sm);
  font-size: var(--ctl-fs-sm);
  border-radius: var(--ctl-r-sm);
}

.btn-mini {
  background-color: var(--bg-surface);
  color: var(--ink-primary);
  border-color: var(--border-ctl);
}

.btn-mini.btn-ghost {
  background-color: transparent;
  border-color: transparent;
  color: var(--ink-secondary);
}

.btn svg.ico,
.n-has-ico svg.ico,
.btn-primary svg.ico,
.btn-outline svg.ico,
.btn-ghost svg.ico,
.btn-danger svg.ico,
.btn-danger-solid svg.ico,
.btn-mini svg.ico {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.n-iconbtn-sm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--ctl-h-sm);
  height: var(--ctl-h-sm);
  padding: 0;
  border-radius: var(--ctl-r-sm);
  flex-shrink: 0;
}

.n-iconbtn-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--ctl-h-md);
  height: var(--ctl-h-md);
  padding: 0;
  border-radius: var(--ctl-r-md);
  color: var(--ink-muted);
  background-color: transparent;
  border: 1px solid transparent;
  flex-shrink: 0;
  transition: background-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              transform var(--dur-press) var(--ease-out);
}

.n-chip-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  padding: 0;
  border-radius: var(--r-sm);
  color: var(--ink-muted);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

button:active:not(:disabled),
[role="button"]:active,
.btn-primary:active:not(:disabled),
.btn-secondary:active:not(:disabled),
.btn-outline:active:not(:disabled),
.btn-ghost:active:not(:disabled),
.btn-danger:active:not(:disabled),
.btn-danger-solid:active:not(:disabled),
.btn-mini:active:not(:disabled),
.dock-item:active,
.dock-more-item:active {
  transform: scale(0.97);
}

/* Control Rows & Strict Cohesion (_uiAudit() Guarantee) */
.ctl-row,
.hist-actions,
.n-seg {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.ctl-nowrap { flex-wrap: nowrap; }
.ctl-fill { display: flex; width: 100%; }
.ctl-fill > * { flex: 1 1 0; }

.ctl-stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.ctl-stack > button,
.ctl-stack > .btn {
  width: 100%;
  height: var(--ctl-h-lg);
  padding: 0 var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  border-radius: var(--ctl-r-lg);
}

.ctl-lg > button,
.ctl-lg > select,
.ctl-lg > input,
.ctl-lg > .btn,
.ctl-lg > .n-seg {
  height: var(--ctl-h-lg);
  padding: 0 var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  border-radius: var(--ctl-r-lg);
}

.ctl-md > button,
.ctl-md > select,
.ctl-md > input,
.ctl-md > .btn,
.ctl-md > .n-seg {
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  font-size: var(--ctl-fs-md);
  border-radius: var(--ctl-r-md);
}

.ctl-sm > button,
.ctl-sm > select,
.ctl-sm > input,
.ctl-sm > .btn,
.ctl-sm > .n-seg,
.hist-actions > button {
  height: var(--ctl-h-sm);
  padding: 0 var(--ctl-px-sm);
  font-size: var(--ctl-fs-sm);
  border-radius: var(--ctl-r-sm);
}

.ctl-sm > .n-iconbtn-sm {
  width: var(--ctl-h-sm);
  height: var(--ctl-h-sm);
  padding: 0;
}

.ctl-margin-top {
  margin-top: 20px;
}

#modal-md-kapal .n-modal > div:last-child button,
#modal-md-kawasan .n-modal > div:last-child button {
  height: var(--ctl-h-lg);
  padding: 0 var(--ctl-px-lg);
  font-size: var(--ctl-fs-lg);
  border-radius: var(--ctl-r-lg);
}

/* ============================================================================
   5. TOP INSTITUTIONAL BAR, FLOATING MARITIME DOCK & WORKSPACE SHELL
   ============================================================================ */
#app-wrapper {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  width: 100%;
  background-color: var(--bg-ground);
}

/* Sticky Top Institutional Bar (56px, Solid Ivory Surface, Zero Blur) */
.app-topbar {
  position: sticky;
  top: 0;
  z-index: 120;
  height: var(--topbar-h);
  background-color: var(--bg-header);
  border-bottom: 1px solid var(--border-card);
  flex-shrink: 0;
}

.app-topbar-inner {
  max-width: var(--canvas-max);
  width: 100%;
  height: 100%;
  margin: 0 auto;
  padding: 0 var(--edge-pad);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.topbar-brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  cursor: pointer;
}

.psdkp-crest-img {
  display: block;
  flex-shrink: 0;
}

.topbar-brand-text {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}

.topbar-brand-name {
  font-size: var(--fs-h2);
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--dock-bg);
  line-height: 1.2;
}

.topbar-brand-poa {
  color: var(--accent-radar);
}

.topbar-brand-sep {
  color: var(--border-ctl);
  font-size: var(--fs-md);
}

.topbar-brand-exp {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  font-weight: 400;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.sync-wrap {
  position: relative;
}

.topbar-icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--ctl-h-md);
  height: var(--ctl-h-md);
  border-radius: var(--ctl-r-md);
  border: 1px solid var(--border-ctl);
  background-color: var(--bg-surface);
  color: var(--ink-secondary);
  transition: background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              transform var(--dur-press) var(--ease-out);
}

.topbar-icon-btn:active {
  transform: scale(0.97);
}

.topbar-notif-badge {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--r-pill);
  background-color: var(--accent-brass);
  color: #FFFFFF;
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: 16px;
  text-align: center;
  border: 1.5px solid var(--bg-header);
  font-variant-numeric: tabular-nums;
}

.topbar-user-wrap {
  position: relative;
}

.topbar-user-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: var(--ctl-h-md);
  padding: 0 10px 0 5px;
  border-radius: var(--ctl-r-md);
  border: 1px solid var(--border-ctl);
  background-color: var(--bg-surface);
  color: var(--ink-primary);
  transition: background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              transform var(--dur-press) var(--ease-out);
}

.topbar-user-btn:active {
  transform: scale(0.97);
}

.topbar-user-btn.is-active {
  background-color: var(--bg-raised);
  border-color: var(--accent-radar);
}

.topbar-avatar-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}

.topbar-avatar {
  width: 22px;
  height: 22px;
  border-radius: var(--r-sm);
  background-color: var(--bg-raised);
  color: var(--ink-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.topbar-status-dot {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: #22C55E;
  border: 1.5px solid var(--bg-surface);
}

.topbar-user-name {
  font-size: var(--ctl-fs-md);
  font-weight: 500;
  color: var(--ink-primary);
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-user-chevron {
  display: inline-flex;
  align-items: center;
  color: var(--ink-muted);
}

.topbar-user-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 248px;
  background-color: var(--bg-surface);
  color: var(--ink-primary);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-popover);
  padding: 8px;
  z-index: 145;
  animation: _modalIn var(--dur-fast) var(--ease-out);
}

.sb-menu-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px;
}

.sb-menu-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--r-md);
  background-color: var(--bg-raised);
  color: var(--ink-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.sb-menu-user { min-width: 0; }

.sb-menu-name {
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--ink-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sb-menu-email {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sb-menu-badges { padding: 4px 6px 6px; }

.sb-role-badge {
  display: inline-block;
  font-size: var(--fs-sm);
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--r-sm);
  background-color: var(--bg-raised);
  color: var(--ink-secondary);
}

.sb-menu-divider {
  height: 1px;
  background-color: var(--border-rule);
  margin: 4px 0;
}

.sb-menu-items {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sb-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 8px;
  border-radius: var(--r-md);
  font-size: var(--fs-md);
  color: var(--ink-secondary);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out);
}

.sb-menu-item.danger { color: var(--sem-crit); }

/* Floating Bottom Maritime Dock (#0E1722 + Brass #C88A2E) */
.app-dock {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 130;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  border-radius: 14px;
  background-color: var(--dock-bg);
  color: var(--dock-ink);
  border: 1px solid var(--dock-border);
  box-shadow: var(--dock-highlight), var(--dock-shadow);
  max-width: calc(100vw - 24px);
}

.dock-sep {
  width: 1px;
  height: 22px;
  background-color: rgba(255, 255, 255, 0.14);
  margin: 0 4px;
  flex-shrink: 0;
}

.dock-item {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 12px;
  border-radius: 10px;
  font-size: var(--fs-md);
  font-weight: 400;
  color: #C7D1DD;
  white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              transform var(--dur-press) var(--ease-out);
}

.dock-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--dock-ink-muted);
}

.dock-item.active {
  background-color: var(--dock-active);
  color: var(--dock-ink);
  font-weight: 600;
}

.dock-item.active svg {
  color: var(--dock-accent);
}

.dock-item.active::after {
  content: '';
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 3px;
  height: 2px;
  border-radius: 2px;
  background-color: var(--dock-accent);
}

.dock-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--r-pill);
  background-color: rgba(255, 255, 255, 0.16);
  color: var(--dock-ink);
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.dock-item.active .dock-badge {
  background-color: var(--dock-accent);
  color: var(--dock-bg);
}

.dock-more-btn {
  display: none;
}

/* Mobile Overflow Sheet (<= 768px) */
.dock-more-mask {
  position: fixed;
  inset: 0;
  background-color: rgba(14, 23, 34, 0.45);
  z-index: 170;
}

.dock-more-sheet {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: max(12px, env(safe-area-inset-bottom));
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: 12px;
  box-shadow: var(--shadow-modal);
  padding: 10px 12px 14px;
  z-index: 175;
  animation: _modalIn var(--dur-fast) var(--ease-out);
}

.dock-more-grabber {
  width: 36px;
  height: 4px;
  border-radius: var(--r-pill);
  background-color: var(--border-ctl);
  margin: 0 auto 10px;
}

.dock-more-head {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-muted);
  padding: 0 8px 8px;
  border-bottom: 1px solid var(--border-rule);
  margin-bottom: 6px;
}

.dock-more-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.dock-more-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 40px;
  padding: 0 10px;
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 500;
  color: var(--ink-primary);
  text-align: left;
  transition: background-color var(--dur-fast) var(--ease-out);
}

.dock-more-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  color: var(--ink-secondary);
}

.dock-more-item.active {
  background-color: var(--accent-radar-soft);
  color: var(--accent-radar-ink);
  font-weight: 600;
}

.dock-more-item.active svg {
  color: var(--accent-radar);
}

.dock-more-item.danger {
  color: var(--sem-crit);
}

.dock-more-item.danger svg {
  color: var(--sem-crit);
}

.dock-more-divider {
  height: 1px;
  background-color: var(--border-rule);
  margin: 6px 0;
}

.dock-more-badge {
  margin-left: auto;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: var(--r-pill);
  background-color: var(--accent-brass-soft);
  color: var(--accent-brass-ink);
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: 20px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* Main Content Area (Equal Margins & Bottom Clear for Floating Dock) */
.app-main {
  flex: 1 1 auto;
  width: 100%;
  max-width: var(--canvas-max);
  margin: 0 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 24px var(--edge-pad) 108px;
}

.reminder-strip {
  background-color: var(--sem-warn-bg);
  color: var(--sem-warn-ink);
  border: 1px solid rgba(180, 83, 9, 0.24);
  border-radius: var(--r-md);
  padding: 9px 14px;
  margin-bottom: 16px;
  font-size: var(--fs-md);
  line-height: 1.4;
}

.page-header {
  padding: 0 0 12px;
}

.page-header-inner {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.page-title-wrap { min-width: 0; }

.page-finding {
  font-size: var(--fs-body);
  color: var(--ink-secondary);
  margin: 0 0 18px;
  max-width: 100%;
  line-height: 1.5;
}

.page-content {
  width: 100%;
  padding: 0;
}

/* Filter Toolbar & Sync Popover (Tier MD 32px) */
.filter-periode {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.sync-indicator {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  border-radius: var(--ctl-r-md);
  border: 1px solid var(--border-ctl);
  background-color: var(--bg-surface);
  color: var(--ink-primary);
  font-size: var(--ctl-fs-md);
  font-weight: 500;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              transform var(--dur-press) var(--ease-out);
}

.sync-indicator:active {
  transform: scale(0.97);
}

.sync-indicator-text { white-space: nowrap; }

.sync-icon-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--sem-pos);
}

.sync-indicator.is-syncing .sync-icon {
  animation: _spin 900ms linear infinite;
  color: var(--accent-radar);
}

.sync-indicator.is-deferred {
  border-color: rgba(180, 83, 9, 0.4);
  background-color: var(--sem-warn-bg);
  color: var(--sem-warn-ink);
}

.sync-indicator.is-deferred .sync-icon-wrap { color: var(--sem-warn); }

.sync-indicator.is-stale {
  border-color: rgba(185, 28, 28, 0.35);
  background-color: var(--sem-crit-bg);
  color: var(--sem-crit-ink);
}

.sync-indicator.is-stale .sync-icon-wrap { color: var(--sem-crit); }

.sync-popover {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 296px;
  max-width: calc(100vw - 24px);
  padding: 14px;
  border-radius: var(--r-card);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  box-shadow: var(--shadow-popover);
  text-align: left;
  z-index: 140;
  animation: _modalIn var(--dur-fast) var(--ease-out);
}

.sync-pop-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: var(--fs-md);
  color: var(--ink-primary);
  margin-bottom: 4px;
}

.sync-pop-status { font-weight: 600; color: var(--ink-primary); }

.sync-pop-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: var(--sem-pos);
  flex-shrink: 0;
}

.sync-wrap:has(.sync-indicator.is-stale) .sync-pop-dot    { background-color: var(--sem-crit); }
.sync-wrap:has(.sync-indicator.is-deferred) .sync-pop-dot { background-color: var(--sem-warn); }

.sync-pop-data {
  font-size: var(--fs-sm);
  color: var(--ink-secondary);
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
  margin-bottom: 8px;
}

.sync-pop-sats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px 8px;
  padding: 8px 0;
  margin-bottom: 8px;
  border-top: 1px solid var(--border-rule);
  border-bottom: 1px solid var(--border-rule);
}

.sync-pop-sats:empty { display: none; }

.sync-pop-sat {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sync-pop-sat.is-on { color: var(--ink-primary); font-weight: 500; }

.sync-pop-sat-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--border-ctl);
  flex-shrink: 0;
}

.sync-pop-sat.is-on .sync-pop-sat-dot { background-color: var(--sem-pos); }

.sync-pop-btn {
  width: 100%;
  height: var(--ctl-h-md);
  justify-content: center;
}

.filter-box {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-mode {
  display: inline-flex;
  align-items: center;
  height: var(--ctl-h-md);
}

.filter-mode-btn {
  height: var(--ctl-h-md);
  padding: 0 var(--ctl-px-md);
  border: 1px solid var(--border-ctl);
  background-color: var(--bg-raised);
  font-size: var(--ctl-fs-md);
  font-weight: 500;
  color: var(--ink-secondary);
  transition: background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out);
}

.filter-mode-btn:first-child {
  border-radius: var(--ctl-r-md) 0 0 var(--ctl-r-md);
}

.filter-mode-btn:last-child {
  margin-left: -1px;
  border-radius: 0 var(--ctl-r-md) var(--ctl-r-md) 0;
}

.filter-mode-btn.active {
  position: relative;
  z-index: 1;
  background-color: var(--bg-surface);
  border-color: var(--accent-radar);
  color: var(--ink-primary);
  font-weight: 600;
}

.filter-mode-sep {
  width: 1px;
  height: 20px;
  background-color: var(--border-card);
}

.filter-inputs {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.filter-sel,
.filter-date {
  height: var(--ctl-h-md);
  padding: 0 10px;
  font-size: var(--ctl-fs-md);
  color: var(--ink-primary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-ctl);
  border-radius: var(--ctl-r-md);
}

.filter-sep {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
}

.filter-busy {
  display: none;
  align-items: center;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border-ctl);
  border-top-color: var(--accent-radar);
  border-radius: 50%;
  animation: _spin 750ms linear infinite;
}

/* ============================================================================
   6. SECTIONS, BANNERS, MESSAGES & SATELLITE TAGS
   ============================================================================ */
.content-section { margin-bottom: 24px; }

.content-section-hd {
  font-size: var(--fs-section);
  font-weight: 600;
  color: var(--ink-primary);
  letter-spacing: -0.005em;
  margin-bottom: 12px;
  line-height: 1.35;
}

.hd-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.hd-row > div:last-child {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.n-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: var(--r-card);
  padding: var(--card-pad);
}

.n-pad-muted {
  padding: 20px 24px;
  color: var(--ink-muted);
  font-size: var(--fs-body);
}

.n-info-static {
  padding: 12px 14px;
  border-radius: var(--r-lg);
  background-color: var(--bg-raised);
  border: 1px solid var(--border-card);
  color: var(--ink-secondary);
  font-size: var(--fs-md);
  line-height: 1.5;
}

.n-msg {
  display: none;
  padding: 10px 14px;
  border-radius: var(--r-lg);
  font-size: var(--fs-md);
  line-height: 1.45;
  margin-bottom: 14px;
  border: 1px solid transparent;
}

.n-msg.show { display: block; }

.n-msg.error {
  display: block;
  background-color: var(--sem-crit-bg);
  color: var(--sem-crit-ink);
  border-color: rgba(185, 28, 28, 0.25);
}

.n-msg.success {
  display: block;
  background-color: var(--sem-pos-bg);
  color: var(--sem-pos-ink);
  border-color: rgba(21, 128, 61, 0.25);
}

.n-msg.warn {
  display: block;
  background-color: var(--sem-warn-bg);
  color: var(--sem-warn-ink);
  border-color: rgba(180, 83, 9, 0.25);
}

.n-msg.info {
  display: block;
  background-color: var(--accent-radar-soft);
  color: var(--accent-radar-ink);
  border-color: rgba(11, 79, 108, 0.25);
}

/* Registration Queue Banner — Brass Top Accent (Zero thick left border) */
.dr-banner {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-top: 2px solid var(--accent-brass);
  border-radius: var(--r-card);
  padding: 14px 18px;
  margin-bottom: 20px;
}

.dr-banner-in {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.dr-banner-ic {
  width: 28px;
  height: 28px;
  border-radius: var(--r-sm);
  background-color: var(--accent-brass-soft);
  color: var(--accent-brass-ink);
  border: 1px solid rgba(180, 118, 31, 0.28);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}

.dr-banner-tx { flex: 1 1 auto; min-width: 200px; }
.dr-banner-t  { font-size: var(--fs-body); font-weight: 600; color: var(--ink-primary); }
.dr-banner-s  { font-size: var(--fs-sm); color: var(--ink-muted); }
.dr-banner-btn { margin-left: auto; }

.module-stub {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: var(--r-card);
  padding: 32px 24px;
  text-align: center;
  color: var(--ink-secondary);
}

.module-stub-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-primary);
  margin-bottom: 6px;
}

/* Status Pills & Satellite Tags */
.badge,
.n-badge,
.status-badge,
.sat-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--r-pill);
  font-size: var(--fs-sm);
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}

.badge-ok,
.badge-success,
.status-badge.aktif,
.status-badge.ok {
  background-color: var(--sem-pos-bg);
  color: var(--sem-pos-ink);
}

.badge-warn,
.status-badge.ditimpa,
.status-badge.warn {
  background-color: var(--sem-warn-bg);
  color: var(--sem-warn-ink);
}

.badge-danger,
.status-badge.dianulir,
.status-badge.crit {
  background-color: var(--sem-crit-bg);
  color: var(--sem-crit-ink);
}

.badge-neutral,
.status-badge.info {
  background-color: var(--sem-neut-bg);
  color: var(--sem-neut-ink);
}

.sat-tag {
  border-radius: var(--r-sm);
  font-weight: 600;
}

.sat-tag-sikap   { background-color: var(--sat-sikap-soft);   color: var(--sat-sikap); }
.sat-tag-nakhoda { background-color: var(--sat-nakhoda-soft); color: var(--sat-nakhoda); }
.sat-tag-pusat   { background-color: var(--sat-pusat-soft);   color: var(--accent-radar-ink); }
.sat-tag-radar   { background-color: var(--accent-radar-soft);color: var(--accent-radar-ink); }

/* ============================================================================
   7. BROADSHEET 4-KPI STRIP (2px Top Ink Rule + 1px Vertical Rules)
   ============================================================================ */
.ov-kpi-row {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-top: 2px solid var(--rail-bg);
  border-radius: var(--r-card);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  overflow: hidden;
}

.ov-kpi-row > .kpi-card {
  padding: 18px 20px;
  border-left: 1px solid var(--border-rule);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}

.ov-kpi-row > .kpi-card:first-child { border-left: none; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.kpi-grid > .kpi-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-top: 2px solid var(--rail-bg);
  border-radius: var(--r-card);
  padding: 18px 20px;
}

.kpi-source-row {
  margin-bottom: 6px;
}

.pk-head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.pk-sub {
  font-size: var(--fs-md);
  color: var(--ink-muted);
}

.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.kpi-label {
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kpi-main {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.kpi-val,
.kpi-value {
  font-size: var(--fs-kpi-num);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--ink-primary);
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}

.kpi-unit {
  font-size: var(--fs-md);
  font-weight: 500;
  color: var(--ink-muted);
  letter-spacing: 0;
}

.kpi-sub {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  margin-top: 6px;
}

.kpi-track {
  width: 100%;
  height: 4px;
  border-radius: var(--r-pill);
  background-color: var(--bg-raised);
  margin: 12px 0 10px;
  overflow: hidden;
}

.kpi-track-fill {
  height: 100%;
  border-radius: var(--r-pill);
  background-color: var(--accent-radar);
}

.kpi-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-rule);
  margin-top: auto;
  font-size: var(--fs-sm);
}

.kpi-foot-item { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.kpi-foot-item.right { margin-left: auto; text-align: right; }
.kpi-foot-lbl { color: var(--ink-muted); }
.kpi-foot-val { color: var(--ink-secondary); font-weight: 500; }

.ov-trend {
  font-size: var(--fs-sm);
  font-weight: 500;
  padding: 2px 7px;
  border-radius: var(--r-sm);
  white-space: nowrap;
}

.ov-trend.up   { background-color: var(--sem-pos-bg); color: var(--sem-pos-ink); }
.ov-trend.down { background-color: var(--sem-crit-bg); color: var(--sem-crit-ink); }
.ov-trend-cmp  { opacity: 0.85; font-weight: 400; }

/* ============================================================================
   8. 12-COLUMN DIVISION MATRIX & FEDERATED CARDS
   ============================================================================ */
.div-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
}

.div-card {
  grid-column: span 4;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: var(--r-card);
  padding: var(--card-pad);
  display: flex;
  flex-direction: column;
}

.div-card.s2   { grid-column: span 4; }
.div-card.s3   { grid-column: span 6; }
.div-card.s4   { grid-column: span 4; }
.div-card.s6,
.div-card.wide { grid-column: span 6; }

.div-card-title {
  font-size: var(--fs-section);
  font-weight: 600;
  color: var(--ink-primary);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-rule);
  margin-bottom: 12px;
}

.div-card-body {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  justify-content: space-between;
  gap: 14px;
}

.div-card-metrics { display: flex; flex-direction: column; gap: 10px; }
.div-metric-row   { display: flex; flex-direction: column; gap: 5px; }

.div-metric {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.div-metric-lbl   { font-size: var(--fs-md); color: var(--ink-secondary); }
.div-metric-right { display: inline-flex; align-items: center; gap: 6px; text-align: right; }
.div-metric-val   { font-size: var(--fs-body); font-weight: 600; color: var(--ink-primary); }
.div-metric-val.hero  { font-size: 18px; }
.div-metric-val.muted { color: var(--ink-muted); font-weight: 400; }
.div-metric-unit  { font-size: var(--fs-sm); font-weight: 400; color: var(--ink-muted); }

.div-metric-badge {
  font-size: var(--fs-sm);
  font-weight: 500;
  padding: 1px 6px;
  border-radius: var(--r-sm);
}

.div-metric-badge.ok   { background-color: var(--sem-pos-bg); color: var(--sem-pos-ink); }
.div-metric-badge.warn { background-color: var(--sem-warn-bg); color: var(--sem-warn-ink); }
.div-metric-badge.crit { background-color: var(--sem-crit-bg); color: var(--sem-crit-ink); }
.div-metric-badge.info { background-color: var(--accent-radar-soft); color: var(--accent-radar-ink); }

.div-micro-bar {
  width: 100%;
  height: 5px;
  border-radius: var(--r-sm);
  background-color: var(--bg-raised);
  overflow: hidden;
}

.div-micro-bar-fill {
  height: 100%;
  border-radius: var(--r-sm);
  background-color: var(--accent-radar);
}

.div-micro-bar-fill.warn { background-color: var(--sem-warn); }

.div-card-foot {
  padding-top: 12px;
  border-top: 1px solid var(--border-rule);
}

.div-card-foot-cap {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.div-card-foot-dots { display: flex; align-items: center; }

.ov-dots { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.ov-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: var(--bg-raised);
  border: 1px solid var(--border-ctl);
}

.ov-dot.on {
  background-color: var(--sem-pos);
  border-color: var(--sem-pos);
}

/* ============================================================================
   9. CHARTS, LINEAR BULLET LISTS & TACTICAL WPPNRI MAP (34 SHIPS)
   ============================================================================ */
.chart-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.chart-grid-asym {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
}

.cs-7 { grid-column: span 7; }
.cs-5 { grid-column: span 5; }

.chart-cell {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: var(--r-card);
  padding: var(--card-pad);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.chart-cell-hd {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.chart-cell-title {
  font-size: var(--fs-section);
  font-weight: 600;
  color: var(--ink-primary);
  line-height: 1.3;
}

.chart-cell-sub {
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  margin-top: 2px;
}

.chart-cell-chips {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.chart-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--ink-secondary);
}

.chart-chip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }

.chart-box { position: relative; min-height: 240px; width: 100%; }

.chart-empty {
  padding: 36px 20px;
  text-align: center;
  color: var(--ink-muted);
  font-size: var(--fs-md);
}

.ov-bars { display: flex; flex-direction: column; gap: 10px; }

.bar-line {
  display: grid;
  grid-template-columns: minmax(90px, 140px) 1fr auto;
  align-items: center;
  gap: 10px;
  font-size: var(--fs-md);
}

.bar-line.has-rank {
  grid-template-columns: 28px minmax(90px, 140px) 1fr auto;
}

.bar-rank { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-muted); }
.bar-rank.top { color: var(--accent-radar); }
.bar-line-lbl { color: var(--ink-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bar-line-track {
  height: 7px;
  border-radius: var(--r-sm);
  background-color: var(--bg-raised);
  overflow: hidden;
}

.bar-line-fill {
  height: 100%;
  border-radius: var(--r-sm);
  background-color: var(--accent-radar);
}

.bar-line-val  { font-weight: 600; color: var(--ink-primary); text-align: right; white-space: nowrap; }
.bar-line-unit { font-weight: 400; color: var(--ink-muted); font-size: var(--fs-sm); }

.ov-plot      { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ov-plot-bars { width: 100%; }
.ov-plot-legend { flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px; }

.legend-row { display: flex; align-items: center; gap: 8px; font-size: var(--fs-md); }
.legend-row i { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.legend-lbl { color: var(--ink-secondary); flex: 1 1 auto; }
.legend-val { font-weight: 600; color: var(--ink-primary); }
.legend-pct { color: var(--ink-muted); font-size: var(--fs-sm); min-width: 34px; text-align: right; }

.stk-wrap   { display: flex; flex-direction: column; gap: 8px; }
.stk-bar    { display: flex; height: 10px; border-radius: var(--r-sm); overflow: hidden; gap: 2px; background-color: var(--bg-raised); }
.stk-seg    { height: 100%; }
.stk-legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stk-item   { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-sm); color: var(--ink-secondary); }
.stk-item i { width: 8px; height: 8px; border-radius: 2px; }

/* Sub-Visualizations (.vz-*) */
.vz        { padding-top: 10px; border-top: 1px solid var(--border-rule); }
.vz-body   { min-height: 54px; }
.vz-empty  { font-size: var(--fs-sm); color: var(--ink-muted); padding: 10px 0; }
.vz-legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: var(--fs-sm); color: var(--ink-secondary); }
.vz-legend span { display: inline-flex; align-items: center; gap: 5px; }
.vz-legend i    { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

.vz-cols     { display: flex; flex-direction: column; }
.vz-bars     { display: flex; align-items: flex-end; gap: 8px; height: 100px; }
.vz-col      { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; height: 100%; }
.vz-col-bars { flex: 1 1 auto; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
.vz-bar-wrap { position: relative; flex: 1 1 0; max-width: 18px; height: 100%; display: flex; align-items: flex-end; }
.vz-bar      { width: 100%; border-radius: 2px 2px 0 0; }
.vz-bar-val  { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
.vz-col-lbl  { font-size: var(--fs-sm); color: var(--ink-muted); margin-top: 4px; }

.vz-donut        { display: flex; align-items: center; gap: 14px; }
.vz-donut-legend { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; }
.vz-hbars        { width: 100%; }
.vz-line         { display: flex; flex-direction: column; width: 100%; }
.vz-line-plot    { height: 96px; width: 100%; }
.vz-line-plot svg { width: 100%; height: 100%; display: block; }
.vz-line-x       { display: grid; font-size: var(--fs-sm); color: var(--ink-muted); text-align: center; margin-top: 4px; }

.vz-waffle   { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.vz-waffle i { display: block; aspect-ratio: 1 / 1; border-radius: 2px; }

.vz-heat      { display: grid; gap: 4px; }
.vz-heat-unit { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.vz-heat-cell { width: 100%; height: 24px; border-radius: 3px; background-color: var(--bg-raised); display: flex; align-items: center; justify-content: center; font-size: var(--fs-sm); font-weight: 500; }
.vz-heat-cell.zero { background-color: var(--bg-raised); }
.vz-heat-lbl  { font-size: var(--fs-sm); color: var(--ink-muted); }

.vz-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.vz-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-sm); background-color: var(--bg-raised); color: var(--ink-secondary); font-size: var(--fs-sm); }
.vz-chip i { width: 6px; height: 6px; border-radius: 50%; background-color: var(--ink-faint); }
.vz-chip.on { background-color: var(--sem-pos-bg); color: var(--sem-pos-ink); }
.vz-chip.on i { background-color: var(--sem-pos); }

/* Map & Ship Markers */
.ov-map-cell { gap: 12px; }

.ov-map-chips,
.ov-fleet-filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.ov-map-chip,
.ov-fleet-chip {
  height: var(--ctl-h-sm);
  padding: 0 10px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-ctl);
  background-color: var(--bg-surface);
  color: var(--ink-secondary);
  font-size: var(--fs-sm);
  font-weight: 500;
  transition: background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out);
}

.ov-map-chip.is-on,
.ov-fleet-chip.is-on {
  background-color: var(--action-primary);
  border-color: var(--action-primary);
  color: #FFFFFF;
}

.ov-map-wrap { position: relative; width: 100%; }

#ov-map {
  width: 100%;
  height: 420px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border-card);
  background-color: #E7EEF2;
  position: relative;
  z-index: 1;
  isolation: isolate;
}

#ov-map .leaflet-container,
.leaflet-container {
  isolation: isolate;
  z-index: 1;
  font-family: var(--font-sans) !important;
}

.ops-map-status {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: rgba(239, 244, 247, 0.90);
  z-index: 10;
  border-radius: var(--r-lg);
}

.ops-map-status-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  font-size: var(--fs-md);
  color: var(--ink-secondary);
  text-align: center;
}

.ov-map-legend {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 400;
  background-color: rgba(255, 255, 255, 0.96);
  border: 1px solid var(--border-card);
  border-radius: var(--r-md);
  padding: 8px 10px;
  font-size: var(--fs-sm);
  color: var(--ink-secondary);
}

.ov-map-legend-title { font-weight: 600; color: var(--ink-primary); margin-bottom: 4px; }
.ov-map-legend-row   { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.ov-map-legend-row i { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(20, 25, 31, 0.16); }

.ov-map-rank       { padding-top: 12px; border-top: 1px solid var(--border-rule); }
.ov-map-rank-hd    { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-muted); margin-bottom: 8px; }
.ov-map-rank-list  { display: flex; flex-direction: column; gap: 6px; }

.ov-map-rank-row {
  display: grid;
  grid-template-columns: 22px 110px 1fr 48px;
  align-items: center;
  gap: 10px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: var(--fs-md);
}

.ov-map-rank-no  { color: var(--ink-muted); font-weight: 500; }
.ov-map-rank-nm  { color: var(--ink-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-map-rank-bar { height: 6px; border-radius: var(--r-sm); background-color: var(--bg-raised); overflow: hidden; }
.ov-map-rank-bar i { display: block; height: 100%; border-radius: var(--r-sm); background-color: var(--accent-radar); }
.ov-map-rank-val { text-align: right; font-weight: 600; color: var(--ink-primary); }
.ov-map-rank-empty,
.ov-map-rank-note { font-size: var(--fs-sm); color: var(--ink-muted); margin-top: 6px; }

.ship-marker-wrap { background: transparent; border: none; }

.ship-marker {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px 2px 4px;
  border-radius: var(--r-sm);
  background-color: #FFFFFF;
  border: 1px solid var(--border-ctl);
  box-shadow: 0 2px 6px rgba(14, 23, 34, 0.18);
}

.ship-marker-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid #FFFFFF;
  flex-shrink: 0;
  background-color: var(--accent-radar);
}

.ship-marker.status-op .ship-marker-dot       { background-color: var(--accent-radar); }
.ship-marker.status-siap .ship-marker-dot     { background-color: var(--sem-pos); }
.ship-marker.status-galangan .ship-marker-dot { background-color: var(--sem-warn); }

.ship-beacon-pulse {
  position: absolute;
  left: 3px;
  top: 50%;
  width: 11px;
  height: 11px;
  margin-top: -5.5px;
  border-radius: 50%;
  background-color: rgba(11, 79, 108, 0.14);
  border: 1px solid rgba(11, 79, 108, 0.42);
  pointer-events: none;
}

.ship-marker-lbl { font-size: 12px; font-weight: 600; color: var(--ink-primary); white-space: nowrap; line-height: 1.1; }

.n-leaflet-pop .leaflet-popup-content-wrapper {
  border-radius: var(--r-card);
  padding: 0;
  box-shadow: var(--shadow-popover);
  border: 1px solid var(--border-card);
}

.n-leaflet-pop .leaflet-popup-content { margin: 0; min-width: 240px; }

.ship-popover { font-family: var(--font-sans); color: var(--ink-primary); }
.ship-pop-hd  { padding: 12px 14px 10px; border-bottom: 1px solid var(--border-rule); }
.ship-pop-badge { display: inline-block; font-size: var(--fs-sm); font-weight: 500; padding: 2px 8px; border-radius: var(--r-sm); margin-bottom: 6px; }
.ship-pop-name { font-size: 14px; font-weight: 600; color: var(--ink-primary); }
.ship-pop-sub  { font-size: var(--fs-sm); color: var(--ink-muted); }
.ship-pop-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.ship-pop-row  { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-sm); }
.ship-pop-lbl  { color: var(--ink-muted); }
.ship-pop-val  { color: var(--ink-primary); text-align: right; }

.ship-pop-benchmark { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border-rule); display: flex; flex-direction: column; gap: 4px; }
.ship-bm-row  { display: flex; justify-content: space-between; font-size: var(--fs-sm); color: var(--ink-secondary); }
.ship-bm-bar  { height: 5px; border-radius: var(--r-sm); background-color: var(--bg-raised); overflow: hidden; }
.ship-bm-fill { height: 100%; background-color: var(--accent-radar); }
.ship-bm-fill.ship-bm-center { background-color: var(--sat-sikap); }
.ship-pop-ft { padding: 8px 14px 12px; border-top: 1px solid var(--border-rule); text-align: right; }

/* ============================================================================
   10. FLUSH UNDERLINE TABS & STATISTICAL PUBLICATION TABLES
   ============================================================================ */
.n-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  border-bottom: 1px solid var(--border-card);
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.n-tab {
  height: 36px;
  padding: 0 14px;
  font-size: var(--fs-md);
  font-weight: 500;
  color: var(--ink-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out);
}

.n-tab.active {
  color: var(--ink-primary);
  font-weight: 600;
  border-bottom-color: var(--action-primary);
}

.n-table-wrap { width: 100%; overflow-x: auto; }

.n-table {
  width: 100%;
  border-collapse: collapse;
  background-color: var(--bg-surface);
  font-size: var(--fs-md);
}

.n-table-full { width: 100%; }

.n-table thead th {
  height: 36px;
  padding: 8px 14px;
  text-align: left;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-secondary);
  background-color: var(--bg-header);
  border-bottom: 1.5px solid var(--rail-bg);
  white-space: nowrap;
}

.n-table thead th.text-right,
.n-table tbody td.text-right { text-align: right; }
.n-table thead th.text-center,
.n-table tbody td.text-center { text-align: center; }

.n-table tbody td {
  min-height: 44px;
  padding: 11px 14px;
  color: var(--ink-primary);
  border-bottom: 1px solid var(--border-rule);
  vertical-align: middle;
}

.n-table tbody tr:last-child td { border-bottom: none; }
.hist-row-void td { background-color: #FEF2F2; }
.hist-row-ditampa td { opacity: 0.72; }
.hist-void-note td { background-color: #FEF2F2; color: var(--sem-crit-ink); font-size: var(--fs-sm); padding: 6px 14px 10px; }
.hist-empty { padding: 28px 20px; text-align: center; color: var(--ink-muted); font-size: var(--fs-md); }
.hist-section-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.hd-k { width: 160px; color: var(--ink-muted); font-weight: 500; }
.hd-v { color: var(--ink-primary); word-break: break-word; }

.md-pane-hd { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.md-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.md-chip    { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background-color: var(--bg-surface); border: 1px solid var(--border-card); border-radius: var(--r-md); font-size: var(--fs-md); }
.md-chip .lbl { color: var(--ink-muted); }
.md-chip .val { font-weight: 600; color: var(--ink-primary); }

/* ============================================================================
   11. KAPAL TERBAIK (Podium & Leaderboard)
   ============================================================================ */
.kt-page-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.kt-toolbar-left,
.kt-toolbar-right,
.kt-filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kt-filter-lbl   { font-size: var(--fs-md); color: var(--ink-muted); font-weight: 500; }

.kt-page-toolbar .btn,
.kt-page-toolbar .kt-back-btn,
.kt-page-toolbar .kt-btn-refresh,
.kt-page-toolbar .kt-select {
  height: var(--ctl-h-md);
  font-size: var(--ctl-fs-md);
  border-radius: var(--ctl-r-md);
}

.kt-select      { width: auto; min-width: 112px; }
.kt-btn-refresh { width: var(--ctl-h-md); padding: 0; }

.kt-podium-wrapper { margin-bottom: 24px; }

.kt-podium-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: end;
  gap: 16px;
}

.kt-podium-slot { display: flex; flex-direction: column; }

.kt-pedestal-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-top: 3px solid var(--border-ctl);
  border-radius: var(--r-card) var(--r-card) 0 0;
  padding: 18px 20px;
}

.kt-podium-slot.is-gold .kt-pedestal-card   { border-top-color: var(--accent-brass); padding-top: 22px; }
.kt-podium-slot.is-silver .kt-pedestal-card { border-top-color: #64748B; }
.kt-podium-slot.is-bronze .kt-pedestal-card { border-top-color: #9A3412; }

.kt-card-badge-wrap { margin-bottom: 8px; }

.kt-medal-badge {
  display: inline-block;
  font-size: var(--fs-sm);
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--r-sm);
  background-color: var(--bg-raised);
  color: var(--ink-secondary);
}

.kt-medal-badge.is-gold   { background-color: var(--accent-brass-soft); color: var(--accent-brass-ink); }
.kt-medal-badge.is-silver { background-color: var(--bg-raised);   color: var(--ink-primary); }
.kt-medal-badge.is-bronze { background-color: var(--sat-nakhoda-soft); color: var(--sat-nakhoda); }

.kt-card-title { font-size: 16px; font-weight: 600; color: var(--ink-primary); }
.kt-card-sub   { font-size: var(--fs-sm); color: var(--ink-muted); margin-top: 2px; }

.kt-hero-score { display: flex; align-items: baseline; gap: 6px; margin: 14px 0 12px; }

.kt-hero-score-val {
  font-size: var(--fs-hero-num);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.05;
  color: var(--ink-primary);
}

.kt-hero-score-unit { font-size: var(--fs-sm); color: var(--ink-muted); }
.kt-hero-chips      { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.kt-hero-chip       { font-size: var(--fs-sm); color: var(--ink-secondary); background-color: var(--bg-ground); padding: 3px 8px; border-radius: var(--r-sm); }
.kt-card-btn        { padding-left: 0; color: var(--accent-radar); }

.kt-pedestal-block {
  background-color: var(--bg-raised);
  border: 1px solid var(--border-card);
  border-top: none;
  border-radius: 0 0 var(--r-card) var(--r-card);
  padding: 6px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.kt-podium-slot.is-gold .kt-pedestal-block   { padding: 12px 16px; }
.kt-podium-slot.is-silver .kt-pedestal-block { padding: 8px 16px; }
.kt-pedestal-rank { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-muted); }

.kt-table-section {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: var(--r-card);
  overflow: hidden;
}

.kt-table-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-rule);
  flex-wrap: wrap;
}

.kt-table-search { width: 280px; max-width: 100%; }
.kt-table-wrap   { width: 100%; }
.kt-table        { width: 100%; border-collapse: collapse; }
.kt-table th,
.kt-table td     { vertical-align: middle; }

.cell-rank { width: 48px; font-weight: 600; color: var(--ink-muted); }
.rank-gold   { color: var(--accent-brass); }
.rank-silver { color: #475569; }
.rank-bronze { color: #9A3412; }

.kt-ship-cell  { display: flex; flex-direction: column; }
.kt-ship-name  { color: var(--ink-primary); }
.kt-ship-class { color: var(--ink-muted); }
.kt-com-cell   { display: flex; flex-direction: column; }
.kt-com-name   { color: var(--ink-primary); }
.kt-com-base   { color: var(--ink-muted); }
.cell-score    { min-width: 120px; }

.kt-score-inline { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.kt-score-num    { font-weight: 600; color: var(--ink-primary); }
.kt-score-meter  { width: 60px; height: 5px; border-radius: var(--r-sm); background-color: var(--bg-raised); overflow: hidden; }
.kt-meter-fill   { height: 100%; background-color: var(--accent-radar); }

/* ============================================================================
   12. MODALS, RIGHT DRAWER, ATTACHMENTS & SONNER TOASTER (Zero Glass Blur)
   ============================================================================ */
.n-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(14, 23, 34, 0.50);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
  z-index: 200;
}

.n-z-drawer { z-index: 180; }

.n-modal {
  position: relative;
  width: 100%;
  max-width: 520px;
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: var(--r-card);
  padding: 24px;
  box-shadow: var(--shadow-modal);
  animation: _modalIn var(--dur-modal) var(--ease-out);
}

.n-modal h2 { margin-bottom: 14px; }

.n-modal-hd {
  max-width: 640px;
  max-height: 85dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 0;
}

.n-modal-hd-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-rule);
}

.n-modal-hd-head h2 { margin-bottom: 0; }
.n-modal-hd-scroll  { padding: 18px 20px; overflow-y: auto; }

@keyframes _modalIn {
  from {
    opacity: 0;
    transform: scale(0.97) translateY(6px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.form-loading-overlay {
  position: absolute;
  inset: 0;
  background-color: rgba(255, 255, 255, 0.90);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: var(--r-card);
  z-index: 20;
}

.form-loading-overlay.show { display: flex; }
.loading-text { font-size: var(--fs-md); font-weight: 500; color: var(--ink-secondary); }

.modal-success {
  padding: 28px 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.ms-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background-color: var(--sem-pos-bg);
  color: var(--sem-pos);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ms-icon svg { width: 22px; height: 22px; stroke-width: 2.2; }
.ms-title    { font-size: 16px; font-weight: 600; color: var(--ink-primary); }
.ms-sub      { font-size: var(--fs-md); color: var(--ink-secondary); }
.ms-auto     { font-size: var(--fs-sm); color: var(--ink-muted); }

/* Right Drawer */
.n-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 460px;
  max-width: 100vw;
  background-color: var(--bg-surface);
  border-left: 1px solid var(--border-card);
  box-shadow: var(--shadow-modal);
  z-index: 190;
  display: flex;
  flex-direction: column;
  animation: _drawerIn var(--dur-drawer) var(--ease-drawer);
}

@keyframes _drawerIn {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}

.sheet-grabber {
  display: none;
  width: 36px;
  height: 4px;
  border-radius: var(--r-pill);
  background-color: var(--border-ctl);
  margin: 8px auto 0;
}

.n-drawer-hd {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border-rule);
}

.n-drawer-sub { font-size: var(--fs-sm); color: var(--ink-muted); margin-top: 2px; }

.n-drawer-bd {
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px 20px;
}

/* Inline Evidence Uploader */
.attach-row    { margin-bottom: 10px; }
.attach-check  { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-md); color: var(--ink-secondary); cursor: pointer; }
.attach-fields { display: grid; gap: 10px; }
.attach-list   { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--r-md);
  background-color: var(--bg-raised);
  border: 1px solid var(--border-card);
  font-size: var(--fs-sm);
  color: var(--ink-primary);
}

.attach-chip b { color: var(--accent-radar); font-weight: 600; }
.attach-retry  { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Sonner Floating Toaster */
#n-toaster {
  position: fixed;
  right: 20px;
  bottom: 84px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 340px;
  max-width: calc(100vw - 32px);
  pointer-events: none;
}

.sonner-toast {
  pointer-events: auto;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--r-card);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-card);
  box-shadow: var(--shadow-popover);
  color: var(--ink-primary);
}

.sonner-toast.enter { animation: _toastIn var(--dur-modal) var(--ease-out); }

.sonner-toast.exit {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity var(--dur-fast) var(--ease-out),
              transform var(--dur-fast) var(--ease-out);
}

@keyframes _toastIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.sonner-toast-icon {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  margin-top: 1px;
  color: var(--accent-radar);
}

.sonner-toast.success .sonner-toast-icon { color: var(--sem-pos); }
.sonner-toast.error   .sonner-toast-icon { color: var(--sem-crit); }
.sonner-toast.warning .sonner-toast-icon { color: var(--sem-warn); }

.sonner-toast-content { flex: 1 1 auto; min-width: 0; }
.sonner-toast-title   { font-size: var(--fs-md); font-weight: 500; line-height: 1.4; }
.sonner-toast-desc    { font-size: var(--fs-sm); color: var(--ink-muted); margin-top: 2px; }

.sonner-toast-action {
  height: var(--ctl-h-sm);
  padding: 0 10px;
  border-radius: var(--ctl-r-sm);
  background-color: var(--action-primary);
  color: #FFFFFF;
  font-size: var(--fs-sm);
  font-weight: 500;
  flex-shrink: 0;
}

/* ============================================================================
   13. CAPABILITY GATING, RESPONSIVE BREAKPOINTS & ACCESSIBILITY
   ============================================================================ */
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover:not(:disabled)      { background-color: var(--action-primary-hover); border-color: var(--action-primary-hover); }
  .btn-secondary:hover:not(:disabled),
  .btn-outline:hover:not(:disabled),
  .btn-mini:hover:not(:disabled)         { background-color: var(--bg-header); border-color: var(--ink-faint); }
  .btn-ghost:hover:not(:disabled),
  .btn-sm-ghost:hover:not(:disabled),
  .n-iconbtn-x:hover:not(:disabled)      { background-color: var(--bg-raised); color: var(--ink-primary); }
  .btn-danger:hover:not(:disabled)       { background-color: #FECACA; }
