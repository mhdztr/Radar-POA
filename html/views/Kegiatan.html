<!-- html/views/Kegiatan.html -->
<!--
  Modul Kegiatan Direktorat (Lintas Divisi).
  Di-include ke Index.html via html_include(), dirender oleh _renderKegiatan().
-->
<div id="view-tpl-kegiatan" hidden>

  <!-- ── RINGKASAN BROADSHEET ──────────────────────── -->
  <div class="content-section">
    <div id="kgd-kpi-strip">
      <!-- diisi _kgdRenderKPI() -->
    </div>
  </div>

  <!-- ── DAFTAR KEGIATAN DIREKTORAT ───────────────── -->
  <div class="content-section">
    <div class="sec-hd-bar">
      <div class="content-section-hd sec-hd-flush">Daftar Kegiatan Direktorat</div>
      <div class="ctl-row ctl-md">
        <button type="button" class="btn-primary" id="kgd-btn-open-form" onclick="kgdOpenForm()">Catat Kegiatan</button>
      </div>
    </div>

    <div class="sec-filter-bar">
      <div class="n-tabs" id="kgd-status-tabs">
        <button type="button" class="n-tab active" data-status="ALL" onclick="_kgdSetTab('ALL')">Semua</button>
        <button type="button" class="n-tab" data-status="ACTIVE" onclick="_kgdSetTab('ACTIVE')">Aktif</button>
        <button type="button" class="n-tab" data-status="SUPERSEDED" onclick="_kgdSetTab('SUPERSEDED')">Ditimpa</button>
        <button type="button" class="n-tab" data-status="VOID" onclick="_kgdSetTab('VOID')">Dianulir</button>
      </div>
      <input type="search" id="kgd-search-input" class="sec-search" placeholder="Cari judul atau pihak hadir" aria-label="Cari kegiatan direktorat" oninput="_kgdOnSearch(this.value)">
    </div>

    <div id="kgd-history-msg" class="n-msg"></div>
    <div class="sec-table-card" id="kgd-history-wrap">
      <div class="n-pad-muted">Memuat kegiatan&hellip;</div>
    </div>
  </div>

  <!-- ── MODAL — CATAT KEGIATAN DIREKTORAT ────────── -->
  <div class="n-overlay n-hidden" id="modal-kgd-form">
    <div class="n-modal modal-w-md">
      <h2>Catat Kegiatan Direktorat</h2>
      <div id="kgd-form-msg" class="n-msg"></div>

      <div class="form-grp">
        <label for="kgd-judul">Judul Kegiatan <span class="req-star">*</span></label>
        <input type="text" id="kgd-judul" placeholder="Contoh: Rapat Persiapan Pre-Award Meeting" maxlength="200">
      </div>
      <div class="form-grp">
        <label for="kgd-tanggal">Tanggal <span class="req-star">*</span></label>
        <input type="date" id="kgd-tanggal" class="date-picker-locked" onkeydown="return false" onpaste="return false" ondrop="return false" onclick="_openDatePicker(this)" onfocus="_openDatePicker(this)">
      </div>
      <div class="form-grp">
        <label for="kgd-deskripsi">Deskripsi <span class="req-star">*</span></label>
        <textarea id="kgd-deskripsi" rows="3" placeholder="Latar belakang dan hasil kegiatan"></textarea>
      </div>
      <div class="form-grp">
        <label for="kgd-pihak">Pihak yang Hadir <span class="opt-lbl">(opsional)</span></label>
        <input type="text" id="kgd-pihak" placeholder="Contoh: Timja Pengawakan, Tim ABT, mitra kerja">
      </div>

      <div id="kgd-attach" class="mt-sm"></div>

      <div class="ctl-row ctl-lg ctl-fill mt-lg">
        <button type="button" class="btn-primary" id="kgd-btn-submit" onclick="kgdSubmit()">Simpan Kegiatan</button>
        <button type="button" class="btn-outline" onclick="closeModal('modal-kgd-form')">Batal</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL — REVISI KEGIATAN ──────────────────── -->
  <div class="n-overlay n-hidden" id="modal-kgd-revisi">
    <div class="n-modal modal-w-md">
      <h2>Revisi Kegiatan</h2>
      <div id="kgd-revisi-info" class="modal-info-sub"></div>
      <div id="kgd-revisi-msg" class="n-msg"></div>

      <div class="form-grp">
        <label for="rv-kgd-judul">Judul Kegiatan <span class="req-star">*</span></label>
        <input type="text" id="rv-kgd-judul" maxlength="200">
      </div>
      <div class="form-grp">
        <label for="rv-kgd-tanggal">Tanggal <span class="req-star">*</span></label>
        <input type="date" id="rv-kgd-tanggal" class="date-picker-locked" onkeydown="return false" onpaste="return false" ondrop="return false" onclick="_openDatePicker(this)" onfocus="_openDatePicker(this)">
      </div>
      <div class="form-grp">
        <label for="rv-kgd-deskripsi">Deskripsi <span class="req-star">*</span></label>
        <textarea id="rv-kgd-deskripsi" rows="3"></textarea>
      </div>
      <div class="form-grp">
        <label for="rv-kgd-pihak">Pihak yang Hadir</label>
        <input type="text" id="rv-kgd-pihak">
      </div>
      <div class="form-grp">
        <label for="rv-kgd-alasan">Alasan Revisi <span class="req-star">*</span></label>
        <input type="text" id="rv-kgd-alasan" placeholder="Jelaskan bagian yang diperbarui">
      </div>
      <div id="kgd-revisi-attach"></div>

      <div class="ctl-row ctl-lg ctl-fill mt-lg">
        <button type="button" class="btn-primary" id="kgd-btn-revisi-save" onclick="kgdRevisiConfirm()">Simpan Revisi</button>
        <button type="button" class="btn-outline" onclick="closeModal('modal-kgd-revisi')">Batal</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL — ANULIR KEGIATAN ──────────────────── -->
  <div class="n-overlay n-hidden" id="modal-kgd-anulir">
    <div class="n-modal modal-w-sm">
      <h2>Anulir Kegiatan</h2>
      <div id="kgd-anulir-info" class="modal-info-sub"></div>
      <div id="kgd-anulir-msg" class="n-msg"></div>

      <div class="n-info-static mb-md">
        Alasan anulir terlihat oleh seluruh pejabat dengan akses modul ini. Entri yang dibatalkan tetap tercatat di daftar dengan status Dianulir.
      </div>
      <div class="form-grp">
        <label for="an-kgd-alasan">Alasan Anulir <span class="req-star">*</span></label>
        <input type="text" id="an-kgd-alasan" placeholder="Tuliskan alasan pembatalan kegiatan">
      </div>

      <div class="ctl-row ctl-lg ctl-fill mt-lg">
        <button type="button" class="btn-danger-solid" id="kgd-btn-anulir-save" onclick="kgdAnulirConfirm()">Anulir Kegiatan</button>
        <button type="button" class="btn-outline" onclick="closeModal('modal-kgd-anulir')">Batal</button>
      </div>
    </div>
  </div>

</div><!-- /view-tpl-kegiatan -->
