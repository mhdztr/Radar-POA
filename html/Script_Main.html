        '</div>' +
        '<div class="kpi-foot-item right">' +
        (opt.foot.right.lbl ? '<span class="kpi-foot-lbl">' + _esc(opt.foot.right.lbl) + '</span> ' : '') +
        '<span class="kpi-foot-val">' + _esc(opt.foot.right.val) + '</span>' +
        '</div>' +
        '</div>';
    } else if (sub) {
      var parts = String(sub).split(/\s*[·\u00B7]\s*/);
      if (parts.length >= 2) {
        footHtml = '<div class="kpi-foot">' +
          '<div class="kpi-foot-item"><span class="kpi-foot-val">' + _esc(parts[0]) + '</span></div>' +
          '<div class="kpi-foot-item right"><span class="kpi-foot-val">' + _esc(parts[1]) + '</span></div>' +
          '</div>';
      } else {
        footHtml = '<div class="kpi-foot">' +
          '<div class="kpi-foot-item"><span class="kpi-foot-lbl">' + _esc(sub) + '</span></div>' +
          '</div>';
      }
    }

    var sourceHtml = opt.source
      ? '<div class="kpi-source-row"><span class="kpi-src"><i class="kpi-src-dot dot-' + _esc(opt.sourceTone || 'radar') + '"></i>' + _esc(opt.source) + '</span></div>'
      : '';

    var progressHtml = '';
    if (opt.progress && hasData && !isNaN(Number(opt.progress.pct))) {
      var pPct = Math.min(100, Math.max(0, Math.round(Number(opt.progress.pct))));
      var pToneCls = opt.progress.tone === 'sikap' ? ' is-sikap' : '';
      progressHtml = '<div class="kpi-micro-track"><div class="kpi-micro-fill' + pToneCls + '" style="width:' + pPct + '%;"></div></div>';
    }

    return '<div class="kpi-card">' +
      sourceHtml +
      '<div class="kpi-head">' +
      '<div class="kpi-label" title="' + _esc(label) + '">' + _esc(label) + '</div>' +
      trendHtml +
      '</div>' +
      '<div class="kpi-value">' + value +
      (unit ? '<span class="kpi-unit">' + _esc(unit) + '</span>' : '') +
      '</div>' +
      progressHtml +
      footHtml +
      '</div>';
  }

  // ── Visual mini KPI (SVG inline; palet token tema, tanpa axis) ──

  // Gauge cincin % (DESIGN §10.2: pengganti gauge analog; tetap baca jelas lewat angka).
  function _ovRing(pct, size) {
    size = size || 68;
    var r = (size - 12) / 2;
    var c = 2 * Math.PI * r;
    var filled = Math.max(0, Math.min(100, Number(pct) || 0)) / 100 * c;
    var cx = size / 2, cy = size / 2;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--n-surface-2)" stroke-width="8"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--n-primary)" stroke-width="8" stroke-linecap="round" ' +
      'stroke-dasharray="' + filled.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
      '<text x="' + cx + '" y="' + cy + '" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(size * 0.26) + '" font-weight="600" fill="var(--n-text-primary)">' + Math.round(pct) + '%</text>' +
      '</svg>';
  }

  // Sparkline area seri bulanan (Jan → terpilih); disembunyikan bila < 2 titik.
  function _ovSpark(series, color, fillColor) {
    var nums = (series || []).map(function (n) { return Number(n) || 0; });
    if (nums.length < 2 || nums.every(function (n) { return n === 0; })) return '';
    var w = 120, h = 40, pad = 3;
    var max = Math.max.apply(null, nums.concat([1]));
    var stepX = (w - pad * 2) / (nums.length - 1);
    var pts = nums.map(function (n, i) {
      return [pad + i * stepX, h - pad - (n / max) * (h - pad * 2)];
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + (p[1].toFixed(1)); }).join(' ');
    var area = line + ' L' + (w - pad).toFixed(1) + ' ' + (h - pad) + ' L' + pad + ' ' + (h - pad) + ' Z';
    var last = pts[pts.length - 1];
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + area + '" fill="' + (fillColor || 'rgba(11,79,108,0.14)') + '" stroke="none"/>' +
      '<path d="' + line + '" fill="none" stroke="' + (color || 'var(--n-primary)') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<rect x="' + (last[0] - 3) + '" y="' + (last[1] - 3) + '" width="6" height="6" rx="3" fill="' + (color || 'var(--n-primary)') + '"/>' +
      '</svg>';
  }

  // Strip batang nilai total (6 bulan terakhir) — konteks tren cepat.
  function _ovMiniBars(values, color) {
    var nums = (values || []).map(function (n) { return Number(n) || 0; });
    if (!nums.length) return '';
    nums = nums.slice(-6);
    var max = Math.max.apply(null, nums.concat([1]));
    var bw = 10, gap = 5, h = 40, padT = 6;
    var w = nums.length * (bw + gap) + 10;
    var bars = nums.map(function (v, i) {
      var hh = Math.max(2, (v / max) * (h - padT - 3));
      var x = 5 + i * (bw + gap);
      return '<rect x="' + x + '" y="' + (h - hh - 3) + '" width="' + bw + '" height="' + hh + '" rx="2.5" fill="' + (color || 'var(--n-primary)') + '"/>';
    }).join('');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + bars + '</svg>';
  }

  // Donut komposisi (<=4 irisan) + angka tengah; segmen 0 dilewati, total <= 0 -> hidden.
  function _ovDonut(segs, size, center, subLabel) {
    var total = _ovSegTotal(segs);
    if (total <= 0) return '';
    size = size || 76;
    var r = (size - 14) / 2;
    var c = 2 * Math.PI * r;
    var cx = size / 2, cy = size / 2, sw = size > 100 ? 15 : 12;
    var off = 0;
    var arcs = segs.filter(function (s) { return (Number(s.val) || 0) > 0; }).map(function (s) {
      var len = (Number(s.val) || 0) / total * c;
      var el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + _ovTone(s.tone) + '" stroke-width="' + sw + '" ' +
        'stroke-dasharray="' + Math.max(1, len - 2).toFixed(1) + ' ' + (c - len + 2).toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '" ' +
        'transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      off += len + 2;
      return el;
    }).join('');
    var subText = (subLabel && size > 100) ? (
      '<text x="' + cx + '" y="' + (cy + 17) + '" text-anchor="middle" font-size="12" font-weight="500" letter-spacing="-0.01em" fill="var(--n-text-secondary)">' + _esc(subLabel) + '</text>'
    ) : '';
    var numY = (subLabel && size > 100) ? (cy - 7) : cy;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + arcs +
      '<text x="' + cx + '" y="' + numY + '" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(size * (subLabel ? 0.22 : 0.24)) + '" font-weight="600" fill="var(--n-text-primary)">' + _esc(String(center !== undefined ? center : '')) + '</text>' +
      subText +
      '</svg>';
  }

  // Deretan titik status (7 divisi melapor) — isi = melapor.
  function _ovDots(items) {
    if (!items || !items.length) return '';
    return '<div class="ov-dots">' + items.map(function (it) {
      var st = it.melapor ? ' on' : '';
      return '<span class="ov-dot' + st + '" title="' + _esc(it.label) + (it.melapor ? '\u2014 melapor' : '\u2014 belum melapor') + '"></span>';
    }).join('') + '</div>';
  }

  // Baris batang horizontal (label + track + nilai) — kapal teraktif / stok.
  function _ovBars(items, opt) {
    if (!items || !items.length) return '';
    opt = opt || {};
    var max = Math.max.apply(null, items.map(function (it) { return Number(it.val) || 0; }).concat([1]));
    return '<div class="ov-bars">' + items.map(function (it, idx) {
      var pct = Math.max(3, (Number(it.val) || 0) / max * 100);
      var rankHtml = opt.ranked ? (
        '<span class="bar-rank' + (idx === 0 ? ' top' : '') + '">#' + (idx + 1) + '</span>'
      ) : '';
      var unitHtml = opt.unit ? (
        ' <span class="bar-line-unit">' + _esc(opt.unit) + '</span>'
      ) : '';
      return '<div class="bar-line' + (opt.ranked ? ' has-rank' : '') + '">' +
        rankHtml +
        '<div class="bar-line-lbl" title="' + _esc(it.label) + '">' + _esc(it.label) + '</div>' +
        '<div class="bar-line-track"><div class="bar-line-fill" style="width:' + pct + '%;background:' + _ovTone(it.tone) + ';"></div></div>' +
        '<div class="bar-line-val">' + _idNum(it.val) + unitHtml + '</div>' +
        '</div>';
    }).join('') + '</div>';
  }

  function _ovSegTotal(segs) {
    return (segs || []).reduce(function (a, s) { return a + (Number(s.val) || 0); }, 0);
  }

  // Plot donut + legenda untuk sel chart (DESIGN §6.3: komposisi → donut ≤4).
  function _ovPlotDonut(segs, size, subLabel) {
    var total = _ovSegTotal(segs);
    if (total <= 0) return '';
    var donut = _ovDonut(segs, size || 160, _idNum(total), subLabel || 'Kapal');
    var legend = segs.filter(function (s) { return (Number(s.val) || 0) > 0; }).map(function (s) {
      var pct = Math.round((Number(s.val) || 0) / total * 100);
      return '<div class="legend-row">' +
        '<i style="background:' + _ovTone(s.tone) + ';"></i>' +
        '<span class="legend-lbl">' + _esc(s.label) + '</span>' +
        '<span class="legend-val">' + _idNum(s.val) + '</span>' +
        '<span class="legend-pct">' + pct + '%</span>' +
        '</div>';
    }).join('');
    return '<div class="ov-plot">' + donut + '<div class="ov-plot-legend">' + legend + '</div></div>';
  }

  // Thin stacked bar (proportion) — DESIGN.md §6.3: navy gradasi + status semantik.
  // Segmen bernilai 0 dilewati (tidak membentuk lebar maupun entri legenda).
  function _ovStackHtml(segs) {
    if (!segs || !segs.length) return '';
    var total = 0;
    for (var i = 0; i < segs.length; i++) total += (Number(segs[i].val) || 0);
    if (total <= 0) return '';
    var bar = segs.map(function (s) {
      var w = (Number(s.val) || 0) / total * 100;
      return '<div class="stk-seg" style="width:' + w + '%;background:' + _ovTone(s.tone) + ';"></div>';
    }).join('');
    var legend = segs.filter(function (s) { return (Number(s.val) || 0) > 0; })
      .map(function (s) {
        return '<span class="stk-item"><i style="background:' + _ovTone(s.tone) + ';"></i>' +
          _esc(s.label) + ' ' + _idNum(s.val) + '</span>';
      }).join('');
    return '<div class="stk-wrap"><div class="stk-bar">' + bar + '</div>' +
      '<div class="stk-legend">' + legend + '</div></div>';
  }

  // Pemetaan tone → token CSS tema (DESIGN.md §3; tanpa hue baru).
  function _ovTone(t) {
    switch (t) {
      case 'ok': return 'var(--n-ok)';
      case 'warn': return 'var(--n-warn)';
      case 'crit': return 'var(--n-crit)';
      case 'sikap': return 'var(--sat-sikap)';
      case 'nakhoda': return 'var(--sat-nakhoda)';
      case 'soft': return 'rgba(11, 79, 108, 0.62)';
      case 'light': return 'rgba(11, 79, 108, 0.34)';
      case 'lighter': return 'rgba(11, 79, 108, 0.18)';
      default: return 'var(--n-primary)';
    }
  }

  // '2026-07' → 'Juli 2026' (MONTHS didefinisikan di bawah literal global).
  function _ovMonthLabel(key) {
    if (!key) return '\u2014';
    var p = String(key).split('-');
    var mi = parseInt(p[1], 10);
    if (!mi || mi < 1 || mi > 12) return String(key);
    return MONTHS[mi - 1] + (p[0] ? ' ' + p[0] : '');
  }

  // Division summary card
  // metrics: [{lbl, val, unit, prog, progMax, stack}] — prog=true adds a placeholder
  // progress bar; stack=[{label,val,tone}] adds a thin stacked bar under the row.
  // stack (card-level) = {caption, segments:[...]} renders a thin stacked bar
  // setelah seluruh baris metrik (mis. komposisi AKN).
  function _divCard(title, metrics, stack, dots, opts) {
    opts = opts || {};
    var span = Number(opts.span) || 0;
    var rows = metrics.map(function (m, idx) {
      var isMuted = m.val === '\u2014';
      var badgeHtml = (m.badge && !isMuted) ? (
        '<span class="div-metric-badge ' + (m.tone || 'info') + '">' + _esc(m.badge) + '</span>'
      ) : '';
      var showUnit = m.unit && !(m.unit === 'Rp' && String(m.val).indexOf('Rp') === 0);
      var valHtml = '<span class="div-metric-val' + (isMuted ? ' muted' : (idx === 0 && opts.hero ? ' hero' : '')) + '">' +
        m.val + (showUnit ? ' <span class="div-metric-unit">' + m.unit + '</span>' : '') +
        '</span>';
      var hasRaw = m.raw !== null && m.raw !== undefined && m.raw !== '';
      var progHtml = (m.prog && !isMuted && hasRaw) ? (
        '<div class="div-micro-bar">' +
        '<div class="div-micro-bar-fill' + (Number(m.raw) < 50 ? ' warn' : '') + '" style="width:' +
        Math.max(0, Math.min(100, Number(m.raw) || 0)) + '%;"></div>' +
        '</div>'
      ) : '';
      var progTargetHtml = (m.progMax && !isMuted && hasRaw) ? (
        '<div class="div-micro-bar">' +
        '<div class="div-micro-bar-fill" style="width:' +
        Math.max(0, Math.min(100, (Number(m.raw) || 0) / m.progMax * 100)) + '%;"></div>' +
        '</div>'
      ) : '';
      var stackHtml = (m.stack && !isMuted) ? _ovStackHtml(m.stack) : '';
      return '<div class="div-metric-row">' +
        '<div class="div-metric">' +
        '<span class="div-metric-lbl">' + _esc(m.lbl) + '</span>' +
        '<div class="div-metric-right">' + valHtml + badgeHtml + '</div>' +
        '</div>' +
        progHtml + progTargetHtml + stackHtml +
        '</div>';
    }).join('');
    // Visual: viz dari server (bentuk bervariasi per kartu) → bila tidak ada
    // (cache lama / Profil Kapal) jatuh ke footer lama. `loading` = placeholder.
    var foot;
    if (opts.foot === false) foot = '';
    else if (opts.loading) foot = '<div class="vz"><div class="vz-body"><div class="vz-empty">Memuat\u2026</div></div></div>';
    else if (opts.viz) foot = _vzRender(opts.viz);
    else foot = _ovCardFoot(metrics, stack, dots);
    var cls = 'div-card' + (span ? ' s' + span : '') + (span >= 6 ? ' wide' : '');
    return '<div class="' + cls + '">' +
      '<div class="div-card-title">' + title + '</div>' +
      '<div class="div-card-body">' +
      '<div class="div-card-metrics">' + rows + '</div>' +
      foot +
      '</div>' +
      '</div>';
  }

  // ===========================================================================
  // VISUAL KARTU DIVISI (Fase 14) — tiap kartu memilih bentuk yang menjawab
  // pertanyaan datanya sendiri (DESIGN §6.1). Semua murni HTML/SVG + token tema;
  // tanpa gauge. Angka detail muncul di tooltip (`title`) bila terlalu padat
  // untuk label langsung, supaya angka tidak saling tabrak.
  // ===========================================================================
  function _ovTrim1(x) { return String(Math.round(x * 10) / 10).replace('.', ','); }

  // 1.250.000 → "1,3 jt"; fmt 'rp' selalu dipadatkan, selainnya hanya ≥ 10.000.
  function _ovCompact(n, fmt) {
    n = Number(n) || 0;
    var a = Math.abs(n);
    if (fmt !== 'rp' && a < 10000) return _idNum(n);
    if (a >= 1e12) return _ovTrim1(n / 1e12) + ' T';
    if (a >= 1e9) return _ovTrim1(n / 1e9) + ' M';
    if (a >= 1e6) return _ovTrim1(n / 1e6) + ' jt';
    if (a >= 1e3) return _ovTrim1(n / 1e3) + ' rb';
    return _idNum(n);
  }

  // '2026-07' → 'Jul'; label lain dikembalikan apa adanya.
  function _ovMonthShort(key) {
    var m = /^\d{4}-(\d{2})$/.exec(String(key || ''));
    if (!m) return String(key || '');
    var i = parseInt(m[1], 10);
    return (i >= 1 && i <= 12) ? MONTHS[i - 1].slice(0, 3) : String(key);
  }

  function _vzLegend(series) {
    if (!series || series.length < 2) return '';
    return '<div class="vz-legend">' + series.map(function (s) {
      return '<span><i style="background:' + _ovTone(s.tone) + ';"></i>' + _esc(s.name) + '</span>';
    }).join('') + '</div>';
  }

  // Kolom vertikal (grouped / tunggal). Batang diposisikan absolut terhadap
  // sel setinggi area visual, jadi mengisi tinggi kartu berapa pun.
  function _vzCols(v) {
    var series = v.series || [], groups = v.groups || [];
    var max = 0;
    groups.forEach(function (g) { (g.vals || []).forEach(function (x) { max = Math.max(max, Number(x) || 0); }); });
    if (!groups.length || max <= 0) return '';
    var showVals = groups.length * Math.max(1, series.length) <= 6;
    var cols = groups.map(function (g) {
      var glabel = _ovMonthShort(g.label);
      var bars = (g.vals || []).map(function (x, i) {
        var n = Number(x) || 0;
        var h = n > 0 ? Math.max(3, n / max * 80) : 0;
        var tip = glabel + (series[i] ? ' \u00B7 ' + series[i].name : '') + ': ' + _ovCompact(n, v.fmt);
        return '<div class="vz-bar-wrap" title="' + _esc(tip) + '">' +
          (showVals && n > 0 ? '<span class="vz-bar-val" style="bottom:calc(' + h + '% + 3px);">' + _esc(_ovCompact(n, v.fmt)) + '</span>' : '') +
          '<div class="vz-bar" style="height:' + h + '%;background:' + _ovTone((series[i] || {}).tone) + ';"></div>' +
          '</div>';
      }).join('');
      return '<div class="vz-col"><div class="vz-col-bars">' + bars + '</div>' +
        '<div class="vz-col-lbl" title="' + _esc(glabel) + '">' + _esc(glabel) + '</div></div>';
    }).join('');
    return '<div class="vz-cols"><div class="vz-bars">' + cols + '</div>' + _vzLegend(series) + '</div>';
  }

  // Donut proporsi (≤4 irisan) + legenda berangka (label langsung).
  function _vzDonut(v) {
    var segs = (v.segs || []).filter(function (s) { return (Number(s.val) || 0) > 0; });
    var total = _ovSegTotal(segs);
    if (total <= 0) return '';
    var legend = segs.map(function (s) {
      var pct = Math.round((Number(s.val) || 0) / total * 100);
      return '<div class="legend-row"><i style="background:' + _ovTone(s.tone) + ';"></i>' +
        '<span class="legend-lbl">' + _esc(s.label) + '</span>' +
        '<span class="legend-val">' + _idNum(s.val) + '</span>' +
        '<span class="legend-pct">' + pct + '%</span></div>';
    }).join('');
    return '<div class="vz-donut">' + _ovDonut(segs, 116, _idNum(total), v.sub || '') +
      '<div class="vz-donut-legend">' + legend + '</div></div>';
  }

  // Batang horizontal berperingkat (label + track + nilai).
  function _vzHbars(v) {
    var items = (v.items || []).slice().sort(function (a, b) { return (Number(b.val) || 0) - (Number(a.val) || 0); });
    if (_ovSegTotal(items) <= 0) return '';
    return '<div class="vz-hbars">' + _ovBars(items) + '</div>';
  }

  // Garis multi-seri (maks. 2–3), sumbu 0 di dasar, label bulan di bawah.
  function _vzLine(v) {
    var labels = v.labels || [], series = v.series || [];
    var n = labels.length;
    var max = 0;
    series.forEach(function (s) { (s.data || []).forEach(function (x) { max = Math.max(max, Number(x) || 0); }); });
    if (n < 2 || max <= 0) return '';
    var W = 200, H = 100, padX = 4, padY = 8;
    var sx = (W - padX * 2) / (n - 1);
    var paths = series.map(function (s, si) {
      var pts = (s.data || []).map(function (x, i) {
        return [padX + i * sx, H - padY - ((Number(x) || 0) / max) * (H - padY * 2)];
      });
      var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      var area = si === 0 ? '<path d="' + d + ' L' + (W - padX) + ' ' + (H - padY) + ' L' + padX + ' ' + (H - padY) + ' Z" fill="rgba(11,79,108,0.10)"/>' : '';
      return area + '<path d="' + d + '" fill="none" stroke="' + _ovTone(s.tone) + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>';
    }).join('');
    var grid = [0.25, 0.5, 0.75].map(function (f) {
      var y = padY + (H - padY * 2) * f;
      return '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="rgba(0,0,0,0.06)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }).join('');
    var base = '<line x1="0" x2="' + W + '" y1="' + (H - padY) + '" y2="' + (H - padY) + '" stroke="rgba(0,0,0,0.12)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    var step = n > 8 ? 2 : 1;
    var xl = labels.map(function (l, i) {
      return '<span>' + (i % step === 0 ? _esc(_ovMonthShort(l)) : '') + '</span>';
    }).join('');
    var peak = series.map(function (s) {
      return _esc(s.name) + ' maks ' + _ovCompact(Math.max.apply(null, (s.data || [0]).map(Number)));
    }).join(' \u00B7 ');
    return '<div class="vz-line"><div class="vz-line-plot" title="' + peak + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + grid + base + paths + '</svg></div>' +
      '<div class="vz-line-x" style="grid-template-columns:repeat(' + n + ',1fr);">' + xl + '</div>' +
      _vzLegend(series) + '</div>';
  }

  // Waffle 10×4 = 40 sel; alokasi sisa terbesar supaya jumlah sel selalu 40.

  function _opsFetchWppGeoJson(attempt, srcIdx) {
    attempt = attempt || 1;

    return new Promise(function (resolve, reject) {
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var opts = { cache: 'force-cache' };
      if (ctrl) opts.signal = ctrl.signal;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, _OPS_GEO_TIMEOUT_MS);

      fetch(url, opts)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          clearTimeout(timer);
          if (!data || !data.features || !data.features.length) {
            throw new Error('Berkas batas WPP kosong.');
          }
          resolve(data);
        })
        .catch(function (e) {
          clearTimeout(timer);
          if (attempt < _OPS_GEO_RETRY) {
            _opsFetchWppGeoJson(attempt + 1, srcIdx).then(resolve, reject);
            return;
          }
          if (srcIdx + 1 < _OPS_GEO_SRCS.length) {
            _opsFetchWppGeoJson(1, srcIdx + 1).then(resolve, reject);
            return;

          reject(new Error(
            e && e.name === 'AbortError'
              ? 'Waktu muat batas WPP habis (' + (_OPS_GEO_TIMEOUT_MS / 1000) + ' detik).'

  function _ovMapRenderRank() {
    var host = document.getElementById('ov-map-rank');

    if (!rows || !Object.keys(rows).length) {

    }).sort(function (a, b) { return b.val - a.val; }).slice(0, 5);

    var hd = '<div class="ov-map-rank-hd">5 WPP Teratas</div>';

        'aria-label="' + r.nama + ', ' + r.val + ' kapal">' +

        '<span class="ov-map-rank-nm">' + r.nama + '</span>' +

        '<span class="ov-map-rank-val">' + r.val + '</span></div>';
    }).join('') + '</div>';

    var tw = _OV_MAP.data.tanpaWpp;

      hd += '<div class="ov-map-rank-note">' + tw + ' kapal belum mencantumkan WPP</div>';

    host.querySelectorAll('[data-ov-kode]').forEach(function (el) {

      el.addEventListener('click', function () { _ovMapZoom(kode); });

      });

  function _ovMapFindLayer(kode) {
    var found = null;
    if (!_OV_MAP.layer) return null;
    _OV_MAP.layer.eachLayer(function (l) {
      if (found) return;
      var p = l.feature && l.feature.properties;
      if (p && String(p.wppnri).trim() === String(kode).trim()) found = l;
    });
    return found;
  }

  function _ovMapFocus(kode) {
    var l = _ovMapFindLayer(kode);
    if (!l || !_OV_MAP.layer) return;
    var target = String(kode).trim();
    _OV_MAP.layer.eachLayer(function (x) {
      var on = String(x.feature.properties.wppnri).trim() === target;
      x.setStyle({ weight: on ? 2.2 : 1.15, color: on ? '#0B4F6C' : _OV_MAP_RAMP_LINE, fillOpacity: on ? 0.68 : 0.52 });
    });
    if (l.bringToFront) l.bringToFront();
  }

  function _ovMapZoom(kode) {
    var l = _ovMapFindLayer(kode);
    if (!l || !_OV_MAP.map) return;
    _OV_MAP.userInteracted = true;
    try {
      _OV_MAP.map.fitBounds(l.getBounds(), { padding: [28, 28], maxZoom: 7, animate: true });
    } catch (e) { }
  }

  function _ovMapFitIndonesia() {
    if (!_OV_MAP.map) return;
    _OV_MAP.programmaticFit = true;
    try {
      var mapEl = document.getElementById('ov-map');
      var pad = mapEl && mapEl.clientWidth < 520 ? [6, 6] : [12, 12];
      _OV_MAP.map.fitBounds(_OV_MAP_BOUNDS, { padding: pad, animate: false });
    } catch (e) {
    } finally {
      _OV_MAP.programmaticFit = false;
    }

  function _ovMapInit() {
    var host = document.getElementById('ov-map');
    if (!host) return;
    if (_OV_MAP.map) { try { _OV_MAP.map.invalidateSize(); } catch (e) { } return; }

    _loadLeaflet(function () {
      var h = document.getElementById('ov-map');
      if (!h) return;
      if (_OV_MAP.map) { try { _OV_MAP.map.invalidateSize(); } catch (e) { } return; }
      if (typeof L === 'undefined' || !L.map) return;

      if (h._leaflet_id && !_OV_MAP.map) {
        try { delete h._leaflet_id; } catch (e) { }
      }

      _OV_MAP.userInteracted = false;
      _OV_MAP.map = L.map('ov-map', {
        zoomControl: true,
        scrollWheelZoom: false,
        zoomSnap: 0.25,
        zoomDelta: 0.5,
        minZoom: 3,
        maxZoom: 12,
        center: [-2.8, 116.8],
        zoom: 4.5
      });
      _ovMapFitIndonesia();
      _OV_MAP.map.on('dragstart', function () {
        if (!_OV_MAP.programmaticFit) _OV_MAP.userInteracted = true;
      });
      _OV_MAP.map.on('zoomstart', function () {
        if (!_OV_MAP.programmaticFit) _OV_MAP.userInteracted = true;
      });
      _OV_MAP.map.on('zoomend', _ovMapRenderFleetMarkers);

      _ensureCartoKey(function (key) {
        if (!_OV_MAP.map) return;
        var tileOpts = {
          attribution: key ? '&copy; OpenStreetMap contributors &copy; CARTO' : '&copy; Esri, HERE, Garmin, OpenStreetMap',
          maxZoom: 20
        };
        if (key) tileOpts.subdomains = 'abcd';
        L.tileLayer(_cartoTileUrl(key), tileOpts).addTo(_OV_MAP.map);
      });

      _ovMapLoadGeo();
      _ovMapRenderFleetMarkers();

      setTimeout(function () {
        if (_OV_MAP.map) {
          try {
            _OV_MAP.map.invalidateSize();
            if (!_OV_MAP.userInteracted) _ovMapFitIndonesia();
          } catch (e) { }
          _ovMapRenderFleetMarkers();
        }
      }, 220);

  // ── Render 34 Marker Siluet Kapal Kelas I–V (Zero Overlap) ──
  function _ovMapRenderFleetMarkers() {
    if (!_OV_MAP.map) return;
    if (!_OV_MAP.fleetLayer) {
      _OV_MAP.fleetLayer = L.layerGroup().addTo(_OV_MAP.map);
    } else {
      _OV_MAP.fleetLayer.clearLayers();
    }

    var fleet = (_OV_MAP.data && _OV_MAP.data.fleet) || [];
    var activeFilter = _OV_MAP.fleetFilter || 'ALL';
    var activeClass = _OV_MAP.classFilter || 'ALL';

    var filtered = fleet.filter(function (k) {
      if (activeFilter !== 'ALL' && k.status !== activeFilter) return false;
      if (activeClass !== 'ALL' && (k.kelasKapal || 'KELAS_III') !== activeClass) return false;
      return k.lat != null && k.lng != null;
    });

    var mapEl = document.getElementById('ov-map');
    var mw = mapEl ? mapEl.clientWidth : 800;
    var mh = mapEl ? mapEl.clientHeight : 400;

    var pts = filtered.map(function (k) {
      var meta = _shipClassMeta(k.kelasKapal);
      var pt = _OV_MAP.map.latLngToContainerPoint([k.lat, k.lng]);
      return {
        k: k,
        meta: meta,
        x: pt.x,
        y: pt.y,
        inView: pt.x >= 0 && pt.x <= mw && pt.y >= 0 && pt.y <= mh,
        hw: (meta.w / 2) + 3,
        hh: (meta.h / 2) + 3
      };
    });

    // Separatif piksel deterministik agar ikon kapal tidak menumpuk pada zoom level rendah
    for (var pass = 0; pass < 42; pass++) {
      var moved = false;
      for (var i = 0; i < pts.length; i++) {
        var a = pts[i];
        if (a.inView && a.x - a.hw < 54 && a.y - a.hh < 88) {
          a.x = 54 + a.hw + 4;
        }
        if (a.inView && a.x - a.hw < 132 && a.y + a.hh > mh - 122) {
          a.y = mh - 122 - a.hh - 4;
        }
        for (var j = i + 1; j < pts.length; j++) {
          var b = pts[j];
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var minX = a.hw + b.hw;
          var minY = a.hh + b.hh;
          var ox = minX - Math.abs(dx);
          var oy = minY - Math.abs(dy);
          if (ox > 0 && oy > 0) {
            moved = true;
            var ux, uy;
            if (dx === 0 && dy === 0) {
              var ang = ((i * 5 + j) % 8) * (Math.PI / 4);
              ux = Math.cos(ang);
              uy = Math.sin(ang);
            } else {
              var len = Math.sqrt(dx * dx + dy * dy);
              ux = dx / len;
              uy = dy / len;
            }
            var stepX = (ux * ox * 0.55) + (ox < oy ? (ux >= 0 ? 1 : -1) : 0);
            var stepY = (uy * oy * 0.55) + (oy <= ox ? (uy >= 0 ? 1 : -1) : 0);
            a.x -= stepX;
            a.y -= stepY;
            b.x += stepX;
            b.y += stepY;
          }
        }
      }
      pts.forEach(function (p) {
        if (!p.inView) return;
        if (p.x < p.hw + 12) p.x = p.hw + 12;
        if (p.x > mw - p.hw - 12) p.x = mw - p.hw - 12;
        if (p.y < p.hh + 12) p.y = p.hh + 12;
        if (p.y > mh - p.hh - 12) p.y = mh - p.hh - 12;
      });
      if (!moved) break;
    }

    pts.forEach(function (item) {
      var k = item.k;
      var meta = item.meta;
      var isOp = k.status === 'OPERASIONAL';
      var isSiap = k.status === 'SIAP_PANGKALAN';
      var statusColor = isOp ? '#0B4F6C' : (isSiap ? '#15803D' : '#B45309');

      var icon = L.divIcon({
        className: 'ship-svg-wrap',
        html: '<div class="ship-svg-marker" title="' + _esc(k.nama) + '">' +
          _shipClassSvg(meta.key, statusColor, 'marker') +
          '</div>',
        iconSize: [meta.w, meta.h],
        iconAnchor: [Math.round(meta.w / 2), Math.round(meta.h / 2)]
      });

      var pos = _OV_MAP.map.containerPointToLatLng([item.x, item.y]);
      var marker = L.marker(pos, { icon: icon });

      var locLabel = (k.wpp === 'Pangkalan' || k.wpp === 'Galangan') ? (k.pangkalan || k.wpp) : ('WPP ' + k.wpp);
      var classDesc = (k.kelasLabel || meta.label) + ' (' + (k.panjangMeter || '') + ' m)';
      marker.bindTooltip(
        _esc(k.nama) + ' \u00B7 ' + _esc(classDesc) + ' \u00B7 ' + _esc(locLabel),
        { direction: 'top', offset: [0, -Math.round(meta.h / 2) - 2], className: 'ship-leaflet-tip' }
      );

      var badgeText = isOp ? 'Operasional di Laut' : (isSiap ? 'Siap di Pangkalan' : 'Pemeliharaan Galangan');
      var badgeStyle = isOp ? 'background:#E1EFF5;color:#07384D;' :
        (isSiap ? 'background:#DCFCE7;color:#052E16;' : 'background:#FEF3C7;color:#78350F;');

      var pctNas = Math.min(k.pctNasional || Math.round((k.hariOperasi / 44) * 100), 100);
      var pctPus = Math.min(k.pctPusat || Math.round((k.hariOperasi / 49) * 100), 100);

      var popupHtml =
        '<div class="ship-popover">' +
        '<div class="ship-pop-hd">' +
        '<span class="ship-pop-badge" style="' + badgeStyle + '">' + badgeText + '</span>' +
        '<div class="ship-pop-name">' + _esc(k.nama) + '</div>' +
        '<div class="ship-pop-sub">' + _esc(classDesc) + ' &bull; ' + _esc(locLabel) + '</div>' +
        '</div>' +
        '<div class="ship-pop-body">' +
        '<div class="ship-pop-row"><span class="ship-pop-lbl">Posisi Koordinat</span><span class="ship-pop-val table-num">' + Number(k.lat).toFixed(4).replace('.', ',') + '&deg;, ' + Number(k.lng).toFixed(4).replace('.', ',') + '&deg;</span></div>' +
        '<div class="ship-pop-row"><span class="ship-pop-lbl">Komandan</span><span class="ship-pop-val font-semibold">' + _esc(k.komandan || '\u2014') + '</span></div>' +
        '<div class="ship-pop-row"><span class="ship-pop-lbl">Pangkalan</span><span class="ship-pop-val">' + _esc(k.pangkalan || '\u2014') + '</span></div>' +
        '<div class="ship-pop-row"><span class="ship-pop-lbl">Hari Layar Kumulatif</span><span class="ship-pop-val"><strong>' + k.hariOperasi + '</strong> hari</span></div>' +
        '<div class="ship-pop-benchmark">' +
        '<div class="ship-bm-row"><span>vs Rerata Nasional (44 hr)</span><span class="table-num">' + (k.pctNasional || Math.round((k.hariOperasi / 44) * 100)) + '%</span></div>' +
        '<div class="ship-bm-bar"><div class="ship-bm-fill" style="width:' + pctNas + '%;"></div></div>' +
        '<div class="ship-bm-row"><span>vs Rerata Pusat (49 hr)</span><span class="table-num">' + (k.pctPusat || Math.round((k.hariOperasi / 49) * 100)) + '%</span></div>' +
        '<div class="ship-bm-bar"><div class="ship-bm-fill ship-bm-center" style="width:' + pctPus + '%;"></div></div>' +
        '</div>' +
        '</div>' +
        '<div class="ship-pop-ft">' +
        '<button type="button" class="btn-sm btn-sm-ghost" onclick="_openProfilKapal(\'' + _esc(k.id) + '\')">Buka Profil Kapal &rarr;</button>' +
        '</div>' +
        '</div>';

      marker.bindPopup(popupHtml, { maxWidth: 280, className: 'n-leaflet-pop' });
      _OV_MAP.fleetLayer.addLayer(marker);
    });
  }

  function _ovMapLoadGeo() {
    if (!_OV_MAP.map) return;
    _opsMapStatus('ov-map', 'loading');
    _opsGetGeoData(function (geoData, err) {
      if (!_OV_MAP.map) return;
      if (err) { _opsMapStatus('ov-map', 'error', err, _ovMapLoadGeo); return; }
      var scale = _ovMapScale();
      _OV_MAP.layer = L.geoJSON(geoData, {
        style: function (f) {
          return {
            fillColor: scale.fill(_ovMapVal(f.properties.wppnri)),
            fillOpacity: 0.52, weight: 1.15, opacity: 1, color: _OV_MAP_RAMP_LINE
          };
        },
        onEachFeature: function (feature, layer) {
          var kode = feature.properties.wppnri;
          layer.bindTooltip('<strong>' + _ovMapName(kode) + '</strong><br>' +
            (_ovMapMetricDef(_OV_MAP.metric) ? _ovMapMetricDef(_OV_MAP.metric).label : '') +
            ': ' + _ovMapVal(kode), { sticky: true });
        }
      }).addTo(_OV_MAP.map);
      _opsMapStatus('ov-map', null);
      _ovMapLegend(scale);
      setTimeout(function () {
        if (_OV_MAP.map) {
          try { _OV_MAP.map.invalidateSize(); } catch (e) { }
          _ovMapRenderFleetMarkers();
        }
      }, 150);
    });
  }

  function _ovMapDestroy() {
    if (_OV_MAP.fleetLayer) {
      try { _OV_MAP.fleetLayer.clearLayers(); } catch (e) { }
      _OV_MAP.fleetLayer = null;
    }
    if (_OV_MAP.map) {
      try { _OV_MAP.map.off('zoomend', _ovMapRenderFleetMarkers); } catch (e) { }
      try { _OV_MAP.map.remove(); } catch (e) { }
    }
    _OV_MAP.map = null;
    _OV_MAP.layer = null;
    var host = document.getElementById('ov-map');
    if (host && host._leaflet_id) {
      try { delete host._leaflet_id; } catch (e) { }

  // ── APPROVAL MANAGEMENT ───────────────────────────────────
  // Parametrik agar bisa dipakai pada halaman "Kelola Akun" dan
  // panel geser kanan (banner KADIV/approver) tanpa duplikasi.
  // id default: ka-* → halaman Kelola Akun; dr-* → drawer kanan.
  var APPROVAL_WRAPS = [
    { grp: 'ka', wrapId: 'ka-approval-table-wrap', msgId: 'ka-approval-msg' },
    { grp: 'dr', wrapId: 'dr-approval-table-wrap', msgId: 'dr-approval-msg' }
  ];
  var _APPREQ_TARGET = null;

  function _appActiveWraps() {
    var out = [];
    for (var i = 0; i < APPROVAL_WRAPS.length; i++) {
      var w = APPROVAL_WRAPS[i];
      if (document.getElementById(w.wrapId)) out.push(w);
    }
    if (_APPREQ_TARGET && out.length > 1) {
      out.sort(function (a, b) {
        return (a.grp === _APPREQ_TARGET ? -1 : b.grp === _APPREQ_TARGET ? 1 : 0);
      });
    }
    return out;
  }

  function _loadApprovals() {
    var act = _appActiveWraps();
    if (act.length === 0) return;
    var firstWrap = document.getElementById(act[0].wrapId);
    if (firstWrap) firstWrap.innerHTML = _loadingInline('Memuat permintaan registrasi\u2026');

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Gagal memuat data.'); return; }
        _renderApprovalTable(res.data);
      })
      .withFailureHandler(function () { _appMsg('error', 'Gagal memuat data.'); })
      .auth_getPendingApprovals(APP.token);
  }

  // Reload seluruh panel approval yang sedang tampil (halaman + drawer).
  function _refreshApprovalPanels() { _loadApprovals(); }

  function _appMsg(type, text) {
    var act = _appActiveWraps();
    if (act.length === 0) return;
    var el = document.getElementById(act[0].msgId);
    if (!el) return;
    el.className = 'n-msg ' + type + ' show';
    el.textContent = text;
  }

  function _renderApprovalTable(items) {
    var act = _appActiveWraps();
    if (act.length === 0) return;
    var list = _asArray(items);

    for (var w = 0; w < act.length; w++) {
      var wrap = document.getElementById(act[w].wrapId);
      if (!wrap) continue;

      if (list.length === 0) {
        wrap.innerHTML = _renderEmptyState(
          'Tidak ada antrean persetujuan',
          'Seluruh permintaan registrasi baru telah diproses.'
        );
        continue;
      }

      var rows = list.map(function (it) {
        var d = _fmtDateId(it.registeredAt);
        var roleText = it.roleDilamar === 'KADIV' ? 'Kepala Divisi / Ketua Tim Kerja' : (ROLE_LABEL[it.roleDilamar] || 'Staf');
        return '<tr>' +
          '<td><strong>' + _esc(it.nama || '\u2014') + '</strong>' +
          '<span class="td-sub">' + _esc(it.email || '\u2014') + '</span></td>' +
          '<td>' + _esc(it.namaDivisi || '\u2014') + '</td>' +
          '<td>' + _esc(roleText) + '</td>' +
          '<td class="td-nowrap">' + _esc(d) + '</td>' +
          '<td><div class="ctl-row ctl-sm ctl-nowrap">' +
          '<button type="button" class="btn-primary" onclick="doApprove(\'' + _esc(it.queueId) + '\')">Setujui</button>' +
          '<button type="button" class="btn-row-danger" onclick="openRejectModal(\'' + _esc(it.queueId) + '\')">Tolak</button>' +
          '</div></td>' +
          '</tr>';
      }).join('');

      wrap.innerHTML =
        '<div class="n-table-wrap"><table class="n-table">' +
        '<thead><tr><th>Nama</th><th>Unit Kerja</th><th>Jabatan</th><th>Tgl Daftar</th><th>Tindakan</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '</table></div>';
    }
  }

  function doApprove(queueId) {
    if (!confirm('Setujui registrasi ini?')) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Terjadi kesalahan.'); return; }
        _appMsg('success', 'Registrasi berhasil disetujui.');
        _loadApprovals();
        _applyShellStatus();
      })
      .withFailureHandler(function () { _appMsg('error', 'Terjadi kesalahan. Coba lagi.'); })
      .auth_decideApproval({ token: APP.token, queueId: queueId, approve: true, alasan: '' });
  }

  function openRejectModal(queueId) {
    APP.pendingQueueId = queueId;
    document.getElementById('reject-reason').value = '';
    document.getElementById('modal-reject').classList.remove('n-hidden');
  }
  function closeRejectModal() {
    APP.pendingQueueId = null;
    document.getElementById('modal-reject').classList.add('n-hidden');
  }

  document.addEventListener('DOMContentLoaded', function () {
    var btnConfirm = document.getElementById('btn-confirm-reject');
    if (!btnConfirm) return;
    btnConfirm.addEventListener('click', function () {
      var alasan = document.getElementById('reject-reason').value.trim();
      if (!alasan) { alert('Alasan penolakan wajib diisi.'); return; }
      google.script.run
        .withSuccessHandler(function (res) {
          closeRejectModal();
          if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Terjadi kesalahan.'); return; }
          _appMsg('success', 'Registrasi berhasil ditolak.');
          _loadApprovals();
          _applyShellStatus();
        })
        .withFailureHandler(function () {
          closeRejectModal();
          _appMsg('error', 'Terjadi kesalahan. Coba lagi.');
        })
        .auth_decideApproval({ token: APP.token, queueId: APP.pendingQueueId, approve: false, alasan: alasan });
    });
  });

  // ── MODULE STUBS ──────────────────────────────────────────
  function _moduleStub(title) {
    return '<div class="module-stub">' +
      '<div class="module-stub-title">' + _esc(title) + '</div>' +
      '<p>Modul ini sedang dalam pembangunan dan akan aktif pada fase berikutnya.</p>' +
      '</div>';
  }

  function _renderMasterData(el) {
    var html = _tplHtml('view-tpl-master-data');
    if (html === null) { el.innerHTML = _moduleStub('Master Data'); return; }
    el.innerHTML = html;

    // Tombol sinkron WPP hanya untuk SUPERADMIN (PRD §5.11)
    var btnSync = document.getElementById('md-btn-sync-wpp');
    if (btnSync && APP.user && APP.user.role !== 'SUPERADMIN') btnSync.style.display = 'none';

    _MD.tab = 'kapal';
    _MD.data.opsi = null;
    _mdSyncTabState();
    _mdLoadAll();
  }

  // ── ADMIN PANEL — persetujuan + pengguna + audit log (Fase 13) ──
  // Menu "Admin Panel" (SUPERADMIN/DIREKTUR). Tab Pengguna & Audit Log hanya
  // ditampilkan untuk SUPERADMIN (server juga menolak non-SUPERADMIN).
  // APP_mWraps() dipakai: ka-* di sini; dr-* di-drawer kanan.
  var _ADN = { tab: 'persetujuan', users: [], audit: [], userFormId: null, divisi: [] };

  function _renderKelolaAkun(el) {
    var html = _tplHtml('view-tpl-kelola-akun');
    if (html === null) { el.innerHTML = _moduleStub('Admin Panel'); return; }
    el.innerHTML = html;

    var isSA = (APP.user && APP.user.role === 'SUPERADMIN');
    var tabPengguna = document.getElementById('adn-tab-pengguna');
    var tabAudit = document.getElementById('adn-tab-audit');
    var tabReminder = document.getElementById('adn-tab-reminder');
    if (tabPengguna) {
      if (isSA) tabPengguna.removeAttribute('hidden'); else tabPengguna.setAttribute('hidden', '');
    }
    if (tabAudit) {
      if (isSA) tabAudit.removeAttribute('hidden'); else tabAudit.setAttribute('hidden', '');
    }
    if (tabReminder) {
      if (isSA) tabReminder.removeAttribute('hidden'); else tabReminder.setAttribute('hidden', '');
    }

    _ADN.tab = 'persetujuan';
    _ADN.users = [];
    _ADN.audit = [];
    _ADN.userFormId = null;
    _adnSyncTabs();
    _renderApprovalsInto('ka');
  }

  function _adnSyncTabs() {
    var tabs = document.querySelectorAll('#adn-tabs .n-tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === _ADN.tab);
    }
    var panels = {
      persetujuan: 'adn-panel-persetujuan',
      pengguna: 'adn-panel-pengguna',
      audit: 'adn-panel-audit',
      reminder: 'adn-panel-reminder'
    };
    Object.keys(panels).forEach(function (k) {
      var el = document.getElementById(panels[k]);
      if (el) el.hidden = (k !== _ADN.tab);
    });
  }

  function _adnSwitch(tab) {
    // Guard client-side; server tetap menolak role non-SUPERADMIN (assertScope).
    if (tab !== 'persetujuan' && !(APP.user && APP.user.role === 'SUPERADMIN')) return;
    _ADN.tab = tab;
    _adnSyncTabs();
    if (tab === 'pengguna') { _adnLoadUsers(); _adnLoadDivisi(); }
    if (tab === 'audit') _adnLoadAudit();
    if (tab === 'reminder') _adnLoadReminder();
  }

  function _adnGoMasterData() { _routeTo('master-data'); }

  // ── TAB PENGGUNA ───────────────────────────────────────────
  function _adnStatusBadge(st) {
    var s = String(st || '').toUpperCase();
    if (s === 'APPROVED') return '<span class="badge badge-ok">Aktif</span>';
    if (s === 'PENDING') return '<span class="badge badge-info">Menunggu</span>';
    if (s === 'REJECTED') return '<span class="badge badge-danger">Ditolak</span>';
    if (s === 'NONAKTIF') return '<span class="badge badge-neutral">Nonaktif</span>';
    return '<span class="badge badge-neutral">' + _esc(_humanEnum(s)) + '</span>';
  }

  function _adnLoadUsers() {
    var wrap = document.getElementById('adn-users-wrap');
    if (!wrap) return;
    wrap.innerHTML = _loadingInline('Memuat daftar pengguna\u2026');
    _msg('adn-users-msg', null);
    _asyncArm('adn-users', wrap, '_adnLoadUsers()');

    google.script.run
      .withSuccessHandler(function (res) {
        _asyncDisarm('adn-users');
        if (_asyncResErr(res)) {
          _asyncResFail('adn-users', wrap, res, '_adnLoadUsers()');
          return;
        }
        try {
          _ADN.users = _asArray(res.data);
          _adnRenderUsers();
        } catch (e) {
          _asyncRenderFail('adn-users', wrap, e);
        }
      })
      .withFailureHandler(function (err) {
        _asyncDisarm('adn-users');
        wrap.innerHTML = '<div class="n-msg error">' + _esc(_failOrLogout(err) || 'Koneksi terputus.') + '</div>';
      })
      .admin_getUsers(APP.token);
  }

  function _adnRenderUsers() {
    var wrap = document.getElementById('adn-users-wrap');
    if (!wrap) return;

    if (!_ADN.users.length) {
      wrap.innerHTML = _renderEmptyState('Belum ada pengguna terdaftar', 'Daftar akun pengguna yang disetujui atau menunggu verifikasi akan tampil di sini.');
      return;
    }

    var t = '<div class="n-table-wrap"><table class="n-table n-table-full"><thead><tr>' +
      '<th>Nama</th><th>Unit Kerja</th><th>Jabatan</th><th>Status</th><th>Tgl Daftar</th><th>Aksi</th>' +
      '</tr></thead><tbody>';

    for (var i = 0; i < _ADN.users.length; i++) {
      var u = _ADN.users[i];
      var roleLabel = ROLE_LABEL[u.role] || _humanEnum(u.role);
      var isSelf = (APP.user && String(APP.user.userId) === String(u.userId));
      t += '<tr>' +
        '<td><strong>' + _esc(u.nama || '\u2014') + '</strong>' +
        '<span class="td-sub">' +
        _esc(u.nip ? 'NIP ' + u.nip + ' \u00b7 ' : '') + _esc(u.email || '\u2014') + '</span></td>' +
        '<td>' + _esc(u.namaDivisi || '\u2014') + '</td>' +
        '<td>' + _esc(roleLabel) + '</td>' +
        '<td>' + _adnStatusBadge(u.status) + '</td>' +
        '<td class="td-nowrap">' + _esc(_fmtDateId(u.registeredAt)) + '</td>' +
        '<td>' +
        (isSelf
          ? '<span class="ntf-read-lbl">Akun Anda</span>'
          : '<div class="ctl-row ctl-sm"><button type="button" class="btn-row-subtle" onclick="_adnOpenEdit(\'' + _esc(u.userId) + '\')">Kelola</button></div>') +
        '</td></tr>';
    }

    t += '</tbody></table></div>';
    wrap.innerHTML = t;
  }

  function _adnFmtDate(v) {
    return _fmtDateId(v);
  }

  function _adnLoadDivisi() {
    if (_ADN.divisi.length > 0) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          _ADN.divisi = res.data || [];
          // Form mungkin sudah dibuka sebelum daftar divisi tiba.
          if (_ADN.userFormId) _adnFillDivisi(_ADN.userFormId);
        }
      })
      .withFailureHandler(function () { })
      .auth_getDivisiList();
  }

  // Isi dropdown Unit Kerja; selected = UserID agar pilihan awal ikut ter-restore.
  function _adnFillDivisi(selectedUserId) {
    var sel = document.getElementById('adn-f-divisi');
    if (!sel) return;
    var u = selectedUserId ? _adnFindUser(selectedUserId) : null;
    var current = u ? String(u.divisiId || '') : '';
    sel.innerHTML = '<option value="">— Lintas Divisi —</option>' + _ADN.divisi.map(function (d) {
      return '<option value="' + _esc(d.divisiId) + '"' + (d.divisiId === current ? ' selected' : '') + '>' +
        _esc(d.namaDashboard) + '</option>';
    }).join('');
    if (!_ADN.divisi.length) {
      sel.innerHTML = '<option value="">Memuat unit kerja…</option>';
    }
  }

  // ── FORM KELOLA AKUN (modal) ───────────────────────────────
  function _adnFindUser(userId) {
    for (var i = 0; i < _ADN.users.length; i++) {
      if (String(_ADN.users[i].userId) === String(userId)) return _ADN.users[i];
    }
    return null;
  }

  function _adnOpenEdit(userId) {
    var u = _adnFindUser(userId);
    if (!u) return;
    _ADN.userFormId = userId;

    var roleOpts = ['SUPERADMIN', 'DIREKTUR', 'KADIV', 'STAF'].map(function (r) {
      return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' + _esc(ROLE_LABEL[r] || r) + '</option>';
    }).join('');

    var statusOpts = ['APPROVED', 'REJECTED', 'NONAKTIF'].map(function (s) {
      var label = s === 'APPROVED' ? 'Aktif' : (s === 'REJECTED' ? 'Ditolak' : 'Nonaktif');
      return '<option value="' + s + '"' + (s === u.status ? ' selected' : '') + '>' + label + '</option>';
    }).join('');

    document.getElementById('adn-form-title').textContent = 'Kelola Akun — ' + u.nama;
    document.getElementById('adn-f-nama').textContent = u.nama;
    document.getElementById('adn-f-email').textContent = u.email;
    document.getElementById('adn-f-role').innerHTML = roleOpts;
    document.getElementById('adn-f-status').innerHTML = statusOpts;
    document.getElementById('adn-f-password').value = '';
    _msg('adn-form-msg', null);
    // Dropdown unit kerja butuh daftar divisi; kalau belum tiba, placeholder dulu.
    _adnFillDivisi(userId);
    _adnLoadDivisi();
    document.getElementById('modal-admin-user').classList.remove('n-hidden');
    _adnOnRoleChange();
  }

  function _adnOnRoleChange() {
    var role = document.getElementById('adn-f-role').value;
    var divisi = document.getElementById('adn-f-divisi');
    if (role === 'SUPERADMIN' || role === 'DIREKTUR') {
      divisi.value = '';
      divisi.disabled = true;
    } else {
      divisi.disabled = false;
    }
  }

  function _adnCloseForm() {
    document.getElementById('modal-admin-user').classList.add('n-hidden');
    _ADN.userFormId = null;
  }

  function _adnSaveUser() {
    var userId = _ADN.userFormId;
    if (!userId) return;
    var params = {
      userId: userId,
      role: document.getElementById('adn-f-role').value,
      divisiId: document.getElementById('adn-f-divisi').value,
      status: document.getElementById('adn-f-status').value
    };

    var btn = document.getElementById('btn-adn-save');
    _setLoading(btn, true);
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _msg('adn-form-msg', 'error', res.error); return; }
        _adnCloseForm();
        _msg('adn-users-msg', 'success', (res.data.changes || []).join('; ') || 'Tidak ada perubahan.');
        _adnLoadUsers();
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg('adn-form-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
      })
      .admin_updateUser(APP.token, params);
  }

  function _adnResetPassword() {
    var userId = _ADN.userFormId;
    if (!userId) return;
    var pass = document.getElementById('adn-f-password').value;
    if (pass.length < 8) { _msg('adn-form-msg', 'error', 'Password minimal 8 karakter.'); return; }
    if (!confirm('Setel ulang password akun ini? Password lama tidak berlaku lagi.')) return;

    var btn = document.getElementById('btn-adn-reset');
    _setLoading(btn, true);
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _msg('adn-form-msg', 'error', res.error); return; }
        document.getElementById('adn-f-password').value = '';
        _msg('adn-form-msg', 'success', 'Password berhasil disetel ulang. Sampaikan password baru ke pengguna secara aman.');
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg('adn-form-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
      })
      .admin_resetPassword(APP.token, { userId: userId, newPassword: pass });
  }

  // ── TAB AUDIT LOG ──────────────────────────────────────────
  function _adnLoadAudit() {
    var wrap = document.getElementById('adn-audit-wrap');
    if (!wrap) return;
    wrap.innerHTML = _loadingInline('Memuat jejak audit\u2026');
    _msg('adn-audit-msg', null);
    _asyncArm('adn-audit', wrap, '_adnReloadAudit()');

    google.script.run
      .withSuccessHandler(function (res) {
        _asyncDisarm('adn-audit');
        if (_asyncResErr(res)) {
          _asyncResFail('adn-audit', wrap, res, '_adnReloadAudit()');
          return;
        }
        try {
          _ADN.audit = _asArray(res.data);
          _adnRenderAudit();
        } catch (e) {
          _asyncRenderFail('adn-audit', wrap, e);
        }
      })
      .withFailureHandler(function (err) {
        _asyncDisarm('adn-audit');
        wrap.innerHTML = '<div class="n-msg error">' + _esc(_failOrLogout(err) || 'Koneksi terputus.') + '</div>';
      })
      .admin_getAuditLog(APP.token, { limit: 300 });
  }

  function _adnReloadAudit() { _ADN.audit = []; _adnLoadAudit(); }

  function _adnRenderAudit() {
    var wrap = document.getElementById('adn-audit-wrap');
    if (!wrap) return;

    if (!_ADN.audit.length) {
      wrap.innerHTML = _renderEmptyState('Belum ada jejak audit', 'Catatan perubahan akun, persetujuan, dan pembaruan master data akan tampil di sini.');
      return;
    }

    var t = '<div class="n-table-wrap"><table class="n-table n-table-full"><thead><tr>' +
      '<th>Waktu</th><th>Pelaku</th><th>Aksi</th><th>Objek</th><th>Keterangan</th>' +
      '</tr></thead><tbody>';

    for (var i = 0; i < _ADN.audit.length; i++) {
      var r = _ADN.audit[i];
      var aksiUpper = String(r.aksi || '').toUpperCase();
      var aksiBadge = aksiUpper === 'VOID' || aksiUpper === 'DELETE' ? 'badge-danger'
        : (aksiUpper === 'CREATE' || aksiUpper === 'APPROVE' ? 'badge-ok' : 'badge-info');
      t += '<tr>' +
        '<td class="td-nowrap">' + _esc(_fmtDateTimeId(r.timestamp)) + '</td>' +
        '<td><strong>' + _esc(_humanActor(r.userName, r.userId)) + '</strong>' +
        '<span class="td-sub">' + _esc(ROLE_LABEL[r.userRole] || _humanEnum(r.userRole) || '\u2014') + '</span></td>' +
        '<td><span class="badge ' + aksiBadge + '">' + _esc(_humanAuditAction(r.aksi)) + '</span></td>' +
        '<td>' + _esc(_humanSheetTarget(r.sheetTarget)) + '</td>' +
        '<td>' + _esc(r.alasan || '\u2014') + '</td>' +
        '</tr>';
    }

    t += '</tbody></table></div>';
    wrap.innerHTML = t;
  }

  function _adnFmtDateTime(v) {
    return _fmtDateTimeId(v);
  }

  // ── TAB PENGINGAT MINGGUAN (SUPERADMIN) ───────────────────
  function _adnLoadReminder() {
    var statusEl = document.getElementById('adn-reminder-status');
    if (statusEl) statusEl.textContent = 'Memuat…';
    _msg('adn-reminder-msg', null);
    _asyncArm('adn-reminder', statusEl, '_adnLoadReminder()');

    google.script.run
      .withSuccessHandler(function (res) {
        _asyncDisarm('adn-reminder');
        if (_asyncResErr(res)) {
          if (statusEl) statusEl.textContent = _asyncResErr(res);
          return;
        }
        try {
          _adnRenderReminder(res.data);
        } catch (e) {
          _asyncDisarm('adn-reminder');
          if (window.console && console.error) console.error('[radar-poa] render gagal: reminder', e);
          if (statusEl) statusEl.textContent = 'Gagal menampilkan status: ' +
            (e && e.message ? e.message : String(e));
        }
      })
      .withFailureHandler(function (err) {
        _asyncDisarm('adn-reminder');
        if (statusEl) statusEl.textContent = _failOrLogout(err) || 'Koneksi terputus.';
      })
      .notifikasi_getReminderSettings(APP.token);
  }

  function _adnRenderReminder(data) {
    var statusEl = document.getElementById('adn-reminder-status');
    var btn = document.getElementById('btn-adn-reminder-toggle');
    if (statusEl) {
      statusEl.textContent = (data && data.aktif)
        ? 'Aktif — dikirim otomatis setiap ' + data.jadwal
        : 'Nonaktif — belum ada pengiriman otomatis. Jadwal: ' + (data ? data.jadwal : 'Jumat 16:00');
    }
    if (btn) {
      btn.textContent = (data && data.aktif) ? 'Matikan Otomatis' : 'Aktifkan Otomatis';
      btn._aktif = !!(data && data.aktif);
    }
  }

  function _adnToggleReminder() {
    var btn = document.getElementById('btn-adn-reminder-toggle');
    var next = !(btn && btn._aktif);
    _setLoading(btn, true);
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _msg('adn-reminder-msg', 'error', res.error); return; }
        _adnRenderReminder(res.data);
        _msg('adn-reminder-msg', 'success', next ? 'Pengiriman otomatis diaktifkan.' : 'Pengiriman otomatis dimatikan.');
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg('adn-reminder-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
      })
      .notifikasi_setReminderAktif(APP.token, next);
  }

  function _adnSendReminderNow() {
    if (!confirm('Kirim pengingat sekarang ke divisi yang belum melapor?')) return;
    var btn = document.getElementById('btn-adn-reminder-send');
    _setLoading(btn, true);
    _msg('adn-reminder-msg', null);
    var box = document.getElementById('adn-reminder-result');
    if (box) box.innerHTML = '';

    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _msg('adn-reminder-msg', 'error', res.error); return; }
        _msg('adn-reminder-msg', 'success', 'Pengingat dikirim.');
        if (box) box.innerHTML = _adnReminderResult(res.data);
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg('adn-reminder-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
      })
      .notifikasi_generateReminderMingguan(APP.token);
  }

  function _adnReminderResult(d) {
    if (!d) return '';
    var divisions = _asArray(d.divisions);
    if (divisions.length === 0) {
      return '<div class="sec-table-card">' + _renderEmptyState(
        'Seluruh unit kerja sudah melapor',
        'Tidak ada pengingat yang perlu dikirim untuk periode ' + (d.periode || 'berjalan') + '.'
      ) + '</div>';
    }
    var rows = divisions.map(function (x) {
      return '<tr><td>' + _esc(x.label) + '</td><td class="text-right table-num">' + _idNum(x.targetCount) + '</td></tr>';
    }).join('');
    // Kegagalan email tidak boleh terlihat seperti "tidak ada yang perlu dikirim".
    var errList = _asArray(d.emailErrors);
    var errBlock = '';
    if (errList.length) {
      var errRows = errList.map(function (e) {
        return '<tr><td>' + _esc(e.email || '\u2014') + '</td><td>' + _esc(e.reason || 'Gagal mengirim email.') + '</td></tr>';
      }).join('');
      errBlock = '<div class="mt-md">' +
        '<div class="n-msg error show">' +

          : '<button type="button" class="btn-primary" onclick="_mdToggleKapal(\'' + _esc(k.kapalId) + '\')">Aktifkan</button>') +

      '</tr></thead><tbody>' + rows + '</tbody></table></div>';

  // Label enum JenisKapal untuk tabel Master Kapal. Opsi diambil dari cache
  // `master_getOpsiJenis`; jika belum termuat, konversi token via _humanEnum.
  function _mdKapalJenisLabel(token) {
    var t = String(token || '').trim();
    if (!t) return '';
    var items = _MD.kapalJenisOptions || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].value === t) return items[i].label;

  function _mdOpenKapalModal(kapalId) {
    _MD.editingKapalId = kapalId || null;
    _mdKapalModalMsg(null);
    var row = kapalId ? (_MD.data.kapal || []).filter(function (k) { return k.kapalId === kapalId; })[0] : null;
    var rowJenis = row ? String(row.jenisKapal || '') : '';

      _mdOpenKapalModalFill(kapalId, row, rowJenis);

  function _mdOpenKapalModalFill(kapalId, row, rowJenis) {

    var idIn = document.getElementById('md-kapal-id');
    var nmIn = document.getElementById('md-kapal-nama');
    var klIn = document.getElementById('md-kapal-kelas');
    var hbIn = document.getElementById('md-kapal-homebase');
    var jnSel = document.getElementById('md-kapal-jenis');
    var stSel = document.getElementById('md-kapal-status');

    _fillOpsiSelect('md-kapal-jenis', _MD.kapalJenisOptions || [], '(Pilih Jenis Kapal)');

    if (row) {
      idIn.value = row.kapalId;
      nmIn.value = row.nama;
      klIn.value = row.kelas || '';
      hbIn.value = row.homebaseUpt || '';
      stSel.value = row.statusAktif ? 'true' : 'false';
      // Kapal lama belum punya JenisKapal → biarkan kosong agar bisa diisi
      // tanpa memaksa admin memilih ulang saat hanya ingin mengubah yang lain.
      if (jnSel) jnSel.value = rowJenis;
      idIn.disabled = true;
      document.getElementById('md-kapal-modal-title').textContent = 'Edit Kapal';
    } else {
      idIn.value = ''; nmIn.value = ''; klIn.value = ''; hbIn.value = '';
      stSel.value = 'true';
      if (jnSel) jnSel.value = '';
      idIn.disabled = false;
      document.getElementById('md-kapal-modal-title').textContent = 'Tambah Kapal';
    }
    document.getElementById('modal-md-kapal').classList.remove('n-hidden');

  // Ambil daftar enum KAPAL_JENIS dari sheet Opsi (lazily, di-cache) untuk
  // mengisi dropdown "Jenis Kapal". Golongan Opsi lain dimuat lewat tab Opsi,
  // jadi tidak boleh diasumsikan sudah tersedia saat modal kapal dibuka.
  function _mdLoadKapalJenis(done, onError) {
    if (_MD.kapalJenisOptions) { done(_MD.kapalJenisOptions); return; }
    var fail = function () {
      if (onError) onError();
      else _mdKapalModalMsg('error', 'Gagal memuat daftar Jenis Kapal.');
    };
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success && res.data) {
          var items = ((res.data.groups || {}).KAPAL_JENIS || [])
            .filter(function (it) { return it.aktif !== false; })
            .map(function (it) { return { value: it.label, label: it.labelTampil || it.label }; });
          _MD.kapalJenisOptions = items;
          done(items);
        } else {
          fail();
        }
      })
      .withFailureHandler(fail)
      .master_getOpsiJenis(APP.token);
  }

  function _mdSaveKapal() {
    var editing = !!_MD.editingKapalId;
    var btn = document.getElementById('md-btn-kapal-save');
    var params = {
      kapalId: ((document.getElementById('md-kapal-id') || {}).value || '').trim(),
      nama: ((document.getElementById('md-kapal-nama') || {}).value || '').trim(),
      kelas: ((document.getElementById('md-kapal-kelas') || {}).value || '').trim(),
      homebaseUpt: ((document.getElementById('md-kapal-homebase') || {}).value || '').trim(),
      jenisKapal: ((document.getElementById('md-kapal-jenis') || {}).value || '').trim(),
      statusAktif: ((document.getElementById('md-kapal-status') || {}).value || 'true') === 'true'
    };

    if (!params.kapalId || !params.nama) {
      _mdKapalModalMsg('error', 'KapalID dan Nama wajib diisi.');
      return;
    }
    // JenisKapal menentukan kapal mana yang muncul di form Operasi Laut untuk
    // tiap Kategori Hari Operasi (Fase 14 Item 6) — jadi wajib saat buat baru.
    if (!params.jenisKapal) {
      _mdKapalModalMsg('error', 'Jenis Kapal wajib dipilih.');
      return;
    }
    _mdKapalModalMsg(null);
    _setLoading(btn, true);

    var runner = google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _mdKapalModalMsg('error', res.error); return; }
        _formSubmitDone('modal-md-kapal', res.message, function () {
          _mdKapalMsg('success', res.message);
          _MD.data.kapal = null;
          _mdLoadKapal();
        });
      })
      .withFailureHandler(function () {
        _setLoading(btn, false);
        _mdKapalModalMsg('error', 'Terjadi kesalahan koneksi. Coba lagi.');
      });

    if (editing) runner.master_updateKapal(APP.token, params);
    else runner.master_createKapal(APP.token, params);
  }

  function _mdToggleKapal(kapalId) {
    var row = (_MD.data.kapal || []).filter(function (k) { return k.kapalId === kapalId; })[0];
    if (!row) return;
    var target = !row.statusAktif;
    var label = target ? 'mengaktifkan' : 'menonaktifkan';
    if (!confirm('Yakin ' + label + ' kapal ' + kapalId + '?')) return;

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { _mdKapalMsg('error', res.error); return; }
        _mdKapalMsg('success', res.message);
        _MD.data.kapal = null;
        _mdLoadKapal();
      })
      .withFailureHandler(function () { _mdKapalMsg('error', 'Gagal memperbarui status kapal.'); })
      .master_updateKapal(APP.token, { kapalId: kapalId, statusAktif: target });
  }

   * Memanggil silent reloader spesifik modul aktif dengan preservasi scroll window & table.
   */
  function _dispatchModuleSilentReloader(viewId) {
    var reloader = _SYNC_RELOADERS[viewId];
    if (typeof reloader !== 'function') return;

    // Preservasi scroll window dan kontainer tabel
    var scrollPos = (typeof window !== 'undefined') ? (window.pageYOffset || document.documentElement.scrollTop || 0) : 0;
    var tableWraps = document.querySelectorAll('.n-table-wrap, .n-table-container, .table-responsive');
    var wrapScrolls = [];
    tableWraps.forEach(function (el) {
      wrapScrolls.push({ el: el, top: el.scrollTop, left: el.scrollLeft });
    });

    try {
      reloader();
    } catch (e) {
      if (window.console && console.warn) {
        console.warn('[LiveSync] Silent reload view "' + viewId + '" error:', e);
      }
    }

    // Restore scroll positions setelah render update selesai
    setTimeout(function () {
      if (typeof window !== 'undefined' && scrollPos > 0) {
        window.scrollTo({ top: scrollPos, behavior: 'instant' });
      }
      wrapScrolls.forEach(function (ws) {
        if (ws.el && ws.el.isConnected) {
          ws.el.scrollTop = ws.top;
          ws.el.scrollLeft = ws.left;
        }
      });
    }, 120);

   * Dispatcher silent reload untuk tampilan yang sedang aktif.
   * Dipanggil ketika ada pembaruan versi transaksi dari server (DASH_TX_VERSION)
   * dan dipastikan tidak ada modal formulir yang sedang aktif.
   */
  function _executeCurrentViewReloader() {
    if (!APP.token || !APP.user) return;
    var view = APP.currentView;

    _silentRun(function () {
      // 1. Selalu perbarui status badge & reminder bar shell
      _applyShellStatus();

      // 2. Eksekusi silent reload melalui registry modular
      _dispatchModuleSilentReloader(view);
    });
  }

  function _runHeartbeatTick() {
    _runSyncTick(false);
  }

  /**
   * Eksekutor heartbeat utama (Fase 15a):
   * Mengirim permintaan ringan ke endpoint backend app_getSyncState (RAM zero-sheet-read, <50ms).
   * Mendeteksi perubahan versi transaksi, unread notifikasi, dan antrean approval.
   */
  function _runSyncTick(force) {
    if (!APP.token || !APP.user) return;
    var now = Date.now();
    if (!force && (now - _lastHeartbeatTick < 10000)) return; // tenggang minimum 10 detik antar tick
    if (APP_SYNC.inFlight) return;

    _lastHeartbeatTick = now;
    APP_SYNC.inFlight = true;

    if (force) {
      _syncUpdateIndicator('syncing');
    }

    _silentRun(function () {
      google.script.run
        .withSuccessHandler(function (res) {
          APP_SYNC.inFlight = false;
          if (!res || !res.success) {
            _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
            return;
          }

          APP_SYNC.lastSyncTime = Date.now();
          var d = res.data || {};

          // 0. Update telemetri waktu transaksi terakhir (Fase 17)
          if (d.lastTxMetadata !== undefined) {
            APP_SYNC.lastTxMetadata = d.lastTxMetadata;
            _updateTelemetryTimestampUI();
          }

          // 1. Update badge notifikasi jika data unread tersedia
          if (typeof d.unreadNotif === 'number') {
            _renderNotifBadge(d.unreadNotif);
          }

          // 2. Update antrean approval (jika role approver)
          if (typeof d.queueCount === 'number') {
            var isApprover = (APP.user.role === 'SUPERADMIN' || APP.user.role === 'DIREKTUR' || APP.user.role === 'KADIV');
            if (isApprover) {
              var banner = document.getElementById('dr-banner');
              var bannerCount = document.getElementById('dr-banner-count');
              if (banner && bannerCount) {
                bannerCount.textContent = String(d.queueCount);
                if (d.queueCount > 0) banner.classList.remove('n-hidden');
                else banner.classList.add('n-hidden');
              }
              var drawer = document.getElementById('approval-drawer');
              var drawerOpen = drawer && !drawer.classList.contains('n-hidden');
              if (drawerOpen || APP.currentView === 'kelola-akun') {
                if (typeof _refreshApprovalPanels === 'function') {
                  _refreshApprovalPanels();
                }
              }
            }
          }

          // 3. Deteksi perubahan versi transaksi global (txVersion)
          var serverTx = (d.txVersion !== undefined && d.txVersion !== null) ? String(d.txVersion) : '';
          if (serverTx) {
            if (APP_SYNC.lastTxVersion === null) {
              // Inisialisasi awal saat login/pertama kali load
              APP_SYNC.lastTxVersion = serverTx;
              _syncUpdateIndicator('synced');
            } else if (serverTx !== APP_SYNC.lastTxVersion) {
              // Terjadi transaksi baru di server (tambah/edit/anulir)
              APP_SYNC.lastTxVersion = serverTx;
              if (_isFormActive()) {
                // Pengguna sedang membuka modal formulir: TUNDA reload demi keamanan data input
                APP_SYNC.deferredReload = true;
                _syncUpdateIndicator('deferred');
              } else {
                // Tidak ada formulir aktif: langsung lakukan silent reload tanpa refresh halaman
                APP_SYNC.deferredReload = false;
                _syncUpdateIndicator('syncing');
                _executeCurrentViewReloader();
                setTimeout(function () { _syncUpdateIndicator('synced'); }, 400);
              }
            } else {
              // Versi transaksi server sama dengan lokal
              if (APP_SYNC.deferredReload && !_isFormActive()) {
                APP_SYNC.deferredReload = false;
                _syncUpdateIndicator('syncing');
                _executeCurrentViewReloader();
                setTimeout(function () { _syncUpdateIndicator('synced'); }, 400);
              } else if (APP_SYNC.deferredReload) {
                _syncUpdateIndicator('deferred');
              } else {
                _syncUpdateIndicator('synced');
              }
            }
          } else {
            _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
          }
        })
        .withFailureHandler(function (err) {
          APP_SYNC.inFlight = false;
          _failOrLogout(err);
          _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
        })
        .app_getSyncState(APP.token);
    });
  }

  function _startAppHeartbeat() {
    if (_appHeartbeatTimer) clearInterval(_appHeartbeatTimer);
    _appHeartbeatTimer = setInterval(function () {

        ? (document.visibilityState === 'visible')

    _hdLoadEvidence(d.refSheet, d.rowId);
  }

  function _hdLoadEvidence(refSheet, rowId) {
    var list = document.getElementById('hd-evidence');
    if (!list) return;
    list.innerHTML = _loadingInline('Memuat lampiran\u2026');
    if (!refSheet || !rowId) {
      list.innerHTML = '<div class="hd-empty-note">Tidak ada lampiran.</div>';
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          list.innerHTML = '<div class="n-msg error show">' + _esc((res && res.error) || 'Gagal memuat lampiran.') + '</div>';
          return;
        }
        var evList = _asArray(res.data);
        if (!evList.length) {
          list.innerHTML = '<div class="ntf-read-lbl">Belum ada lampiran untuk laporan ini.</div>';
          return;
        }
        list.innerHTML = evList.map(function (e) {
          var tgl = _fmtDateTimeId(e.uploadedAt);
          return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-rule);">' +
            '<a href="' + _esc(e.viewUrl) + '" target="_blank" rel="noopener" style="color:var(--action-primary);">' + _esc(e.fileName) + '</a>' +
            '<span class="ntf-read-lbl td-nowrap">' + _esc(e.sourceMode || '') + ' \u00b7 ' + _esc(tgl) + '</span>' +
            '</div>';
        }).join('');
      })
      .withFailureHandler(function () {
        list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran. Coba lagi.</div>';
      })
      .evidence_list(APP.token, refSheet, rowId);
  }

  // ══════════════════════════════════════════════════════════
  // RENDERER RIWAYAT DIVISI — SATU IMPLEMENTASI UNTUK SEMUA MODUL
  // ══════════════════════════════════════════════════════════
  // Bentuk tabel riwayat seragam di setiap divisi:
  //   Periode | …kolom khusus modul… | Dikirim | Status | Aksi
  //   Aksi   : Lihat · Revisi · Anulir  (urutan tetap, Anulir destruktif di akhir)
  //   Status : badge AKTIF / DITIMPA / DIANULIR dari token tema
  //   VOID   : baris tinted + komentar anulir inline (ARCHITECTURE.md §5, PRD §7.4)
  // Modul hanya supplying konfigurasi `columns` / `cells` / `detail` dan callback
  // revisi-anulir-nya; badge, baris anulir, empty state, dan aksi tetap di sini
  // supaya tidak ada lagi salinan yang menyimpang antar modul.

  // Modul "Gen-1" (Tata Usaha, Operasi Laut/Udara, Intelijen, Kegiatan, Pemantauan)
  // mengirim baris apa adanya dari sheet dengan key PascalCase. Normalisasi di
  // sisi client saja — kontrak endpoint server tidak diubah.
  var _HIST_KEYMAP = {
    RowID: 'rowId', DivisiID: 'divisiId', Periode: 'periode', Timestamp: 'timestamp',
    SubmittedBy: 'submittedBy', SubmittedByName: 'submittedByName',
    Status: 'status', SupersedesRowID: 'supersedesRowId',
    VoidReason: 'voidReason', VoidedBy: 'voidedBy', VoidedByName: 'voidedByName', VoidedAt: 'voidedAt'
  };

  function _histNorm(r) {
    var out = {}, k;
    for (k in r) if (Object.prototype.hasOwnProperty.call(r, k)) out[k] = r[k];
    for (k in _HIST_KEYMAP) {
      if (out[_HIST_KEYMAP[k]] === undefined && out[k] !== undefined) out[_HIST_KEYMAP[k]] = out[k];
    }
    return out;
  }

  function _histBadge(status) {
    var s = String(status || '').toUpperCase();
    if (s === 'ACTIVE') return '<span class="badge badge-ok">Aktif</span>';
    if (s === 'VOID') return '<span class="badge badge-danger">Dianulir</span>';
    return '<span class="badge badge-neutral">Ditimpa</span>';
  }

  // Badge status domain (mis. Siap/Tidak Siap, Baseline/Penggunaan)
  function _histBadgeTone(label, tone) {
    return '<span class="status-badge ' + tone + '">' + _esc(label) + '</span>';
  }

  function _histRowAttrs(status) {
    var s = String(status || '').toUpperCase();
    if (s === 'VOID') return ' class="hist-row-void"';
    if (s === 'SUPERSEDED') return ' class="hist-row-ditampa"';
    return '';
  }

  function _histActions(cfg, r) {
    var active = String(r.status || '').toUpperCase() === 'ACTIVE';
    var sheet = (typeof cfg.refSheet === 'function') ? cfg.refSheet(r) : cfg.refSheet;
    var out = '<button type="button" class="btn-row-subtle" onclick="_hdOpen(' +
      _hdPush(sheet, r.rowId, cfg.title(r), cfg.detail(r), cfg.manage ? cfg.manage(r) : null) +
      ')">Lihat</button>';
    if (active && cfg.revisi) out += '<button type="button" class="btn-row-subtle" onclick="' + cfg.revisi(r) + '">Revisi</button>';
    if (active && cfg.anulir) out += '<button type="button" class="btn-row-danger" onclick="' + cfg.anulir(r) + '">Anulir</button>';
    return '<div class="hist-actions ctl-row ctl-sm ctl-nowrap">' + out + '</div>';
  }

  function _histRender(wrapId, cfg, rows, prefixHtml) {
    var wrap = document.getElementById(wrapId);
    if (!wrap) return;
    _hdReset();
    var pre = prefixHtml || '';
    var items = _asArray(rows).map(_histNorm);

    if (!items.length) {
      wrap.innerHTML = pre + _renderEmptyState(cfg.empty || 'Belum ada data untuk periode ini.', cfg.emptySub || '');
      return;
    }

    var nowrapSet = {};
    _asArray(cfg.nowrapCols).forEach(function (idx) { nowrapSet[idx] = true; });

    var t = '<div class="n-table-wrap"><table class="n-table"><thead><tr>';
    cfg.columns.forEach(function (c) { t += '<th>' + _esc(c) + '</th>'; });
    t += '<th>Dikirim</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';

    items.forEach(function (r) {
      t += '<tr' + _histRowAttrs(r.status) + '>';
      cfg.cells(r).forEach(function (cell, idx) {
        t += nowrapSet[idx] ? ('<td class="td-nowrap">' + cell + '</td>') : ('<td>' + cell + '</td>');
      });
      t += '<td class="td-nowrap">' + _esc(_fmtDateId(r.timestamp)) + '</td>';
      t += '<td>' + _histBadge(r.status) + '</td>';
      t += '<td>' + _histActions(cfg, r) + '</td>';
      t += '</tr>';

      if (String(r.status || '').toUpperCase() === 'VOID' && r.voidReason) {
        var voidActor = _humanActor(r.voidedByName, r.voidedBy);
        t += '<tr class="hist-void-note"><td colspan="' + (cfg.columns.length + 3) + '">' +
          '<strong>Alasan Anulir:</strong> ' + _esc(r.voidReason) +
          (voidActor ? ' (oleh ' + _esc(voidActor) + ')' : '') + '</td></tr>';
      }
    });

    wrap.innerHTML = pre + t + '</tbody></table></div>';
  }

  // ── LOADING INDICATORS ────────────────────────────────────

  function _loadingInline(text) {
    return '<div class="md-loading-inline"><span class="n-spin-sm"></span><span>' +
      _esc(text || 'Memuat\u2026') + '</span></div>';

  function _kpiSkeleton(n) {

    for (var i = 0; i < (n || 4); i++) {
      chips += '<div class="n-card kpi-skeleton-item"><div class="sk-bar sk-bar-lg"></div>' +

    }

  function _tableSkeleton(rows, cols) {
    var h = '<thead><tr>';
    for (var c = 0; c < (cols || 3); c++) h += '<th><div class="sk-bar sk-bar-sm" style="width:80%;"></div></th>';
