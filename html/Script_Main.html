// Cek apakah overlay memiliki field yang telah diisi pengguna.
function _modalHasDirtyFields(overlayEl) {
  var inputs = overlayEl.querySelectorAll('input, textarea, select');
  for (var i = 0; i < inputs.length; i++) {
    var el = inputs[i];
    // Skip: hidden, disabled, readonly, checkbox "tidak perlu lampiran"
    if (el.type === 'hidden' || el.disabled || el.readOnly) continue;
    if (el.type === 'checkbox') continue;
    // Skip: input bertipe file (nilai default = '')
    if (el.type === 'file') continue;
    // Select: dirty bila berubah dari option pertama (index 0) dan option > 1
    if (el.tagName === 'SELECT') {
      if (el.options.length > 1 && el.selectedIndex > 0) return true;
      continue;
    }
    var v = (el.value || '').trim();
    // Angka: dirty jika bukan '0' dan bukan ''
    if (el.type === 'number') { if (v !== '' && v !== '0') return true; continue; }
    if (v !== '') return true;
  }
  return false;
}

// Pasang listener overlay-click-to-close satu kali saat init.
function _initOverlayClose() {
  document.addEventListener('click', function (e) {
    // Cari overlay terdekat yang menjadi target klik
    var overlay = e.target;
    if (!overlay || !overlay.classList || !overlay.classList.contains('n-overlay')) return;
    // Klik harus tepat di overlay (bukan di anak elemen .n-modal)
    var modal = overlay.querySelector('.n-modal');
    if (modal && modal.contains(e.target)) return;
    // Lewati overlay yang dikecualikan
    if (_MODAL_OVERLAY_EXCLUDE[overlay.id]) return;
    // Lewati overlay drawer (pakai kelas n-z-drawer)
    if (overlay.classList.contains('n-z-drawer')) return;
    // Lewati overlay yang sudah hidden
    if (overlay.classList.contains('n-hidden')) return;

    // Jika ada field yang diisi, konfirmasi dulu
    if (_modalHasDirtyFields(overlay)) {
      var ok = confirm('Formulir ini memiliki isian yang belum disimpan.\nApakah Anda yakin ingin menutup dan membuang perubahan?');
      if (!ok) return;
    }

    // Cari tombol Batal / fungsi close yang terkait dengan overlay ini
    // (supaya state modul ikut di-reset, mis. _TU.pendingRowId)
    var cancelBtn = overlay.querySelector('button.btn-ghost, button.btn-outline');
    if (cancelBtn && cancelBtn.onclick) {
      cancelBtn.click();
    } else {
      closeModal(overlay.id);
    }
  });

  // ── APPLE DESIGN: ANCHORED MODAL ORIGIN TRACKER ─────────────
  try {
    var _lastClickOrigin = null;
    document.addEventListener('pointerdown', function (e) {
      var btn = e.target.closest('button, .btn, .btn-primary, .btn-mini, .n-iconbtn, a');
      if (btn) {
        _lastClickOrigin = { x: e.clientX, y: e.clientY };
      }
    }, true);

    var _modalObserver = new MutationObserver(function (mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        if (m.type === 'attributes' && m.attributeName === 'class') {
          var target = m.target;
          if (target && target.classList && target.classList.contains('n-overlay') && !target.classList.contains('n-hidden')) {
            var modal = target.querySelector('.n-modal');
            if (modal && _lastClickOrigin) {
              var r = modal.getBoundingClientRect();
              var ox = Math.max(16, Math.min(r.width - 16, _lastClickOrigin.x - r.left));
              var oy = Math.max(16, Math.min(r.height - 16, _lastClickOrigin.y - r.top));
              modal.style.transformOrigin = ox + 'px ' + oy + 'px';
            }
          }
        }
      }
    });
    _modalObserver.observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class'] });
  } catch (e) { /* silent origin helper */ }
}

// ── APPLE DESIGN: GESTURE SHEET SWIPE-TO-DISMISS ────────────
function _initSheetGestures() {
  try {
    var drawer = document.getElementById('dr-drawer');
    if (!drawer) return;
    var startY = 0, currentY = 0, isDragging = false;
    drawer.addEventListener('touchstart', function (e) {
      if (e.target.closest('.sheet-grabber') || (e.target.closest('.n-drawer-hd') && drawer.scrollTop <= 0)) {
        startY = e.touches[0].clientY;
        isDragging = true;
        drawer.style.transition = 'none';
      }
    }, { passive: true });
    drawer.addEventListener('touchmove', function (e) {
      if (!isDragging) return;
      currentY = e.touches[0].clientY;
      var dy = currentY - startY;
      if (dy > 0) {
        drawer.style.transform = 'translateY(' + dy + 'px)';
      }
    }, { passive: true });
    drawer.addEventListener('touchend', function () {
      if (!isDragging) return;
      isDragging = false;
      drawer.style.transition = 'transform 0.34s cubic-bezier(0.16, 1, 0.3, 1)';
      var dy = currentY - startY;
      if (dy > 80) {
        closeApprovalDrawer();
      } else {
        drawer.style.transform = '';
      }
    });
  } catch (e) { /* silent gesture helper */ }
}

// ── MODAL LIHAT RIWAYAT (detail submission, berlaku semua modul) ──
// Tiap renderer riwayat mendorong satu entri detail per baris via _hdPush(),
// lalu menaruh tombol "Lihat" dengan index-nya sebagai argumen onclick.
// Argumen `manage` (opsional) = kode onclick untuk aksi kelola lampiran,
// ditampilkan di bagian "Lampiran" modal — menggantikan tombol "Lampiran"
// terpisah yang dulu ada di baris tabel.

var _HD = { stack: [], cur: null };

function _hdReset() {
  _HD.stack = [];
  _HD.cur = null;
}

function _hdPush(refSheet, rowId, title, fields, manage) {
  var i = _HD.stack.length;
  _HD.stack.push({ refSheet: refSheet, rowId: rowId, title: title, fields: fields || [], manage: manage || null });
  return i;
}

function _hdOpen(i) {
  var d = _HD.stack[i];
  if (!d) return;
  _HD.cur = d;
  var titleEl = document.getElementById('hd-title');
  if (titleEl) titleEl.textContent = d.title;
  var body = document.getElementById('hd-body');
  var rows = '';
  for (var j = 0; j < d.fields.length; j++) {
    rows += '<tr><td class="hd-k">' + d.fields[j][0] + '</td><td class="hd-v">' + d.fields[j][1] + '</td></tr>';
  }
  if (body) body.innerHTML = rows || '<tr><td colspan="2" style="padding:12px;color:var(--n-text-muted);font-size:.85rem;">Tidak ada detail tambahan.</td></tr>';
  var manageEl = document.getElementById('hd-evidence-manage');
  if (manageEl) manageEl.innerHTML = d.manage ? '<button class="btn-mini" onclick="' + d.manage + '">Kelola</button>' : '';
  _hdLoadEvidence(d.refSheet, d.rowId);
  var m = document.getElementById('modal-hd');
  if (m) m.classList.remove('n-hidden');
}

function _hdClose() {
  _HD.cur = null;
  closeModal('modal-hd');
}

// Setelah lampiran ditambah/diubah dari modal kelola, segarkan daftar lampiran
// di modal Lihat bila baris yang sama masih terbuka di sana.
function _hdRefreshEvidenceIfCurrent(refSheet, refRowId) {
  var d = _HD.cur;
  if (!d || d.refSheet !== refSheet || d.rowId !== refRowId) return;
  _hdLoadEvidence(d.refSheet, d.rowId);
}

function _hdLoadEvidence(refSheet, rowId) {
  var list = document.getElementById('hd-evidence');
  if (!list) return;
  list.innerHTML = _loadingInline('Memuat lampiran\u2026');
  if (!refSheet || !rowId) {
    list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Tidak ada lampiran.</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        list.innerHTML = '<div class="n-msg error show">' + _esc((res && res.error) || 'Gagal memuat lampiran.') + '</div>';
        return;
      }
      if (!res.data.length) {
        list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Belum ada lampiran untuk laporan ini.</div>';
        return;
      }
      list.innerHTML = res.data.map(function (e) {
        var tgl = e.uploadedAt ? new Date(e.uploadedAt).toLocaleString('id-ID') : '';
        return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n-border-subtle);">' +
          '<a href="' + _esc(e.viewUrl) + '" target="_blank" rel="noopener" style="color:var(--n-primary);font-size:.85rem;">' + _esc(e.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--n-text-muted);white-space:nowrap;">' + _esc(e.sourceMode) + ' \u00b7 ' + tgl + '</span>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function () {
      list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran. Coba lagi.</div>';
    })
    .evidence_list(APP.token, refSheet, rowId);
}

// ══════════════════════════════════════════════════════════
// RENDERER RIWAYAT DIVISI — SATU IMPLEMENTASI UNTUK SEMUA MODUL
// ══════════════════════════════════════════════════════════
// Bentuk tabel riwayat seragam di setiap divisi:
//   Periode | …kolom khusus modul… | Dikirim | Status | Aksi
//   Aksi   : Lihat · Revisi · Anulir  (urutan tetap, Anulir destruktif di akhir)
//   Status : badge AKTIF / DITIMPA / DIANULIR dari token tema
//   VOID   : baris tinted + komentar anulir inline (ARCHITECTURE.md §5, PRD §7.4)
// Modul hanya supplying konfigurasi `columns` / `cells` / `detail` dan callback
// revisi-anulir-nya; badge, baris anulir, empty state, dan aksi tetap di sini
// supaya tidak ada lagi salinan yang menyimpang antar modul.

// Modul "Gen-1" (Tata Usaha, Operasi Laut/Udara, Intelijen, Kegiatan, Pemantauan)
// mengirim baris apa adanya dari sheet dengan key PascalCase. Normalisasi di
// sisi client saja — kontrak endpoint server tidak diubah.
var _HIST_KEYMAP = {
  RowID: 'rowId', DivisiID: 'divisiId', Periode: 'periode', Timestamp: 'timestamp',
  Status: 'status', SupersedesRowID: 'supersedesRowId',
  VoidReason: 'voidReason', VoidedBy: 'voidedBy', VoidedAt: 'voidedAt'
};

function _histNorm(r) {
  var out = {}, k;
  for (k in r) if (Object.prototype.hasOwnProperty.call(r, k)) out[k] = r[k];
  for (k in _HIST_KEYMAP) {
    if (out[_HIST_KEYMAP[k]] === undefined && out[k] !== undefined) out[_HIST_KEYMAP[k]] = out[k];
  }
  return out;
}

function _histBadge(status) {
  var s = String(status || '').toUpperCase();
  if (s === 'ACTIVE') return '<span class="status-badge aktif">AKTIF</span>';
  if (s === 'VOID') return '<span class="status-badge dianulir">DIANULIR</span>';
  return '<span class="status-badge ditimpa">DITIMPA</span>';
}

// Badge status domain (mis. SIAP/TIDAK SIAP, BASELINE/PENGGUNAAN) — tetap
// bermakna status, bukan dekorasi (DESIGN.md §1.3), jadi memakai kelas yang sama.
function _histBadgeTone(label, tone) {
  return '<span class="status-badge ' + tone + '">' + _esc(label) + '</span>';
}

function _histRowAttrs(status) {
  var s = String(status || '').toUpperCase();
  if (s === 'VOID') return ' class="hist-row-void"';
  if (s === 'SUPERSEDED') return ' class="hist-row-ditampa"';
  return '';
}

function _histActions(cfg, r) {
  var active = String(r.status || '').toUpperCase() === 'ACTIVE';
  var sheet = (typeof cfg.refSheet === 'function') ? cfg.refSheet(r) : cfg.refSheet;
  var out = '<button class="btn-outline" onclick="_hdOpen(' +
    _hdPush(sheet, r.rowId, cfg.title(r), cfg.detail(r), cfg.manage ? cfg.manage(r) : null) +
    ')">Lihat</button>';
  if (active && cfg.revisi) out += '<button class="btn-outline" onclick="' + cfg.revisi(r) + '">Revisi</button>';
  if (active && cfg.anulir) out += '<button class="btn-danger" onclick="' + cfg.anulir(r) + '">Anulir</button>';
  return '<div class="hist-actions ctl-row ctl-sm ctl-nowrap">' + out + '</div>';
}

function _histRender(wrapId, cfg, rows, prefixHtml) {
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;
  _hdReset();
  var pre = prefixHtml || '';
  var items = (rows || []).map(_histNorm);

  if (!items.length) {
    wrap.innerHTML = pre + '<div class="hist-empty">' +
      _esc(cfg.empty || 'Belum ada laporan untuk periode ini.') + '</div>';
    return;
  }

  var t = '<div class="n-table-wrap"><table class="n-table"><thead><tr>';
  cfg.columns.forEach(function (c) { t += '<th>' + _esc(c) + '</th>'; });
  t += '<th>Dikirim</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';

  items.forEach(function (r) {
    t += '<tr' + _histRowAttrs(r.status) + '>';
    cfg.cells(r).forEach(function (cell) { t += '<td>' + cell + '</td>'; });
    t += '<td>' + (r.timestamp ? _esc(new Date(r.timestamp).toLocaleDateString('id-ID')) : '—') + '</td>';
    t += '<td>' + _histBadge(r.status) + '</td>';
    t += '<td>' + _histActions(cfg, r) + '</td>';
    t += '</tr>';

    if (String(r.status || '').toUpperCase() === 'VOID' && r.voidReason) {
      t += '<tr class="hist-void-note"><td colspan="' + (cfg.columns.length + 3) + '">' +
        '<strong>Alasan Anulir:</strong> ' + _esc(r.voidReason) +
        (r.voidedBy ? ' (oleh ' + _esc(r.voidedBy) + ')' : '') + '</td></tr>';
    }
  });

  wrap.innerHTML = pre + t + '</tbody></table></div>';
}

// ── LOADING INDICATORS ────────────────────────────────────

function _loadingInline(text) {
  return '<div class="md-loading-inline"><span class="n-spin-sm"></span><span>' +
    _esc(text || 'Memuat\u2026') + '</span></div>';
}

function _kpiSkeleton(n) {
  var chips = '';
  for (var i = 0; i < (n || 4); i++) {
    chips += '<div class="n-card kpi-skeleton-item"><div class="sk-bar sk-bar-lg"></div>' +
             '<div class="sk-bar sk-bar-sm" style="margin-top:10px;"></div><div class="sk-bar sk-bar-sm" style="margin-top:6px;width:40%;"></div></div>';
  }
  return '<div class="kpi-skeleton">' + chips + '</div>';
}

function _tableSkeleton(rows, cols) {
  var h = '<thead><tr>';
  for (var c = 0; c < (cols || 3); c++) h += '<th><div class="sk-bar sk-bar-sm" style="width:80%;"></div></th>';
  h += '</tr></thead><tbody>';
  for (var r = 0; r < (rows || 4); r++) {
    h += '<tr>';
    for (var cc = 0; cc < (cols || 3); cc++) h += '<td><div class="sk-bar sk-bar-sm"></div></td>';
    h += '</tr>';
  }
  h += '</tbody>';
  return '<div class="n-table-wrap"><table class="n-table n-table-full">' + h + '</table></div>';
}

// ── LAMPIRAN INLINE (Fase 10 revisi) ─────────────────────
// Blok lampiran dirender di dalam tiap form modul divisi. Satu CTA (tombol
// submit) menangani: simpan baris -> upload file/link -> refresh. Centang
// "Pengunggahan ini tidak perlu lampiran" mematikan kewajiban lampiran.
// Dipakai server: evidence_upload / evidence_uploadFromLink (1 baris) dan
// evidence_uploadBatch / evidence_uploadFromLinkBatch (N baris sekaligus).

var _ATTACH = {};

function _attachState(key) {
  return _ATTACH[key] || null;
}

function _attachInit(key, cfg) {
  var el = document.getElementById(String(key) + '-attach');
  if (!el) return null;
  var k = String(key);
  _ATTACH[k] = {
    refSheet: (cfg && cfg.refSheet) || '',
    noAtt: false,
    files: [],
    link: '',
    rowIds: [],
    tasks: [],
    busy: false,
    after: null
  };
  el.innerHTML =
    '<div class="content-section">' +
      '<div class="content-section-hd">Lampiran</div>' +
      '<div class="attach-row">' +
        '<label class="attach-check">' +
          '<input type="checkbox" id="' + k + '-noatt" onchange="_attachToggle(\'' + k + '\')">' +
          '<span>Pengunggahan ini tidak perlu lampiran</span>' +
        '</label>' +
      '</div>' +
      '<div id="' + k + '-fields" class="attach-fields">' +
        '<div class="form-grp">' +
          '<label for="' + k + '-files">Unggah file (bisa lebih dari satu; maks 15MB file biasa, 50MB video)</label>' +
          '<input type="file" id="' + k + '-files" multiple onchange="_attachPickFiles(\'' + k + '\')">' +
        '</div>' +
        '<div class="form-grp">' +
          '<label for="' + k + '-link">Atau tempel link Google Drive</label>' +
          '<input type="text" id="' + k + '-link" placeholder="https://drive.google.com/file/d/..." oninput="_attachLinkInput(\'' + k + '\')">' +
        '</div>' +
        '<div id="' + k + '-list"></div>' +
      '</div>' +
      '<div id="' + k + '-attach-msg" class="n-msg"></div>' +
    '</div>';
  return _ATTACH[k];
}

function _attachToggle(key) {
  var s = _attachState(key);
  if (!s) return;
  var cb = document.getElementById(key + '-noatt');
  s.noAtt = !!(cb && cb.checked);
  var f = document.getElementById(key + '-fields');
  if (f) f.style.display = s.noAtt ? 'none' : 'grid';
  _attachMsg(key, null);
}

function _attachPickFiles(key) {
  var s = _attachState(key);
  if (!s) return;
  var input = document.getElementById(key + '-files');
  if (input && input.files) {
    var rejectedVideos = [];
    for (var i = 0; i < input.files.length; i++) {
      var file = input.files[i];
      var isVideo = file.type && file.type.indexOf('video/') === 0;
      // Enforce video policy (Fase 17): Video > 20MB wajib via link Drive / YouTube
      if (isVideo && file.size > 20 * 1024 * 1024) {
        rejectedVideos.push(file.name + ' (' + (file.size / (1024 * 1024)).toFixed(1) + 'MB)');
        continue;
      }
      s.files.push(file);
    }
    input.value = '';
    if (rejectedVideos.length > 0) {
      _attachMsg(key, 'warn', 'Video melebihi batas 20MB: ' + rejectedVideos.join(', ') + '. Sesuai kebijakan penyimpanan, silakan gunakan opsi tautan Google Drive / YouTube.');
    } else {
      _attachMsg(key, null);
    }
  }
  _attachRenderList(key);
}

function _attachRemoveFile(key, idx) {
  var s = _attachState(key);
  if (!s) return;
  s.files.splice(idx, 1);
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachLinkInput(key) {
  var s = _attachState(key);
  if (!s) return;
  var inp = document.getElementById(key + '-link');
  s.link = (inp && inp.value || '').trim();
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachClearLink(key) {
  var s = _attachState(key);
  if (!s) return;
  s.link = '';
  var inp = document.getElementById(key + '-link');
  if (inp) inp.value = '';
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachRenderList(key) {
  var s = _attachState(key);
  var el = document.getElementById(key + '-list');
  if (!s || !el) return;
  var html = (s.files.length || s.link) ? '<div class="attach-list">' : '';
  for (var i = 0; i < s.files.length; i++) {
    html += '<div class="attach-chip"><b>File</b><span>' + _esc(s.files[i].name) + '</span>' +
      '<button type="button" class="n-chip-x" title="Hapus file" aria-label="Hapus file" ' +
        'onclick="_attachRemoveFile(\'' + key + '\',' + i + ')">' + _ico('x', 14) + '</button></div>';
  }
  if (s.link) {
    html += '<div class="attach-chip"><b>Link</b><span>' + _esc(s.link) + '</span>' +
      '<button type="button" class="n-chip-x" title="Hapus link" aria-label="Hapus link" ' +
        'onclick="_attachClearLink(\'' + key + '\')">' + _ico('x', 14) + '</button></div>';
  }
  html += (s.files.length || s.link) ? '</div>' : '';
  el.innerHTML = html;
}

function _attachMsg(key, type, text) {
  var el = document.getElementById(key + '-attach-msg');
  if (!el) return;
  if (!type) { el.className = 'n-msg'; el.innerHTML = ''; return; }
  if (type === 'warn') {
    el.className = 'n-msg warn show';
    el.innerHTML = '<div class="attach-retry">' + _esc(text || '') + ' ' +
      '<button type="button" onclick="_attachRetry(\'' + key + '\')">Ulangi upload lampiran</button></div>';
    return;
  }
  el.className = 'n-msg ' + type + ' show';
  el.innerHTML = _esc(text || '');
}

/**
 * Validasi blok lampiran: default wajib ada file/link, kecuali dicentang
 * "tidak perlu lampiran". Mengembalikan '' jika valid, pesan error jika tidak.
 */
function _attachValidate(key) {
  var s = _attachState(key);
  if (!s) return '';
  if (s.noAtt) return '';
  if (s.files.length === 0 && !s.link) {
    return 'Lampiran wajib pada pengunggahan ini, atau centang \u201cPengunggahan ini tidak perlu lampiran\u201d.';
  }
  if (s.link && !/drive\.google\.com/.test(s.link) && !/youtube\.com|youtu\.be/.test(s.link) && !/^[a-zA-Z0-9_\-]{20,}$/.test(s.link)) {
    return 'Link harus berupa URL Google Drive atau tautan YouTube yang valid.';
  }
  return '';
}

function _attachReset(key) {
  var s = _attachState(key);
  if (!s) return;
  s.noAtt = false;
  s.files = [];
  s.link = '';
  s.rowIds = [];
  s.tasks = [];
  s.busy = false;
  s.after = null;
  var cb = document.getElementById(key + '-noatt');
  if (cb) cb.checked = false;
  var f = document.getElementById(key + '-fields');
  if (f) f.style.display = 'grid';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachReadBase64(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var data = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
    cb(data || null);
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/**
 * Kompresi Kanvas Sisi Klien (Fase 17):
 * Mengubah resolusi gambar raster (JPEG/PNG/WEBP) ke max-width 1600px dan mengompresnya
 * ke format JPEG kualitas 0.8 sebelum di-encode ke Base64. Menghemat kuota Google Drive
 * dan mencegah batas kuota/timeout payload GAS.
 */
function _compressImageCanvas(file, maxWidth, quality, cb) {
  if (!file.type || !file.type.match(/^image\/(jpeg|png|webp)/i)) {
    _attachReadBase64(file, function (b64) {
      cb({ name: file.name, mime: file.type || 'application/octet-stream', b64: b64 });
    });
    return;
  }

  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      try {
        var targetW = img.width;
        var targetH = img.height;
        if (targetW > maxWidth) {
          targetH = Math.round((targetH * maxWidth) / targetW);
          targetW = maxWidth;
        }
        var canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, targetW, targetH);

        var dataUrl = canvas.toDataURL('image/jpeg', quality || 0.8);
        var b64 = dataUrl.replace(/^data:[^;]+;base64,/, '');
        var newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
        cb({ name: newName, mime: 'image/jpeg', b64: b64 });
      } catch (err) {
        var fallbackB64 = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
        cb({ name: file.name, mime: file.type, b64: fallbackB64 });
      }
    };
    img.onerror = function () {
      var fallbackB64 = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
      cb({ name: file.name, mime: file.type, b64: fallbackB64 });
    };
    img.src = e.target.result;
  };
  reader.onerror = function () {
    cb({ name: file.name, mime: file.type, b64: null });
  };
  reader.readAsDataURL(file);
}

/**
 * Upload semua lampiran (file/link) ke baris hasil submit, lalu reset blok.
 * @param key   - kunci state blok (prefix form)
 * @param rowIds- RowID baris tujuan (1..N dari hasil submit)
 * @param after - callback(ok:boolean) setelah seluruh tentatif selesai
 */
function _attachUploadAll(key, rowIds, after) {
  var s = _attachState(key);
  if (!s) return;
  if (s.noAtt || !s.refSheet || !rowIds || !rowIds.length) { if (after) after(true); return; }
  if (s.files.length === 0 && !s.link) { if (after) after(true); return; }

  s.rowIds = rowIds;
  s.after = after;
  s.busy = true;
  s.tasks = [];
  for (var i = 0; i < s.files.length; i++) {
    s.tasks.push({ kind: 'file', file: s.files[i], base64: null });
  }
  if (s.link) s.tasks.push({ kind: 'link', url: s.link });

  if (s.tasks.length === 0) { if (after) after(true); return; }

  // Data sudah tersimpan, sekarang tinggal mengunggah lampiran — lanjutkan
  // overlay besar dengan status baru supaya prosesnya tetap terlihat.
  var mid = _attachModalId(key);
  if (mid) _formLoadingOverlay(mid, true, 'Mengunggah lampiran\u2026');
  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

function _attachReadTasks(key, idx, done) {
  var s = _attachState(key);
  if (idx >= s.tasks.length) { done(); return; }
  var t = s.tasks[idx];
  if (t.kind !== 'file' || t.base64) { _attachReadTasks(key, idx + 1, done); return; }
  _compressImageCanvas(t.file, 1600, 0.8, function (res) {
    t.base64 = res.b64;
    t.compressedName = res.name;
    t.compressedMime = res.mime;
    _attachReadTasks(key, idx + 1, done);
  });
}

function _attachRunNext(key, idx) {
  var s = _attachState(key);
  if (!s) return;
  if (idx >= s.tasks.length) {
    s.busy = false;
    var doneCb = s.after;
    _attachMsg(key, 'success', 'Semua lampiran berhasil diunggah.');
    _attachReset(key);
    if (doneCb) doneCb(true);
    return;
  }

  var t = s.tasks[idx];
  var single = s.rowIds.length === 1;
  var runner = google.script.run.withSuccessHandler(function (res) {
    if (res && res.success) {
      s.tasks.splice(idx, 1);
      _attachRunNext(key, idx);
    } else {
      _attachFail(key, (res && res.error) || 'Upload gagal.');
    }
  }).withFailureHandler(function () {
    _attachFail(key, 'Terjadi kesalahan koneksi saat mengunggah lampiran.');
  });

  if (t.kind === 'file') {
    var params = {
      refSheet: s.refSheet,
      fileName: t.compressedName || t.file.name,
      mimeType: t.compressedMime || t.file.type || 'application/octet-stream',
      dataBase64: t.base64
    };
    if (single) { params.refRowId = s.rowIds[0]; runner.evidence_upload(APP.token, params); }
    else        { params.refRowIds = s.rowIds;     runner.evidence_uploadBatch(APP.token, params); }
  } else {
    var p2 = { refSheet: s.refSheet, url: t.url };
    if (single) { p2.refRowId = s.rowIds[0]; runner.evidence_uploadFromLink(APP.token, p2); }
    else        { p2.refRowIds = s.rowIds;   runner.evidence_uploadFromLinkBatch(APP.token, p2); }
  }
}

function _attachFail(key, text) {
  var s = _attachState(key);
  if (!s) return;
  s.busy = false;
  var doneCb = s.after;
  s.after = null;
  var mid = _attachModalId(key);
  if (mid) _formLoadingOverlay(mid, false);
  _attachMsg(key, 'warn', text + ' Baris sudah tersimpan; lampiran yang belum ter-upload akan dicoba lagi.');
  if (doneCb) doneCb(false);
}

function _attachRetry(key) {
  var s = _attachState(key);
  if (!s || s.busy) return;
  if (!s.tasks.length) return;
  s.after = null;
  s.busy = true;
  _attachMsg(key, null);
  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

/** Bersihkan input file/link setelah semua berhasil (state file/link di-reset). */
function _attachResetFieldsOnly(key) {
  var s = _attachState(key);
  if (!s) return;
  s.files = [];
  s.link = '';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
}

/**
 * Bawa lampiran baris lama ke baris baru hasil revisi (fire-and-forget).
 * Dipanggil setelah revisi sukses, agar lampiran tidak "hilang" dari baris aktif.
 */
function _attachCarry(refSheet, fromRowId, toRowId) {
  if (!refSheet || !fromRowId || !toRowId) return;
  google.script.run
    .withFailureHandler(function () { /* non-blokir — revisi tetap sukses */ })
    .evidence_carry(APP.token, { refSheet: refSheet, fromRowId: fromRowId, toRowId: toRowId });
}


// ============================================================
// MODUL KEGIATAN DIREKTORAT — Fase 11 (PRD §5.10)
// Lintas-divisi (Direktur + semua Kadiv), feed kronologis per tanggal.
// Form input memakai POLA POPUP (backlog A).
// ============================================================
var _KGD = {
  pendingRowId: null,
  rows:         []
};

function _renderKegiatan(el) {
  var tpl = document.getElementById('view-tpl-kegiatan');
  if (!tpl) { el.innerHTML = _moduleStub('Kegiatan Pendukung'); return; }
  el.innerHTML = tpl.innerHTML;
  _attachInit('kgd', { refSheet: 'TX_KegiatanDirektorat' });

  _KGD.rows = [];

  var tglInput = document.getElementById('kgd-tanggal');
  if (tglInput) {
    var now = new Date();
    tglInput.value = now.getFullYear() + '-' +
      (now.getMonth() < 9 ? '0' : '') + (now.getMonth() + 1) + '-' +
      (now.getDate() < 10 ? '0' : '') + now.getDate();
  }

  _kgdLoadKPI();
  _kgdLoadHistory();
}

function _kgdFmtDate(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}

function _kgdDateInput(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '';
  var y = d.getFullYear();
  var m = (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1);
  var dd = (d.getDate() < 10 ? '0' : '') + d.getDate();
  return y + '-' + m + '-' + dd;
}

// ── KPI ──
function _kgdLoadKPI(silent) {
  var strip = document.getElementById('kgd-kpi-strip');
  if (strip && !silent) strip.innerHTML = _kpiSkeleton(3);

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) _kgdRenderKPI(res.data);
      else if (strip) strip.innerHTML = '<div class="n-msg error">Gagal memuat KPI: ' + _esc(res.error) + '</div>';
    })
    .withFailureHandler(function() {
      if (strip) strip.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
    })
    .kegiatanDirektorat_getKPI(APP.token, APP.filter);
}

function _kgdRenderKPI(kpi) {
  var strip = document.getElementById('kgd-kpi-strip');
  if (!strip) return;

  function card(label, value, sub) {
    return '<div class="n-card"><div class="kpi-label">' + _esc(label) + '</div>' +
           '<div class="kpi-val">' + (value || 0) + '</div>' +
           '<div class="kpi-sub">' + _esc(sub || '') + '</div></div>';
  }

  strip.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;">' +
    card('Kegiatan Periode Ini', _idNum(kpi.kegiatanPeriode), 'Dalam rentang filter') +
    card('Kegiatan YTD',        _idNum(kpi.kegiatanYtd),     'Sejak awal tahun terpilih') +
    card('Terakhir Dicatat',    kpi.terakhirDicatat ? _kgdFmtDate(kpi.terakhirDicatat) : '—', 'Entri aktif terbaru') +
  '</div>';
}

// ── FEED KRONOLOGIS ──
function _kgdLoadHistory(silent) {
  var wrap = document.getElementById('kgd-history-wrap');
  if (!wrap) return;
  if (!silent) wrap.innerHTML = _loadingInline('Memuat kegiatan direktorat\u2026');

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) { _KGD.rows = res.data; _kgdRenderHistory(res.data); }
      else wrap.innerHTML = '<div class="n-msg error">' + _esc(res.error) + '</div>';
    })
    .withFailureHandler(function() {
      wrap.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
    })
    .kegiatanDirektorat_getHistory(APP.token, APP.filter);
}

function _kgdRenderHistory(data) {
  var isPimpinan = (APP.user && (APP.user.role === 'DIREKTUR' || APP.user.role === 'SUPERADMIN' || APP.user.role === 'KADIV'));

  _histRender('kgd-history-wrap', {
    // "Periode" ditambahkan agar bentuk kolom sama dengan modul lain; nilainya
    // sudah disimpan server (dateToPeriode dari Tanggal kegiatan), bukan dihitung client.
    columns: ['Periode', 'Tanggal', 'Judul Kegiatan', 'Divisi', 'Pihak Hadir'],
    cells: function (r) {
      return [
        _esc(r.periode),
        _kgdFmtDate(r.Tanggal),
        _esc(r.JudulKegiatan || '—'),
        _esc(r.divisiNama || r.DivisiID || '—'),
        _esc(r.PihakHadir || '—')
      ];
    },
    refSheet: 'TX_KegiatanDirektorat',
    title: function (r) { return 'Kegiatan — ' + (r.JudulKegiatan || '—'); },
    detail: function (r) {
      return [
        ['Periode', _esc(r.periode || '—')],
        ['Tanggal', _kgdFmtDate(r.Tanggal)],
        ['Judul', _esc(r.JudulKegiatan || '—')],
        ['Deskripsi', _esc(r.Deskripsi || '—')],
        ['Pihak Hadir', _esc(r.PihakHadir || '—')],
        ['Divisi', _esc(r.divisiNama || r.DivisiID || '—')],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    },
    revisi: isPimpinan ? function (r) { return "kgdOpenRevisiModal('" + _esc(r.rowId) + "')"; } : null,
    anulir: isPimpinan ? function (r) { return "kgdOpenAnulirModal('" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada kegiatan direktorat pada rentang ini.'
  }, data);
}

// ── FORM POPUP (BACKLOG A) ──
function kgdOpenForm() {
  var judul = document.getElementById('kgd-judul');
  var desk = document.getElementById('kgd-deskripsi');
  var pihak = document.getElementById('kgd-pihak');
  if (judul) judul.value = '';
  if (desk) desk.value = '';
  if (pihak) pihak.value = '';
  var tgl = document.getElementById('kgd-tanggal');
  if (tgl) {
    var now = new Date();
    tgl.value = now.getFullYear() + '-' +
      (now.getMonth() < 9 ? '0' : '') + (now.getMonth() + 1) + '-' +
      (now.getDate() < 10 ? '0' : '') + now.getDate();
  }
  _msg('kgd-form-msg', '', '');
  _attachInit('kgd', { refSheet: 'TX_KegiatanDirektorat' });
  var m = document.getElementById('modal-kgd-form');
  if (m) m.classList.remove('n-hidden');
}

function kgdSubmit() {
  _msg('kgd-form-msg', '', '');
  var judul = _v('kgd-judul');
  var tanggal = _v('kgd-tanggal');
  var deskripsi = _v('kgd-deskripsi');
  var pihak = _v('kgd-pihak');

  if (!judul || !judul.trim()) { _msg('kgd-form-msg', 'error', 'Judul kegiatan wajib diisi.'); return; }
  if (!tanggal) { _msg('kgd-form-msg', 'error', 'Tanggal kegiatan wajib diisi.'); return; }
  if (!deskripsi || !deskripsi.trim()) { _msg('kgd-form-msg', 'error', 'Deskripsi kegiatan wajib diisi.'); return; }

  var attachErr = _attachValidate('kgd');
  if (attachErr) { _msg('kgd-form-msg', 'error', attachErr); return; }

  var btn = document.getElementById('kgd-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('kgd-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _attachUploadAll('kgd', rowIds, function(ok) {
          _formSubmitDone('modal-kgd-form', 'Kegiatan pendukung tersimpan.', function () {
            _kgdLoadKPI();
            _kgdLoadHistory();
          }, ok);
        });
      } else {
        _msg('kgd-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('kgd-form-msg', 'error', 'Koneksi terputus.');
    })
    .kegiatanDirektorat_submit(APP.token, {
      judul: judul,
      tanggal: tanggal,
      deskripsi: deskripsi,
      pihakHadir: pihak || ''
    });
}

// ── Revisi / Anulir ──
function _kgdFindRow(rowId) {
  for (var i = 0; i < _KGD.rows.length; i++) {
    if (String(_KGD.rows[i].RowID) === String(rowId)) return _KGD.rows[i];
  }
  return null;
}

function kgdOpenRevisiModal(rowId) {
  var r = _kgdFindRow(rowId);
  if (!r) return;
  _KGD.pendingRowId = rowId;

  document.getElementById('kgd-revisi-info').textContent =
    (r.JudulKegiatan || '—') + ' — ' + _kgdFmtDate(r.Tanggal);
  document.getElementById('rv-kgd-judul').value = r.JudulKegiatan || '';
  document.getElementById('rv-kgd-tanggal').value = _kgdDateInput(r.Tanggal);
  document.getElementById('rv-kgd-deskripsi').value = r.Deskripsi || '';
  document.getElementById('rv-kgd-pihak').value = r.PihakHadir || '';
  document.getElementById('rv-kgd-alasan').value = '';
  _attachInit('kgd-revisi', { refSheet: 'TX_KegiatanDirektorat' });
  _msg('kgd-revisi-msg', '', '');
  document.getElementById('modal-kgd-revisi').classList.remove('n-hidden');
}

function kgdRevisiConfirm() {
  _msg('kgd-revisi-msg', '', '');
  var alasan = _v('rv-kgd-alasan');
  if (!alasan || !alasan.trim()) { _msg('kgd-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }

  var judul = _v('rv-kgd-judul');
  var tanggal = _v('rv-kgd-tanggal');
  var deskripsi = _v('rv-kgd-deskripsi');
  var pihak = _v('rv-kgd-pihak');
  if (!judul || !judul.trim()) { _msg('kgd-revisi-msg', 'error', 'Judul kegiatan wajib diisi.'); return; }
  if (!tanggal) { _msg('kgd-revisi-msg', 'error', 'Tanggal kegiatan wajib diisi.'); return; }
  if (!deskripsi || !deskripsi.trim()) { _msg('kgd-revisi-msg', 'error', 'Deskripsi kegiatan wajib diisi.'); return; }

  var params = {
    targetRowId: _KGD.pendingRowId,
    alasanRevisi: alasan,
    judul: judul,
    tanggal: tanggal,
    deskripsi: deskripsi,
    pihakHadir: pihak || ''
  };

  var btn = document.getElementById('kgd-btn-revisi-save');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _attachCarry('TX_KegiatanDirektorat', params.targetRowId, res.data.rowId);
        _attachUploadAll('kgd-revisi', [res.data.rowId], function () {
          closeModal('modal-kgd-revisi');
          _msg('kgd-hist-msg', 'success', res.data.message);
          _kgdLoadKPI();
          _kgdLoadHistory();
        });
      } else {
        _msg('kgd-revisi-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('kgd-revisi-msg', 'error', 'Koneksi terputus.');
    })
    .kegiatanDirektorat_revisi(APP.token, params);
}

function kgdOpenAnulirModal(rowId) {
  var r = _kgdFindRow(rowId);
  if (!r) return;
  _KGD.pendingRowId = rowId;
  document.getElementById('kgd-anulir-info').textContent =
    (r.JudulKegiatan || '—') + ' — ' + _kgdFmtDate(r.Tanggal);
  document.getElementById('an-kgd-alasan').value = '';
  _msg('kgd-anulir-msg', '', '');
  document.getElementById('modal-kgd-anulir').classList.remove('n-hidden');
}

function kgdAnulirConfirm() {
  _msg('kgd-anulir-msg', '', '');
  var alasan = _v('an-kgd-alasan');
  if (!alasan || !alasan.trim()) { _msg('kgd-anulir-msg', 'error', 'Komentar anulir wajib diisi.'); return; }

  var btn = document.getElementById('kgd-btn-anulir-save');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('kgd-anulir-msg', 'success', res.message);
        setTimeout(function(){
          closeModal('modal-kgd-anulir');
          _kgdLoadKPI();
          _kgdLoadHistory();
        }, 900);
      } else {
        _msg('kgd-anulir-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('kgd-anulir-msg', 'error', 'Koneksi terputus.');
    })
    .kegiatanDirektorat_anulir(APP.token, { targetRowId: _KGD.pendingRowId, alasan: alasan });
}



/**
 * _uiAudit() — Runtime Layout & Geometry Probe (DESIGN.md §5.5.6 & ARCHITECTURE.md §17.2)
 * Memindai seluruh kontainer kontrol interaktif di DOM aktif.
 * Memverifikasi bahwa seluruh kontrol berdampingan memiliki getBoundingClientRect().height identik.
 */
function _uiAudit() {
  var rows = document.querySelectorAll('.ctl-row, .hist-actions, .filter-box, .n-seg, [class*="ctl-"]');
  var results = [];
  var totalChecked = 0;
  var violations = 0;

  rows.forEach(function (container) {
    if (container.offsetParent === null) return; // skip hidden
    var items = Array.from(container.children).filter(function (el) {
      var tag = el.tagName.toLowerCase();
      return (tag === 'button' || tag === 'select' || (tag === 'input' && el.type !== 'hidden') || el.classList.contains('n-seg') || el.classList.contains('btn'));
    });
    if (items.length < 2) return;
    totalChecked++;

    var heights = items.map(function (el) {
      return { el: el, h: Math.round(el.getBoundingClientRect().height * 10) / 10 };
    });
    var baseH = heights[0].h;
    var mismatched = heights.filter(function (it) {
      return Math.abs(it.h - baseH) > 1.5;
    });

    if (mismatched.length > 0) {
      violations++;
      results.push({
        container: container,
        expectedHeight: baseH,
        mismatched: mismatched
      });
      console.warn('[UI COHESION AUDIT VIOLATION]', container, heights);
    }
  });

  var summary = {
    pass: violations === 0,
    containersChecked: totalChecked,
    violations: violations,
    details: results
  };
  if (violations === 0) {
    console.info('[UI COHESION AUDIT PASS] Seluruh ' + totalChecked + ' kontainer kontrol berbaris memiliki tinggi identik.');
  } else {
    console.error('[UI COHESION AUDIT FAIL] Ditemukan ' + violations + ' kontainer dengan tinggi kontrol bertabrakan!');
  }
  return summary;
}
window._uiAudit = _uiAudit;
