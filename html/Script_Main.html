<script>
  /* ============================================================
     Script_Main.html
     State management, hash routing, sidebar, filter periode.
     Dipanggil via include di Index.html.
     ============================================================ */

  // ── KONSTANTA ─────────────────────────────────────────────
  var TOKEN_KEY = 'radarpoa_token';
  var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  var ROLE_LABEL = {
    SUPERADMIN: 'Super Administrator',
    DIREKTUR: 'Direktur',
    KADIV: 'Kepala Divisi / Ketua Tim Kerja',
    STAF: 'Staf'
  };

  // ── STATE ─────────────────────────────────────────────────
  var APP = {
    token: null,
    user: null,
    currentView: 'overview',
    prevView: 'overview',
    pendingQueueId: null,
    profilKapalId: '',
    filter: {
      mode: 'monthly',   // 'monthly' | 'range'
      month: new Date().getMonth() + 1,
      year: new Date().getFullYear(),
      dateFrom: '',
      dateTo: ''
    }
  };

  // State pendaftaran 2 tahap (verifikasi OTP). pendingTokenissued server
  // setelah kode OTP benar; auth_register mewajibkannya sebagai bukti.
  var REG = { otpEmail: null, pendingToken: null };

  // ── BUSY GLOBAL — indikator loading di samping filter periode ──
  // Setiap google.script.run otomatis memunculkan spinner selama call in-flight,
  // apa pun sheet/server function-nya. Strategi (stabil, tanpa bergantung this):
  //  - withSuccessHandler  : +1 saat setup call; -1 di dalam handler sukses.
  //  - withFailureHandler  : tidak menaikkan, hanya -1 di dalam handler gagal.
  // Karena GS hanya memanggil SATU handler (sukses ATAU gagal, tidak keduanya),
  // setiap rantai = tepat +1 dan tepat -1 → selalu balik ke 0.
  var _BUSY = 0;
  var _BUSY_LAST = 0;
  var _BUSY_WATCHDOG = null;
  function _busyPushActivity() { _BUSY_LAST = Date.now(); }
  function _busyInc() { _BUSY++; _busyPushActivity(); _syncBusy(); }
  function _busyDec() {
    if (_BUSY > 0) _BUSY--;
    _busyPushActivity();
    _syncBusy();
  }
  function _syncBusy() {
    var el = document.getElementById('filter-busy');
    if (el) el.style.display = (_BUSY > 0) ? 'flex' : 'none';
    if (_BUSY > 0 && !_BUSY_WATCHDOG) {
      // Jaring pengaman: force-reset jika counter nyangkut (mis. call tanpa
      // failure-handler lalu GAGAL, sehingga tak ada handler yang menurunkan).
      _BUSY_WATCHDOG = setInterval(function () {
        if (_BUSY > 0 && (Date.now() - _BUSY_LAST) > 20000) {
          _BUSY = 0;
          _syncBusy();
        }
      }, 1000);
    } else if (_BUSY === 0 && _BUSY_WATCHDOG) {
      clearInterval(_BUSY_WATCHDOG);
      _BUSY_WATCHDOG = null;
    }
  }
  var _SILENT_RPC = false;
  function _silentRun(fn) {
    _SILENT_RPC = true;
    try {
      fn();
    } finally {
      setTimeout(function () { _SILENT_RPC = false; }, 50);
    }
  }

  (function () {
    try {
      var g = window.google && google.script && google.script.run;
      if (!g) return;
      var oWsh = g.withSuccessHandler;
      var oWfh = g.withFailureHandler;
      if (g.__nBusyPatched) return;
      g.__nBusyPatched = true;
      g.withSuccessHandler = function (h) {
        if (_SILENT_RPC) {
          return oWsh.call(this, h);
        }
        _busyInc();
        return oWsh.call(this, function (res) {
          try { return h ? h(res) : res; }
          finally { _busyDec(); }
        });
      };
      g.withFailureHandler = function (h) {
        if (_SILENT_RPC) {
          return oWfh.call(this, h);
        }
        return oWfh.call(this, function (err) {
          try { return h ? h(err) : err; }
          finally { _busyDec(); }
        });
      };
    } catch (e) {
      // patch gagal → spinner tidak tampil, call tetap berjalan normal (tidak wajib)
    }
  })();

  // ── SYNC & HEARTBEAT STATE (Fase 15a/17) ─────────────────────
  var APP_SYNC = {
    lastTxVersion: null,   // string/angka versi transaksi data global dari server (DASH_TX_VERSION)
    lastTxMetadata: null,   // metadata transaksi terakhir { timestamp: ISOString, sheet: string } (Fase 17)
    satellites: null,   // status konektivitas 6 satelit terbaru dari AggregatorService
    inFlight: false,  // mutex guard agar RPC sinkronisasi tidak tumpang tindih
    deferredReload: false,  // true jika ada pembaruan data saat modal form/input sedang aktif
    lastSyncTime: 0,      // timestamp lokal sinkronisasi sukses terakhir
    syncInterval: 35000   // 35 detik interval heartbeat background (hemat kuota GAS)
  };

  function _fmtSyncTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var hh = (d.getHours() < 10 ? '0' : '') + d.getHours();
    var mm = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    var ss = (d.getSeconds() < 10 ? '0' : '') + d.getSeconds();
    return hh + ':' + mm + ':' + ss;
  }

  /**
   * Render Live Header Telemetry & Sync Status Terpadu (Fase 17 Refinement)
   * Menyajikan status sinkronisasi satu-pintu dengan ikon SVG dan hover popover.
   * Tidak ada teks ganda/clutter di header.
   */
  function _updateTelemetryTimestampUI() {
    var syncEl = document.getElementById('sync-indicator');
    if (!syncEl) return;
    var txt = syncEl.querySelector('.sync-indicator-text');
    var popStatus = document.getElementById('sync-pop-status');
    var popData = document.getElementById('sync-pop-data');

    var meta = APP_SYNC.lastTxMetadata;
    if (!meta || !meta.timestamp) {
      if (popData) popData.textContent = 'Data per: Memuat\u2026';
      return;
    }
    var d = new Date(meta.timestamp);
    if (isNaN(d.getTime())) {
      if (popData) popData.textContent = 'Data per: Belum tersedia';
      return;
    }
    var monthsShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    var day = d.getDate();
    var mName = monthsShort[d.getMonth()] || '';
    var y = d.getFullYear();
    var hh = (d.getHours() < 10 ? '0' : '') + d.getHours();
    var mm = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    var dateStr = day + ' ' + mName + ' ' + y + ' \u00B7 ' + hh + ':' + mm + ' WIB';

    var ageDays = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
    var isStale = ageDays > 7;

    if (popData) {
      popData.textContent = 'Data per: ' + dateStr + (meta.sheet ? ' (' + meta.sheet + ')' : '');
    }

    if (isStale) {
      syncEl.classList.add('is-stale');
      if (txt) txt.textContent = 'Data Usang';
      if (popStatus) popStatus.textContent = 'Data Perlu Pembaruan';
      syncEl.title = 'Data terakhir diperbarui ' + Math.floor(ageDays) + ' hari lalu — buka untuk menyinkronkan';
    } else {
      syncEl.classList.remove('is-stale');
      if (txt && !syncEl.classList.contains('is-syncing') && !syncEl.classList.contains('is-deferred')) {
        txt.textContent = 'Tersinkron';
      }
      if (popStatus) popStatus.textContent = 'Sistem Tersinkron';
      syncEl.title = 'Sistem Tersinkron \u00B7 Data per: ' + dateStr;
    }
  }

  function _syncUpdateIndicator(state, detailText) {
    var el = document.getElementById('sync-indicator');
    if (!el) return;
    var txt = el.querySelector('.sync-indicator-text');
    var popStatus = document.getElementById('sync-pop-status');

    el.classList.remove('is-syncing', 'is-deferred');

    if (state === 'syncing') {
      el.classList.add('is-syncing');
      if (txt) txt.textContent = 'Menyinkronkan\u2026';
      if (popStatus) popStatus.textContent = 'Memeriksa data ke server\u2026';
      el.title = 'Sedang memeriksa versi data ke server';
    } else if (state === 'deferred') {
      el.classList.add('is-deferred');
      if (txt) txt.textContent = 'Ada Pembaruan';
      if (popStatus) popStatus.textContent = 'Data Baru Tersedia di Server';
      el.title = 'Data baru tersedia di server (ditunda selama formulir aktif)';
    } else {
      _updateTelemetryTimestampUI();
    }
  }

  function _toggleSyncPopover(e) {
    if (e) e.stopPropagation();
    var pop = document.getElementById('sync-popover');
    var btn = document.getElementById('sync-indicator');
    if (!pop || !btn) return;
    _closeUserMenu();
    var willOpen = pop.classList.contains('n-hidden');
    if (willOpen) {
      pop.classList.remove('n-hidden');
      btn.setAttribute('aria-expanded', 'true');
      setTimeout(function () {
        document.addEventListener('click', _syncOutsideClickHandler);
        document.addEventListener('keydown', _syncKeyHandler);
      }, 0);
    } else {
      _closeSyncPopover();
    }
  }

  function _closeSyncPopover() {
    var pop = document.getElementById('sync-popover');
    var btn = document.getElementById('sync-indicator');
    if (pop) pop.classList.add('n-hidden');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', _syncOutsideClickHandler);
    document.removeEventListener('keydown', _syncKeyHandler);
  }

  function _syncOutsideClickHandler(e) {
    var wrap = document.getElementById('sync-wrap');
    if (wrap && !wrap.contains(e.target)) _closeSyncPopover();
  }

  function _syncKeyHandler(e) {
    if (e.key === 'Escape' || e.keyCode === 27) _closeSyncPopover();
  }

  function _setPageFinding(text) {
    var el = document.getElementById('page-finding');
    if (!el) return;
    if (text) {
      el.textContent = text;
      el.classList.remove('n-hidden');
    } else {
      el.textContent = '';
      el.classList.add('n-hidden');
    }
  }

  function _updateSyncSatellitesUI(satellites) {
    if (satellites) APP_SYNC.satellites = satellites;
    var host = document.getElementById('sync-pop-sats');
    if (!host) return;
    var sats = APP_SYNC.satellites;
    if (!sats) { host.innerHTML = ''; return; }
    var order = ['PUSAT', 'SIKAP', 'NAKHODA', 'SISTIK', 'SIAGA', 'OPERASI'];
    host.innerHTML = order.map(function (k) {
      var s = sats[k] || {};
      var on = !!s.connected;
      return '<div class="sync-pop-sat' + (on ? ' is-on' : '') + '">' +
        '<span class="sync-pop-sat-dot"></span>' +
        '<span>' + _esc(s.label || k) + '</span>' +
        '</div>';
    }).join('');
  }

  function _triggerManualSync(e) {
    if (e) e.stopPropagation();
    if (APP_SYNC.inFlight) return;
    var syncBtn = document.getElementById('btn-sync-now');
    if (syncBtn) syncBtn.disabled = true;
    var canForce = APP.user && ['SUPERADMIN', 'DIREKTUR', 'KADIV'].indexOf(APP.user.role) !== -1;
    if (!canForce) {
      _runSyncTick(true);
      if (syncBtn) syncBtn.disabled = false;
      _closeSyncPopover();
      return;
    }
    APP_SYNC.inFlight = true;
    _syncUpdateIndicator('syncing');
    google.script.run
      .withSuccessHandler(function (res) {
        APP_SYNC.inFlight = false;
        if (syncBtn) syncBtn.disabled = false;
        if (res && res.success) {
          var payload = res.data || {};
          APP_SYNC.lastSyncTime = Date.now();
          if (payload.satellites) _updateSyncSatellitesUI(payload.satellites);
          APP_SYNC.lastTxMetadata = {
            timestamp: (payload.meta && payload.meta.syncedAt) || new Date().toISOString(),
            sheet: 'Federasi Satelit'
          };
          _updateTelemetryTimestampUI();
          APP_OV.key = null;
          _executeCurrentViewReloader();
          _syncUpdateIndicator('synced');
          _closeSyncPopover();
          if (typeof toast !== 'undefined') toast.success('Data satelit berhasil disinkronkan');
        } else {
          _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
          if (typeof toast !== 'undefined') toast.error((res && res.error) || 'Gagal menyinkronkan data');
        }
      })
      .withFailureHandler(function (err) {
        APP_SYNC.inFlight = false;
        if (syncBtn) syncBtn.disabled = false;
        _failOrLogout(err);
        _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
        if (typeof toast !== 'undefined') toast.error((err && err.message) || 'Koneksi sinkronisasi gagal');
      })
      .radar_triggerSyncNow(APP.token, APP.filter);
  }

  /**
   * Form Modal Guard (Fase 15a):
   * Memeriksa apakah pengguna sedang mengisi formulir atau membuka modal data entry.
   * Jika aktif, silent reloader TIDAK BOLEH memuat ulang data tampilan agar input pengguna tidak terhapus/terinterupsi.
   */
  function _isFormActive() {
    // 1. Cek overlay modal terbuka (.n-overlay yang tidak memiliki class .n-hidden)
    var openOverlays = document.querySelectorAll('.n-overlay:not(.n-hidden)');
    for (var i = 0; i < openOverlays.length; i++) {
      var ov = openOverlays[i];
      if (ov.id === 'dr-mask') continue; // abaikan backdrop drawer mask jika drawer tertutup
      var hasInputs = ov.querySelector('input, textarea, select');
      if (hasInputs) return true;
    }

    // 2. Cek apakah ada elemen input di halaman utama yang sedang aktif (focus)
    var ae = document.activeElement;
    if (ae && ae !== document.body && ae !== document.documentElement) {
      var tag = ae.tagName ? ae.tagName.toUpperCase() : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
        // Kecualikan filter periode di header
        if (!ae.classList.contains('filter-sel') && !ae.classList.contains('filter-date')) {
          return true;
        }
      }
    }

    // 3. Cek apakah drawer persetujuan sedang terbuka dan ada input aktif
    var drawer = document.getElementById('approval-drawer');
    if (drawer && !drawer.classList.contains('n-hidden')) {
      var rejectArea = drawer.querySelector('textarea, input');
      if (rejectArea && rejectArea.value && rejectArea.value.trim().length > 0) {
        return true;
      }
    }

    return false;
  }

  /**
   * Pemeriksaan tertunda (Fase 15a):
   * Dipanggil sesaat setelah modal ditutup. Jika sebelumnya ada pembaruan data yang ditunda,
   * eksekusi pembaruan sekarang karena formulir sudah tertutup dengan aman.
   */
  function _syncCheckDeferred() {
    setTimeout(function () {
      if (!APP_SYNC.deferredReload) return;
      if (_isFormActive()) return; // masih ada formulir lain yang terbuka
      APP_SYNC.deferredReload = false;
      _syncUpdateIndicator('syncing');
      _executeCurrentViewReloader();
      setTimeout(function () { _syncUpdateIndicator('synced'); }, 400);
    }, 120);
  }

  // ── NAVIGASI: section + items (Floating Bottom Maritime Dock) ─
  // divisiId: null = semua role; string = DIV-* untuk Kadiv/Staf
  // minRoles: null = semua APPROVED; array = hanya role tsb
  var NAV_SECTIONS = [
    {
      label: 'Utama',
      group: 'main',
      items: [
        { id: 'overview', label: 'Ikhtisar', shortLabel: 'Ikhtisar', icon: 'layout', divisiId: null, minRoles: null },
        { id: 'kegiatan', label: 'Kegiatan Direktorat', shortLabel: 'Kegiatan', icon: 'calendar', divisiId: null, minRoles: ['SUPERADMIN', 'DIREKTUR', 'KADIV'] },
        { id: 'kapal-terbaik', label: 'Kapal Terbaik', shortLabel: 'Kapal', icon: 'award', divisiId: null, minRoles: null },
        { id: 'riwayat', label: 'Riwayat Laporan', shortLabel: 'Riwayat', icon: 'history', divisiId: null, minRoles: null }
      ]
    },
    {
      label: 'Sistem',
      group: 'system',
      items: [
        { id: 'notifikasi', label: 'Notifikasi', shortLabel: 'Notifikasi', icon: 'bell', divisiId: null, minRoles: null },
        { id: 'master-data', label: 'Master Data', shortLabel: 'Master', icon: 'database', divisiId: null, minRoles: ['SUPERADMIN', 'DIREKTUR'] },
        { id: 'kelola-akun', label: 'Admin Panel', shortLabel: 'Admin', icon: 'shield', divisiId: null, minRoles: ['SUPERADMIN', 'DIREKTUR'] }
      ]
    }
  ];

  function _dockIconSvg(name) {
    var c = 'width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    if (name === 'layout') return '<svg ' + c + '><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>';
    if (name === 'calendar') return '<svg ' + c + '><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
    if (name === 'award') return '<svg ' + c + '><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>';
    if (name === 'history') return '<svg ' + c + '><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>';
    if (name === 'bell') return '<svg ' + c + '><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>';
    if (name === 'database') return '<svg ' + c + '><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>';
    if (name === 'shield') return '<svg ' + c + '><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
    if (name === 'more') return '<svg ' + c + '><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>';
    return '';
  }

  // Apakah user bisa akses view ini?
  function _canAccess(item, user) {
    if (!user) return false;
    if (user.role === 'SUPERADMIN' || user.role === 'DIREKTUR') return true;
    if (item.minRoles && item.minRoles.indexOf(user.role) === -1) return false;
    if (item.divisiId && user.divisiId !== item.divisiId) return false;
    return true;
  }

  // Ambil item nav dari id
  function _navItem(id) {
    for (var s = 0; s < NAV_SECTIONS.length; s++) {
      var items = NAV_SECTIONS[s].items;
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === id) return items[i];
      }
    }
    return null;
  }

  // Judul halaman dari view ID
  function _viewTitle(id) {
    if (id === 'profil-kapal') return 'Profil Kapal';
    if (id === 'kapal-terbaik') return 'Kapal Terbaik';
    var item = _navItem(id);
    return item ? item.label : '—';
  }

  // ── INIT ──────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function () {
    // Dekorasi tombol berlabel dengan ikon (satu peta global `_ICO_LABEL`).
    // Jalan di awal untuk markup statis views/*.html, lalu MutationObserver
    // menutupi semua render dinamis setelahnya.
    try { _icoDecorate(); _icoWatch(); } catch (e) { /* dekorasi tidak boleh halt app */ }

    // Overlay click-to-close: klik di luar .n-modal menutup popup,
    // dengan konfirmasi jika ada field yang sudah diisi.
    try { _initOverlayClose(); } catch (e) { /* tidak boleh halt app */ }
    try { _initSheetGestures(); } catch (e) { /* gesture fallback */ }

    // Fallback safety: jika dalam 15 detik callback tidak pernah dipanggil
    // (GAS RPC error, sandbox restriction, dsb), paksa sembunyikan loading.
    var _loadingTimedOut = false;
    var _loadingTimer = setTimeout(function () {
      _loadingTimedOut = true;
      _hideLoading();
      _showAuthView('login');
    }, 15000);

    function _doneLoading() {
      if (_loadingTimedOut) return;
      clearTimeout(_loadingTimer);
      _hideLoading();
    }

    // Prefill divisi list (dipakai di form register) — fire-and-forget
    try {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success || !res.data) return;
          var sel = document.getElementById('reg-divisi');
          if (!sel) return;
          res.data.forEach(function (d) {
            var opt = document.createElement('option');
            opt.value = d.divisiId;
            opt.textContent = d.namaDashboard + ' \u2014 ' + d.namaResmi;
            sel.appendChild(opt);
          });
        })
        .withFailureHandler(function () { /* silent – tidak kritis */ })
        .auth_getDivisiList();
    } catch (e) { /* silent */ }

    // Cek sesi
    var savedToken = null;
    try { savedToken = sessionStorage.getItem(TOKEN_KEY); } catch (e) { /* sandbox restriction */ }

    if (savedToken) {
      try {
        google.script.run
          .withSuccessHandler(function (res) {
            _doneLoading();
            if (res && res.success && res.data) {
              APP.token = savedToken;
              APP.user = res.data;
              if (res.data.status === 'APPROVED') {
                _stopPendingStatusPolling();
                _initApp();
              } else {
                _renderPendingInfo(res.data);
                _showAuthView('pending');
                _startPendingStatusPolling(res.data);
              }
            } else {
              try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { }
              _showAuthView('login');
            }
          })
          .withFailureHandler(function () {
            _doneLoading();
            try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { }
            _showAuthView('login');
          })
          .auth_getSessionInfo(savedToken);
      } catch (e) {
        _doneLoading();
        _showAuthView('login');
      }
    } else {
      _doneLoading();
      // Cek apakah ada pendaftaran pending yang sedang dipantau di sesi ini
      var restoredPending = false;
      try {
        var rawPending = sessionStorage.getItem('RADARPOA_PENDING_REG');
        if (rawPending) {
          var pData = JSON.parse(rawPending);
          if (pData && (pData.email || pData.userId)) {
            _renderPendingInfo(pData);
            _showAuthView('pending');
            _startPendingStatusPolling(pData);
            restoredPending = true;
          }
        }
      } catch (e) { }
      if (!restoredPending) {
        _showAuthView('login');
      }
    }
  });

  // ── AUTH HELPERS ──────────────────────────────────────────
  function _hideLoading() {
    var el = document.getElementById('n-loading');
    if (el) { el.style.opacity = '0'; setTimeout(function () { el.style.display = 'none'; }, 250); }
  }

  function _showAuthView(name) {
    document.getElementById('auth-wrapper').classList.remove('n-hidden');
    document.getElementById('app-wrapper').classList.add('n-hidden');
    ['login', 'register', 'pending'].forEach(function (v) {
      document.getElementById('v-' + v).classList.add('n-hidden');
    });
    document.getElementById('v-' + name).classList.remove('n-hidden');
  }

  function showAuthView(name) { _showAuthView(name); } // public alias for inline onclick

  // State polling status pendaftaran (real-time tanpa refresh)
  var _pendingPollTimer = null;
  var _lastPendingPayload = null;
  var _pendingAutoRedirectTimer = null;

  function _clearPendingAutoRedirect() {
    if (_pendingAutoRedirectTimer) {
      clearInterval(_pendingAutoRedirectTimer);
      _pendingAutoRedirectTimer = null;
    }
  }

  function _clearPendingBanners() {
    _clearPendingAutoRedirect();
    var pHost = document.getElementById('pending-banner-host');
    if (pHost) pHost.innerHTML = '';
    var rHost = document.getElementById('register-banner-host');
    if (rHost) rHost.innerHTML = '';
  }

  function _startPendingStatusPolling(payload) {
    if (!payload || (!payload.email && !payload.userId)) return;
    _lastPendingPayload = payload;
    _stopPendingStatusPolling();

    function checkOnce() {
      if (!_lastPendingPayload) return;
      _silentRun(function () {
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res) {
              console.warn('[PendingPolling] Response kosong dari server.');
              return;
            }
            if (!res.success) {
              console.warn('[PendingPolling] Pemeriksaan status:', res.error);
              return;
            }
            if (!res.data) return;
            var st = String(res.data.status || '').trim().toUpperCase();
            if (st === 'APPROVED') {
              console.log('[PendingPolling] Akun telah disetujui (APPROVED). Memperbarui UI...');
              _stopPendingStatusPolling();
              _onRegistrationApproved(res.data);
            } else if (st === 'REJECTED') {
              console.log('[PendingPolling] Akun ditolak (REJECTED). Memperbarui UI...');
              _stopPendingStatusPolling();
              _onRegistrationRejected(res.data);
            }
          })
          .withFailureHandler(function (err) {
            console.error('[PendingPolling] Gagal menghubungi auth_checkRegistrationStatus:', err);
          })
          .auth_checkRegistrationStatus({
            email: _lastPendingPayload.email,
            userId: _lastPendingPayload.userId
          });
      });
    }

    // Cek segera + interval setiap 8 detik
    checkOnce();
    _pendingPollTimer = setInterval(checkOnce, 8000);
  }

  function _stopPendingStatusPolling() {
    if (_pendingPollTimer) {
      clearInterval(_pendingPollTimer);
      _pendingPollTimer = null;
    }
  }

  function _onRegistrationApproved(data) {
    var email = data.email || (_lastPendingPayload && _lastPendingPayload.email) || '';
    var nama = data.nama || (_lastPendingPayload && _lastPendingPayload.nama) || 'Pengguna';

    try { sessionStorage.removeItem('RADARPOA_PENDING_REG'); } catch (e) { }

    var titleEl = document.querySelector('#v-pending .auth-title');
    if (titleEl) titleEl.textContent = 'Pendaftaran Disetujui';

    var staticInfoEl = document.querySelector('#v-pending .n-info-static');
    if (staticInfoEl) staticInfoEl.style.display = 'none';

    var pInfoEl = document.getElementById('pending-info');
    if (pInfoEl) {
      var warnBadge = pInfoEl.querySelector('.badge-warn');
      if (warnBadge) {
        warnBadge.className = 'badge badge-success';
        warnBadge.textContent = 'Disetujui & Aktif';
      }
    }

    var bannerHtml =
      '<div class="n-banner-approved" role="alert">' +
      '<div class="n-banner-approved-head">' +
      '<span class="n-banner-approved-icon">&#10003;</span>' +
      '<span>Akun Anda Berhasil Disetujui</span>' +
      '</div>' +
      '<p class="n-banner-approved-text">' +
      'Pendaftaran akun atas nama <b>' + _esc(nama) + '</b> telah diterima dan disetujui oleh atasan/administrator. ' +
      'Akun Anda kini aktif. Silakan masuk untuk mengakses sistem Radar POA.' +
      '</p>' +
      '<div class="n-banner-approved-actions">' +
      '<button type="button" class="btn-primary" onclick="_pendingGoToLogin(\'' + _esc(email) + '\')">' +
      'Masuk ke Akun (Sign In)' +
      '</button>' +
      '</div>' +
      '</div>';

    var pHost = document.getElementById('pending-banner-host');
    if (pHost) pHost.innerHTML = bannerHtml;
    var rHost = document.getElementById('register-banner-host');
    if (rHost) rHost.innerHTML = bannerHtml;

    var timeLeft = 4;
    var liveEl = document.getElementById('pending-live-status');
    if (liveEl) {
      liveEl.innerHTML =
        '<span style="color:var(--n-status-success);font-weight:600;display:inline-flex;align-items:center;gap:6px;">' +
        '&#10003; Mengalihkan otomatis ke halaman masuk dalam <span id="pending-cd-sec">' + timeLeft + '</span> detik…' +
        '</span>';
    }

    _clearPendingAutoRedirect();
    _pendingAutoRedirectTimer = setInterval(function () {
      timeLeft--;
      var cdEl = document.getElementById('pending-cd-sec');
      if (cdEl) cdEl.textContent = String(timeLeft);
      if (timeLeft <= 0) {
        _clearPendingAutoRedirect();
        _pendingGoToLogin(email);
      }
    }, 1000);
  }

  function _onRegistrationRejected(data) {
    _clearPendingAutoRedirect();
    var email = data.email || (_lastPendingPayload && _lastPendingPayload.email) || '';
    var alasan = data.alasanReject || 'Pendaftaran tidak memenuhi kriteria verifikasi.';

    try { sessionStorage.removeItem('RADARPOA_PENDING_REG'); } catch (e) { }

    var titleEl = document.querySelector('#v-pending .auth-title');
    if (titleEl) titleEl.textContent = 'Pendaftaran Ditolak';

    var staticInfoEl = document.querySelector('#v-pending .n-info-static');
    if (staticInfoEl) staticInfoEl.style.display = 'none';

    var pInfoEl = document.getElementById('pending-info');
    if (pInfoEl) {
      var warnBadge = pInfoEl.querySelector('.badge-warn');
      if (warnBadge) {
        warnBadge.className = 'badge badge-danger';
        warnBadge.textContent = 'Ditolak';
      }
    }

    var bannerHtml =
      '<div class="n-banner-rejected" role="alert">' +
      '<div class="n-banner-rejected-head">' +
      '<span>Pendaftaran Belum Disetujui</span>' +
      '</div>' +
      '<p class="n-banner-rejected-text">' +
      'Permintaan pendaftaran akun ditolak. Alasan: <b>' + _esc(alasan) + '</b>. ' +
      'Anda dapat melakukan pendaftaran ulang dengan data yang benar.' +
      '</p>' +
      '<div class="n-banner-approved-actions">' +
      '<button type="button" class="btn-primary" onclick="_pendingGoToRegister(\'' + _esc(email) + '\')">' +
      'Daftar Ulang' +
      '</button>' +
      '</div>' +
      '</div>';

    var pHost = document.getElementById('pending-banner-host');
    if (pHost) pHost.innerHTML = bannerHtml;
    var rHost = document.getElementById('register-banner-host');
    if (rHost) rHost.innerHTML = bannerHtml;

    var liveEl = document.getElementById('pending-live-status');
    if (liveEl) {
      liveEl.innerHTML = '<span style="color:var(--n-status-critical);font-weight:600;">Status: Pendaftaran Ditolak</span>';
    }
  }

  function _pendingGoToLogin(email) {
    _clearPendingAutoRedirect();
    _stopPendingStatusPolling();
    _showAuthView('login');
    var emailInput = document.getElementById('login-email');
    if (emailInput && email) {
      emailInput.value = email;
    }
    var pwdInput = document.getElementById('login-password');
    if (pwdInput) {
      pwdInput.value = '';
      pwdInput.focus();
    }
    _msg('login-msg', 'success', 'Akun Anda telah aktif. Masukkan password Anda untuk masuk.');
  }

  function _pendingGoToRegister(email) {
    _clearPendingAutoRedirect();
    _stopPendingStatusPolling();
    _showAuthView('register');
    _regResetOtp();
    var emailInput = document.getElementById('reg-email');
    if (emailInput && email) {
      emailInput.value = email;
    }
    _clearPendingBanners();
  }

  function _pendingCancelOrNew() {
    _clearPendingAutoRedirect();
    _stopPendingStatusPolling();
    _lastPendingPayload = null;
    try { sessionStorage.removeItem('RADARPOA_PENDING_REG'); } catch (e) { }
    _clearPendingBanners();
    _showAuthView('register');
    _regResetOtp();
  }

  function _renderPendingInfo(user) {
    _clearPendingAutoRedirect();
    var titleEl = document.querySelector('#v-pending .auth-title');
    if (titleEl) titleEl.textContent = 'Menunggu Persetujuan';
    var staticInfoEl = document.querySelector('#v-pending .n-info-static');
    if (staticInfoEl) staticInfoEl.style.display = '';

    var el = document.getElementById('pending-info');
    if (!el) return;
    el.innerHTML =
      '<div class="info-row"><span class="lbl">Nama</span><span class="val">' + _esc(user.nama) + '</span></div>' +
      '<div class="info-row"><span class="lbl">Email</span><span class="val">' + _esc(user.email) + '</span></div>' +
      '<div class="info-row"><span class="lbl">Jabatan Dilamar</span><span class="val">' + _esc(ROLE_LABEL[user.role] || user.role) + '</span></div>' +
      '<div class="info-row"><span class="lbl">Status</span>' +
      '<span class="val"><span class="badge badge-warn">Menunggu Persetujuan</span></span>' +
      '</div>';
    var liveEl = document.getElementById('pending-live-status');
    if (liveEl) {
      liveEl.innerHTML = '<span class="pending-pulse-dot"></span><span>Memeriksa status persetujuan secara otomatis…</span>';
    }

  // ── AUTH HANDLERS ─────────────────────────────────────────
  function handleLogin(e) {
    e.preventDefault();
    var btn = document.getElementById('btn-login');
    _setLoading(btn, true);
    _msg('login-msg', null);
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res || !res.success) { _msg('login-msg', 'error', (res && res.error) || 'Terjadi kesalahan. Coba lagi.'); return; }
        APP.token = res.data.token;
        APP.user = res.data.user;
        sessionStorage.setItem(TOKEN_KEY, APP.token);
        if (res.data.user.status === 'APPROVED') {
          _stopPendingStatusPolling();
          _initApp();
        } else {
          _renderPendingInfo(res.data.user);
          _showAuthView('pending');
          _startPendingStatusPolling(res.data.user);
        }
      })
      .withFailureHandler(function () {
        _setLoading(btn, false);
        _msg('login-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
      })
      .auth_login({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      });
  }

  // Tahap 1: kirim kode OTP ke email. Akun BELUM dibuat di tahap ini.
  function handleRegister(e) {
    e.preventDefault();
    // Email sudah terbukti pada percobaan sebelumnya dan pendingToken-nya masih
    // hidup (server tidak mencabut token saat registrasi ditolak) — lewati tahap
    // OTP dan kirim ulang pendaftaran dengan token tersebut.
    var email = String(document.getElementById('reg-email').value || '').trim().toLowerCase();
    if (REG.pendingToken && REG.otpEmail === email) {
      _regSubmitRegister();
      return;
    }
    var btn = document.getElementById('btn-register');
    _setLoading(btn, true);
    _msg('register-msg', null);
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res || !res.success) {
          _msg('register-msg', 'error', (res && res.error) || 'Terjadi kesalahan. Coba lagi.');
          return;
        }
        _regShowOtpStep(res.data.email);
        _msg('register-msg', 'success',
          'Kode verifikasi dikirim ke ' + res.data.email + '. Periksa kotak masuk (dan spam).');
      })
      .withFailureHandler(function () {
        _setLoading(btn, false);
        _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
      })
      .auth_requestOtp(_regPayload(document.getElementById('reg-email').value));
  }

  // Kumpulkan seluruh field registrasi. Server memvalidasi SEMUA field sebelum
  // mengirim kode OTP — jadi kalau ada yang tidak valid, user tidak perlu
  // menunggu email hanya untuk ditolak di akhir.
  function _regPayload(email) {
    return {
      nama: document.getElementById('reg-nama').value,
      email: email,
      nip: document.getElementById('reg-nip').value,
      password: document.getElementById('reg-password').value,
      divisiId: document.getElementById('reg-divisi').value,
      roleDilamar: document.getElementById('reg-role').value
    };
  }

  function _regShowOtpStep(email) {
    var step = document.getElementById('reg-otp-step');
    var form = document.getElementById('form-register');
    var hint = document.getElementById('reg-otp-hint');
    if (step) step.classList.remove('n-hidden');
    if (form) form.classList.add('n-hidden');
    if (hint) hint.textContent = 'Kode dikirim ke ' + email;
    var code = document.getElementById('reg-otp');
    if (code) { code.value = ''; code.focus(); }
    REG.otpEmail = email;
    REG.pendingToken = null;
  }

  // Kembali ke tahap 1.
  //
  // keepVerified = true dipakai setelah auth_register ditolak di tahap akhir
  // (mis. NIP sudah dipakai). Server TIDAK membatalkan pendingToken saat
  // registrasi gagal, jadi user cukup memperbaiki fieldnya lalu menekan
  // "Verifikasi" lagi dengan kode yang sama — tanpa perlu email baru.
  function _regResetOtp(keepVerified) {
    if (!keepVerified) {
      REG.otpEmail = null;
      REG.pendingToken = null;
    }
    var step = document.getElementById('reg-otp-step');
    var form = document.getElementById('form-register');
    if (step) step.classList.add('n-hidden');
    if (form) form.classList.remove('n-hidden');
    var code = document.getElementById('reg-otp');
    if (code) code.value = '';
    if (!keepVerified) _msg('register-msg', null);
    var btn = document.getElementById('btn-register');
    if (btn) btn.disabled = false;
  }

  function _regResendOtp() {
    if (!REG.otpEmail) { _regResetOtp(); return; }
    var btn = document.getElementById('btn-otp-resend');
    _setLoading(btn, true);
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res || !res.success) {
          _msg('register-msg', 'error', (res && res.error) || 'Gagal mengirim ulang kode.');
          return;
        }
        _msg('register-msg', 'success', 'Kode baru dikirim ke ' + res.data.email + '.');
        var code = document.getElementById('reg-otp');
        if (code) code.value = '';
      })
      .withFailureHandler(function () {
        _setLoading(btn, false);
        _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
      })
      .auth_requestOtp(_regPayload(REG.otpEmail));
  }

  // Tahap 2: cek kode → dapat pendingToken.
  function _regVerifyOtp() {
    var code = String(document.getElementById('reg-otp').value || '').trim();
    if (!/^[0-9]{6}$/.test(code)) {
      _msg('register-msg', 'error', 'Masukkan 6 digit kode verifikasi.');
      return;
    }
    var btn = document.getElementById('btn-otp-verify');
    _setLoading(btn, true);
    _msg('register-msg', null);
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res || !res.success) {
          _msg('register-msg', 'error', (res && res.error) || 'Kode verifikasi gagal.');
          return;
        }
        REG.pendingToken = res.data.pendingToken;
        _regSubmitRegister();
      })
      .withFailureHandler(function () {
        _setLoading(btn, false);
        _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
      })
      .auth_verifyOtp({ email: REG.otpEmail, code: code });
  }

  // Tahap 3: kirim pendaftaran dengan bukti OTP.
  function _regSubmitRegister() {
    // Tombol yang sedang terlihat: "Verifikasi" saat masih di step OTP, atau
    // "Daftar" saat user kembali ke form untuk memperbaiki data yang ditolak.
    var step = document.getElementById('reg-otp-step');
    var inOtp = step && !step.classList.contains('n-hidden');
    var btn = document.getElementById(inOtp ? 'btn-otp-verify' : 'btn-register');
    _setLoading(btn, true);

    var payload = {
      nama: document.getElementById('reg-nama').value,
      email: document.getElementById('reg-email').value,
      nip: document.getElementById('reg-nip').value,
      password: document.getElementById('reg-password').value,
      divisiId: document.getElementById('reg-divisi').value,
      roleDilamar: document.getElementById('reg-role').value,
      pendingToken: REG.pendingToken
    };

    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res || !res.success) {
          var err = (res && res.error) || 'Terjadi kesalahan. Coba lagi.';
          // Email masih terverifikasi — server menyimpan pendingToken (15 menit).
          // Kembalikan ke form supaya user bisa memperbaiki field yang bermasalah
          // tanpa menunggu email baru.
          var keep = /tidak cocok dengan email/i.test(err);
          _regResetOtp(keep);
          _msg('register-msg', 'error', err + (keep
            ? ''
            : ' Perbaiki data Anda lalu masukkan kode yang sama untuk melanjutkan.'));
          return;
        }
        var registeredUser = {
          userId: (res.data && res.data.userId) || '',
          nama: (res.data && res.data.nama) || payload.nama,
          email: (res.data && res.data.email) || payload.email,
          nip: payload.nip,
          role: (res.data && res.data.role) || payload.roleDilamar,
          divisiId: (res.data && res.data.divisiId) || payload.divisiId
        };
        try {
          sessionStorage.setItem('RADARPOA_PENDING_REG', JSON.stringify(registeredUser));
        } catch (e) { }

        document.getElementById('form-register').reset();
        _regResetOtp();
        _clearPendingBanners();
        _renderPendingInfo(registeredUser);
        _showAuthView('pending');
        _startPendingStatusPolling(registeredUser);
      })
      .withFailureHandler(function () {
        _setLoading(btn, false);
        _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
      })
      .auth_register(payload);
  }

  function handleLogout() {
    if (_appHeartbeatTimer) {
      clearInterval(_appHeartbeatTimer);
      _appHeartbeatTimer = null;
    }
    _stopPendingStatusPolling();
    if (APP.token) google.script.run.auth_logout(APP.token);
    APP.token = null;
    APP.user = null;
    sessionStorage.removeItem(TOKEN_KEY);
    _showAuthView('login');
  }

  /**
   * Error handler bersama: kalau server menyatakan sesi tidak valid lagi
   * (logout paksa, akun dinonaktifkan/diubah Superadmin, TTL habis), paksa
   * keluar ke layar login dengan pesan yang bisa dimengerti user.
   * Dipakai oleh semua pemanggilan google.script.run di halaman Notifikasi,
   * shell status, dan Admin Panel.
   */
  function _failOrLogout(err) {
    var msg = (err && err.message) ? err.message : String(err || '');
    if (/^UNAUTHORIZED/.test(msg)) {
      handleLogout();
      _msg('login-msg', 'error',
        'Sesi Anda berakhir atau akun diperbarui oleh Superadmin. Silakan login kembali.');
      return;
    }
    return msg || 'Gagal menghubungi server.';
  }

  /**
   * Jaring pengaman loader (Fase 13). Dua kegagalan yang tadinya muncul sebagai
   * "loading selamanya" tanpa pesan apa pun:
   *   1. Exception di dalam withSuccessHandler — google.script.run TIDAK
   *      meneruskannya ke withFailureHandler, jadi spinner tetap menggantung.
   *   2. Server tidak pernah menjawab (script belum di-push, versi deployed
   *      masih lama, atau hang) — tidak ada callback sama sekali.
   * _asyncArm menyalakan pengatur waktu; kalau loader selesai (sukses maupun
   * gagal) memanggil _asyncDisarm, jadi tidak ada perubahan perilaku normal.
   */
  var _asyncTimeoutMs = 20000;
  var _asyncTimers = {};

  // UI kegagalan bersama: pesan + tombol coba lagi. Dipakai oleh timeout,
  // respons kosong, dan handler lain supaya konsisten.
  //
  // "Coba lagi" dibuat ICON-ONLY (ikon refresh + `title`/`aria-label`): tombol
  // ini selalu muncul di dalam pesan error yang teksnya sudah menjelaskan
  // kegagalannya, jadi mengulang kata "Coba lagi" hanya memakan ruang tanpa
  // menambah informasi.
  function _asyncFailUi(wrap, msg, retryCall) {
    if (!wrap || !wrap.isConnected) return;
    wrap.innerHTML = '<div class="n-msg error">' + _esc(msg) + '</div>' +
      (retryCall ? '<div style="margin-top:8px"><button type="button" class="n-iconbtn-x" ' +
        'data-ico="refresh" title="Coba lagi" aria-label="Coba lagi" onclick="' +
        retryCall + '"></button></div>' : '');
  }

  function _asyncArm(key, wrap, retryCall) {
    _asyncDisarm(key);
    _asyncTimers[key] = setTimeout(function () {
      delete _asyncTimers[key];
      _asyncFailUi(wrap, 'Server tidak menjawab dalam ' +
        Math.round(_asyncTimeoutMs / 1000) + ' detik. Kemungkinan perubahan belum di-deploy, ' +
        'atau server sedang mengalami error.', retryCall);
    }, _asyncTimeoutMs);
  }

  function _asyncDisarm(key) {
    if (_asyncTimers[key]) { clearTimeout(_asyncTimers[key]); delete _asyncTimers[key]; }
  }

  /**
   * Normalisasi respons google.script.run.
   *
   * GAS memanggil success handler dengan `null` (bukan failure handler) bila
   * fungsi server selesai tanpa nilai balik, atau nilai balik tidak bisa
   * diserialisasi. Accessor `res.success` pada null melempar TypeError di dalam
   * callback, sehingga spinner menggantung dan tidak ada jejak errornya.
   *
   * @param {*} res respons dari success handler
   * @return {string|null} pesan error, atau null bila res sah
   */
  function _asyncResErr(res) {
    if (!res) {
      return 'Server mengembalikan respons kosong. Fungsi server mungkin belum ' +
        'di-deploy (jalankan clasp push) atau melempar exception sebelum return.';
    }
    if (res.success) return null;
    return res.error || 'Permintaan ditolak server.';
  }

  // null-safe counterpart of _asyncRenderFail: untuk respons kosong/bermasalah.
  function _asyncResFail(key, wrap, res, retryCall) {
    _asyncDisarm(key);
    if (window.console && console.error) {
      console.error('[radar-poa] respons tidak valid: ' + key, res);
    }
    _asyncFailUi(wrap, _asyncResErr(res), retryCall);
  }

  // Dipanggil dari catch di dalam success handler: tampilkan error, jangan spinner.
  function _asyncRenderFail(key, wrap, e) {
    _asyncDisarm(key);
    if (window.console && console.error) console.error('[radar-poa] render gagal: ' + key, e);
    if (!wrap || !wrap.isConnected) return;
    wrap.innerHTML = '<div class="n-msg error">Gagal menampilkan data: ' +
      _esc(e && e.message ? e.message : String(e)) + '</div>';
  }

  // ── APP INIT ──────────────────────────────────────────────
  function _initApp() {
    document.getElementById('auth-wrapper').classList.add('n-hidden');
    document.getElementById('app-wrapper').classList.remove('n-hidden');
    _renderDock();
    var hash = (window.location.hash || '').replace('#', '') || 'overview';
    _routeTo(hash);
    _applyShellStatus(); // badge notifikasi + strip "divisi belum melapor" (Fase 13)
    _startAppHeartbeat();
    _runSyncTick(true); // inisialisasi versi live-sync server (Fase 15a)
    window.addEventListener('hashchange', function () {
      _routeTo((window.location.hash || '').replace('#', ''));
    });
  }

  // ── FLOATING BOTTOM MARITIME DOCK & TOPBAR ACCOUNT ────────
  function _renderSidebar() {
    _renderDock();
  }

  function _userInitials(nama) {
    var clean = String(nama || '').replace(/\b(Ir|Dr|Capt|Prof|H|Hj|Drs|Dra)\.\s*/gi, '').replace(/,.*$/, '').trim();
    if (!clean) return '';
    var parts = clean.split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function _renderDock() {
    var user = APP.user || {};
    var nameEl = document.getElementById('sb-user-name');
    if (nameEl) nameEl.textContent = user.nama || 'Pengguna';
    var avatarEl = document.getElementById('sb-avatar');
    if (avatarEl) {
      var ini = _userInitials(user.nama);
      if (ini) {
        avatarEl.textContent = ini;
        avatarEl.classList.add('has-initials');
      }
    }
    var roleEl = document.getElementById('sb-user-role');
    if (roleEl) roleEl.textContent = ROLE_LABEL[user.role] || user.role || '\u2014';

    var menuName = document.getElementById('sb-menu-name');
    if (menuName) menuName.textContent = user.nama || 'Pengguna';
    var menuEmail = document.getElementById('sb-menu-email');
    if (menuEmail) menuEmail.textContent = user.email || '\u2014';
    var menuRole = document.getElementById('sb-menu-role');
    if (menuRole) menuRole.textContent = ROLE_LABEL[user.role] || user.role || 'Pengguna';

    var adminItem = document.getElementById('sb-menu-admin-item');
    if (adminItem) {
      if (user.role === 'SUPERADMIN' || user.role === 'DIREKTUR') {
        adminItem.classList.remove('n-hidden');
      } else {
        adminItem.classList.add('n-hidden');
      }
    }

    var mainItems = [];
    var sysItems = [];
    NAV_SECTIONS.forEach(function (section) {
      var visible = section.items.filter(function (it) { return _canAccess(it, user); });
      if (section.group === 'system') sysItems = sysItems.concat(visible);
      else mainItems = mainItems.concat(visible);
    });

    var sysNavItems = sysItems.filter(function (it) { return it.id !== 'notifikasi'; });
    var _deskLabel = function (it) {
      if (it.id === 'kegiatan') return 'Kegiatan';
      if (it.id === 'riwayat') return 'Riwayat';
      if (it.id === 'kelola-akun') return 'Admin';
      return it.label;
    };

    var navListEl = document.getElementById('app-nav-list');
    if (navListEl) {
      var navHtml = mainItems.map(function (it) {
        return '<button type="button" class="topnav-item" id="nav-' + it.id + '" data-nav="' + it.id + '" data-no-ico onclick="_routeTo(\'' + it.id + '\')" title="' + _esc(it.label) + '" aria-label="' + _esc(it.label) + '">' +
          _dockIconSvg(it.icon) +
          '<span class="topnav-label">' + _esc(_deskLabel(it)) + '</span>' +
          '</button>';
      }).join('');
      if (sysNavItems.length > 0) {
        navHtml += '<span class="topnav-sep" aria-hidden="true"></span>';
        navHtml += sysNavItems.map(function (it) {
          return '<button type="button" class="topnav-item" id="nav-' + it.id + '" data-nav="' + it.id + '" data-no-ico onclick="_routeTo(\'' + it.id + '\')" title="' + _esc(it.label) + '" aria-label="' + _esc(it.label) + '">' +
            _dockIconSvg(it.icon) +
            '<span class="topnav-label">' + _esc(_deskLabel(it)) + '</span>' +
            '</button>';
        }).join('');
      }
      navListEl.innerHTML = navHtml;
    }

    var dockEl = document.getElementById('app-dock');
    if (dockEl) {
      var html = mainItems.map(function (it) {
        return '<button type="button" class="dock-item" id="mnav-' + it.id + '" data-nav="' + it.id + '" data-no-ico onclick="_routeTo(\'' + it.id + '\')" title="' + _esc(it.label) + '" aria-label="' + _esc(it.label) + '">' +
          _dockIconSvg(it.icon) +
          '<span class="dock-label">' + _esc(it.shortLabel || it.label) + '</span>' +
          '</button>';
      }).join('');

      html += '<button type="button" class="dock-item dock-more-btn" id="dock-more-btn" data-no-ico onclick="_toggleDockMore(event)" aria-expanded="false" aria-controls="dock-more-sheet" title="Menu Lainnya">' +
        _dockIconSvg('more') +
        '<span class="dock-label">Lainnya</span>' +
        '</button>';
      dockEl.innerHTML = html;
    }

    var sheetList = document.getElementById('dock-more-list');
    if (sheetList) {
      var sHtml = sysNavItems.map(function (it) {
        return '<button type="button" class="dock-more-item" id="sheet-nav-' + it.id + '" data-nav="' + it.id + '" data-no-ico onclick="_closeDockMore(); _routeTo(\'' + it.id + '\')">' +
          _dockIconSvg(it.icon) +
          '<span class="dock-more-text">' + _esc(it.label) + '</span>' +
          '</button>';
      }).join('');
      if (sysNavItems.length > 0) {
        sHtml += '<div class="dock-more-divider"></div>';
      }
      sHtml += '<button type="button" class="dock-more-item danger" data-no-ico onclick="_closeDockMore(); handleLogout()">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>' +
        '</svg>' +
        '<span class="dock-more-text">Keluar</span>' +
        '</button>';
      sheetList.innerHTML = sHtml;
    }

    if (!window.__dockPillBound) {
      window.__dockPillBound = true;
      var _dockRaf = 0;
      window.addEventListener('resize', function () {
        if (_dockRaf) cancelAnimationFrame(_dockRaf);
        _dockRaf = requestAnimationFrame(function () { _syncDockPill(true); });
      });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { _syncDockPill(true); });
      }
    }

    if (APP.currentView) _updateActiveNav(APP.currentView, true);
  }

  function _toggleDockMore(e) {
    if (e) e.stopPropagation();
    var sheet = document.getElementById('dock-more-sheet');
    var mask = document.getElementById('dock-more-mask');
    var btn = document.getElementById('dock-more-btn');
    if (!sheet || !mask) return;
    var willOpen = sheet.classList.contains('n-hidden');
    if (willOpen) {
      _closeUserMenu();
      _closeSyncPopover();
      mask.classList.remove('n-hidden');
      sheet.classList.remove('n-hidden');
      if (btn) btn.setAttribute('aria-expanded', 'true');
      document.addEventListener('keydown', _dockMoreKeyHandler);
    } else {
      _closeDockMore();
    }
  }

  function _closeDockMore() {
    var sheet = document.getElementById('dock-more-sheet');
    var mask = document.getElementById('dock-more-mask');
    var btn = document.getElementById('dock-more-btn');
    if (sheet) sheet.classList.add('n-hidden');
    if (mask) mask.classList.add('n-hidden');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', _dockMoreKeyHandler);
  }

  function _dockMoreKeyHandler(e) {
    if (e.key === 'Escape' || e.keyCode === 27) _closeDockMore();
  }

  function _toggleMobileNav() { _toggleDockMore(); }
  function _closeMobileNav() { _closeDockMore(); }

  // ── USER ACCOUNT MENU (Topbar Dropdown) ───────────────────
  function _toggleUserMenu(e) {
    if (e) e.stopPropagation();
    var menu = document.getElementById('sb-user-menu');
    var btn = document.getElementById('topbar-user-btn');
    if (!menu || !btn) return;

    var isOpen = !menu.classList.contains('n-hidden');
    if (isOpen) {
      _closeUserMenu();
    } else {
      _closeSyncPopover();
      _closeDockMore();
      menu.classList.remove('n-hidden');
      btn.classList.add('is-active');
      btn.setAttribute('aria-expanded', 'true');
      setTimeout(function () {
        document.addEventListener('click', _userMenuOutsideClickHandler);
        document.addEventListener('keydown', _userMenuKeyHandler);
      }, 0);
    }
  }

  function _closeUserMenu() {
    var menu = document.getElementById('sb-user-menu');
    var btn = document.getElementById('topbar-user-btn');
    if (menu) menu.classList.add('n-hidden');
    if (btn) {
      btn.classList.remove('is-active');
      btn.setAttribute('aria-expanded', 'false');
    }
    document.removeEventListener('click', _userMenuOutsideClickHandler);
    document.removeEventListener('keydown', _userMenuKeyHandler);
  }

  function _userMenuOutsideClickHandler(e) {
    var wrap = document.getElementById('topbar-user-wrap');
    if (wrap && !wrap.contains(e.target)) {
      _closeUserMenu();
    }
  }

  function _userMenuKeyHandler(e) {
    if (e.key === 'Escape' || e.keyCode === 27) {
      _closeUserMenu();
    }
  }

  function _handleMenuNav(viewId) {
    _closeUserMenu();
    _routeTo(viewId);
  }

  function _updateActiveNav(viewId, immediate) {
    document.querySelectorAll('.topnav-item, .dock-item, .dock-more-item, #topbar-notif-btn').forEach(function (el) {
      el.classList.remove('active');
      el.removeAttribute('aria-current');
    });
    document.querySelectorAll('[data-nav="' + viewId + '"]').forEach(function (el) {
      el.classList.add('active');
      el.setAttribute('aria-current', 'page');
    });
    var sheetActive = document.getElementById('sheet-nav-' + viewId);
    if (sheetActive) {
      var moreBtn = document.getElementById('dock-more-btn');
      if (moreBtn) moreBtn.classList.add('active');
    }
    if (viewId === 'notifikasi') {
      var bellBtn = document.getElementById('topbar-notif-btn');
      if (bellBtn) {
        bellBtn.classList.add('active');
        bellBtn.setAttribute('aria-current', 'page');
      }
    }
    _syncDockPill(!!immediate);
  }

  function _syncDockPill(immediate) {
    var navInner = document.getElementById('app-nav-inner');
    var bar = document.getElementById('topnav-indicator');
    if (!navInner || !bar) return;

    var target = navInner.querySelector('.topnav-item.active');
    if (!target || target.offsetWidth === 0 || target.offsetHeight === 0) {
      bar.style.opacity = '0';
      navInner.classList.remove('has-pill');
      return;
    }

    var applyPos = function () {
      bar.style.width = target.offsetWidth + 'px';
      bar.style.transform = 'translate3d(' + target.offsetLeft + 'px, 0, 0)';
      bar.style.opacity = '1';
      navInner.classList.add('has-pill');
    };

    if (immediate || !navInner.classList.contains('has-pill')) {
      navInner.classList.remove('pill-animated');
      applyPos();
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          navInner.classList.add('pill-animated');
        });
      });
    } else {
      navInner.classList.add('pill-animated');
      applyPos();
    }
  }

  function _triggerViewFade(prevView, nextView) {
    if (!prevView || prevView === nextView) return;
    window.scrollTo(0, 0);
    var pc = document.getElementById('page-content');
    if (pc) {
      pc.classList.remove('view-entering');
      void pc.offsetWidth;
      pc.classList.add('view-entering');
    }
  }

  function _updateMobileRouteLabel(viewId) {
    var el = document.getElementById('mobile-route-label');
    if (el) el.textContent = _viewTitle(viewId);
  }

  // ── ROUTING ───────────────────────────────────────────────
  function _routeTo(viewId) {
    // Rute khusus — bukan tab dock utama (dibuka dari Master Data / kartu Ikhtisar)
    if (viewId === 'profil-kapal') { _routeProfil(); return; }
    if (viewId === 'kapal-terbaik') { _routeKapalTerbaik(); return; }

    var item = _navItem(viewId);
    // Jika view tidak ada atau tidak bisa diakses → ke overview
    if (!item || !_canAccess(item, APP.user)) {
      viewId = 'overview';
    }
    var prevView = APP.currentView;
    APP.currentView = viewId;
    if (window.location.hash !== '#' + viewId) {
      window.location.hash = viewId;
    }
    _closeDockMore();
    _closeUserMenu();
    _closeSyncPopover();
    _updateMobileRouteLabel(viewId);
    _updateActiveNav(viewId);
    if (prevView && prevView !== viewId) window.scrollTo(0, 0);
    _renderPageHeader(viewId);
    _renderViewContent(viewId);
    _triggerViewFade(prevView, viewId);
    _applyShellStatus();
  }

  function _routeProfil() {
    var prevView = APP.currentView;
    APP.currentView = 'profil-kapal';
    if (window.location.hash !== '#profil-kapal') {
      window.location.hash = 'profil-kapal';
    }
    _closeDockMore();
    _closeUserMenu();
    _closeSyncPopover();
    _updateMobileRouteLabel('profil-kapal');
    _updateActiveNav('profil-kapal');
    if (prevView && prevView !== 'profil-kapal') window.scrollTo(0, 0);
    _renderPageHeader('profil-kapal');
    _renderViewContent('profil-kapal');
    _triggerViewFade(prevView, 'profil-kapal');
  }

  function _openProfilKapal(kapalId) {
    if (APP.currentView && APP.currentView !== 'profil-kapal') {
      APP.prevView = APP.currentView;
    }
    APP.profilKapalId = String(kapalId || '').trim();
    _routeProfil();
  }

  function _routeKapalTerbaik() {
    var prevView = APP.currentView;
    APP.currentView = 'kapal-terbaik';
    if (window.location.hash !== '#kapal-terbaik') {
      window.location.hash = 'kapal-terbaik';
    }
    _closeDockMore();
    _closeUserMenu();
    _closeSyncPopover();
    _updateMobileRouteLabel('kapal-terbaik');
    _updateActiveNav('kapal-terbaik');
    if (prevView && prevView !== 'kapal-terbaik') window.scrollTo(0, 0);
    _renderPageHeader('kapal-terbaik');
    _renderViewContent('kapal-terbaik');
    _triggerViewFade(prevView, 'kapal-terbaik');
    _applyShellStatus();
  }

    _setPageFinding('');

      var backView = APP.prevView && APP.prevView !== 'profil-kapal' ? APP.prevView : 'overview';

    var noFilter = (viewId === 'master-data' || viewId === 'kelola-akun' ||
      viewId === 'notifikasi' || viewId === 'kapal-terbaik');
    var filterHtml = noFilter ? '' : _buildFilterHtml();

        ? '<div class="filter-periode">' +

        : '<span id="filter-busy" class="filter-busy" title="Memuat data&hellip;"></span>') +
      '</div>';

    _updateTelemetryTimestampUI();

  // ── FILTER PERIODE ────────────────────────────────────────
  function _buildFilterHtml() {
    var f = APP.filter;
    var now = new Date();
    var year = now.getFullYear();

    // Year options: 3 tahun ke belakang s.d. tahun ini
    var yearOpts = '';
    for (var y = year; y >= year - 3; y--) {
      yearOpts += '<option value="' + y + '"' + (f.year === y ? ' selected' : '') + '>' + y + '</option>';
    }

    // Month options
    var monthOpts = MONTHS.map(function (m, i) {
      var val = i + 1;
      return '<option value="' + val + '"' + (f.month === val ? ' selected' : '') + '>' + m + '</option>';
    }).join('');

    var mode =
      '<div class="filter-mode">' +
      '<button type="button" class="filter-mode-btn' + (f.mode === 'monthly' ? ' active' : '') + '" onclick="_setFilterMode(\'monthly\')">Bulanan</button>' +
      '<button type="button" class="filter-mode-btn' + (f.mode === 'range' ? ' active' : '') + '" onclick="_setFilterMode(\'range\')">Rentang</button>' +
      '</div>';

    var monthlyInputs =
      '<div class="filter-inputs" id="filter-monthly" ' + (f.mode !== 'monthly' ? 'style="display:none"' : '') + '>' +
      '<select class="filter-sel" onchange="_setFilterMonth(this.value)">' + monthOpts + '</select>' +
      '<select class="filter-sel" onchange="_setFilterYear(this.value)">' + yearOpts + '</select>' +
      '</div>';

    var rangeInputs =
      '<div class="filter-inputs" id="filter-range" ' + (f.mode !== 'range' ? 'style="display:none"' : '') + '>' +
      '<input type="date" class="filter-date date-picker-locked" value="' + (f.dateFrom || '') + '" onkeydown="return false" onpaste="return false" ondrop="return false" onclick="_openDatePicker(this)" onfocus="_openDatePicker(this)" onchange="_setFilterFrom(this.value)">' +
      '<span class="filter-sep">s.d.</span>' +
      '<input type="date" class="filter-date date-picker-locked" value="' + (f.dateTo || '') + '" onkeydown="return false" onpaste="return false" ondrop="return false" onclick="_openDatePicker(this)" onfocus="_openDatePicker(this)" onchange="_setFilterTo(this.value)">' +
      '</div>';

    return mode + '<div class="filter-mode-sep"></div>' + monthlyInputs + rangeInputs;
  }

  function _setFilterMode(mode) {
    APP.filter.mode = mode;
    var ml = document.getElementById('filter-monthly');
    var rl = document.getElementById('filter-range');
    if (ml) ml.style.display = (mode === 'monthly') ? '' : 'none';
    if (rl) rl.style.display = (mode === 'range') ? '' : 'none';
    document.querySelectorAll('.filter-mode-btn').forEach(function (btn, i) {
      btn.classList.toggle('active', (i === 0 && mode === 'monthly') || (i === 1 && mode === 'range'));
    });
    _reloadOnFilterChange();
  }
  function _setFilterMonth(v) { APP.filter.month = parseInt(v, 10); _reloadOnFilterChange(); }
  function _setFilterYear(v) { APP.filter.year = parseInt(v, 10); _reloadOnFilterChange(); }
  function _setFilterFrom(v) { APP.filter.dateFrom = v; _reloadOnFilterChange(); }
  function _setFilterTo(v) { APP.filter.dateTo = v; _reloadOnFilterChange(); }

  // Reload otomatis seluruh isi halaman saat filter global berubah (keputusan
  // user Fase 12). Header/filter input TIDAK dibangun ulang — hanya konten.
  function _reloadOnFilterChange() {
    if (APP.currentView && APP.currentView !== 'master-data') {
      _renderViewContent(APP.currentView);
    }
  }

  // ── VIEW TEMPLATE CACHE (hindari duplikat ID dari #view-templates) ──
  var _VIEW_TPL_CACHE = {};
  function _tplHtml(tplId) {
    if (_VIEW_TPL_CACHE[tplId] !== undefined) return _VIEW_TPL_CACHE[tplId];
    var tpl = document.getElementById(tplId);
    if (!tpl) return null;
    var html = tpl.innerHTML;
    _VIEW_TPL_CACHE[tplId] = html;
    if (tpl.parentNode) tpl.parentNode.removeChild(tpl);
    return html;

    if (viewId === 'master-data') { _renderMasterData(el); return; }
    if (viewId === 'kelola-akun') { _renderKelolaAkun(el); return; }
    if (viewId === 'notifikasi') { _renderNotifikasi(el); return; }
    if (viewId === 'riwayat') { _renderRiwayat(el); return; }
    if (viewId === 'kegiatan') { _renderKegiatan(el); return; }
    if (viewId === 'profil-kapal') { _renderProfilKapal(el); return; }
    if (viewId === 'kapal-terbaik') { _renderKapalTerbaik(el); return; }

  // ── OVERVIEW — muat data agregasi (DashboardService.js) ────
  var APP_OV = { key: null };

  function _ovFilterKey() {
    var f = APP.filter || {};
    if (f.mode === 'range') return 'range_' + (f.dateFrom || '') + '_' + (f.dateTo || '');
    return 'monthly_' + (f.year || '') + '_' + (f.month || '');
  }

  function _ovLoadData(force) {
    if (!force && APP_OV.key === _ovFilterKey()) return;

    var kpiRow = document.getElementById('ov-kpi-row');
    var execBody = document.getElementById('ov-exec-body');
    if (!kpiRow && !execBody) return;

    _busyInc();
    google.script.run
      .withSuccessHandler(function (res) {
        try {
          APP_OV.key = _ovFilterKey();
          if (res && res.success) {
            _ovRenderData(res.data);
          } else {
            _ovLoadError((res && res.error) || 'Gagal memuat data Ikhtisar');
          }
        } finally {
          _busyDec();
        }
      })
      .withFailureHandler(function (err) {
        APP_OV.key = null;
        _ovLoadError((err && err.message) || 'Gagal menghubungi server');
        _busyDec();
      })
      .dashboard_getOverview(APP.token, APP.filter);
  }

  function _ovLoadError(msg) {
    var kpiRow = document.getElementById('ov-kpi-row');
    if (kpiRow) {
      kpiRow.innerHTML = '<div class="n-msg error show">Data Ikhtisar gagal dimuat: ' +
        _esc(msg) +
        ' <button type="button" class="n-iconbtn-x" data-ico="refresh" ' +
        'title="Coba lagi" aria-label="Coba lagi" onclick="_ovLoadData(true)"></button></div>';
    }
    var execBody = document.getElementById('ov-exec-body');
    if (execBody) execBody.innerHTML = '';
  }

  function _ovRenderData(d) {
    if (!d) return;

    _setPageFinding('');

    if (d.satellites) _updateSyncSatellitesUI(d.satellites);
    if (d.meta && d.meta.syncedAt) {
      APP_SYNC.lastTxMetadata = { timestamp: d.meta.syncedAt, sheet: 'Federasi Satelit' };
      _updateTelemetryTimestampUI();
    }

    var kpiRow = document.getElementById('ov-kpi-row');
    if (kpiRow) {
      if (d.headline && d.headline.length) {
        kpiRow.innerHTML = d.headline.map(function (h) {
          var opt = Object.assign({}, h);
          var rawNum = Number(String(h.value).replace(',', '.'));
          if (!isNaN(rawNum)) {
            if (h.unit === '%') {
              opt.progress = { pct: Math.min(100, Math.max(0, rawNum)), tone: h.sourceTone || 'sikap' };
            } else if (typeof h.unit === 'string') {
              var mRatio = h.unit.match(/\/\s*(\d+)/);
              if (mRatio && Number(mRatio[1]) > 0) {
                opt.progress = { pct: Math.min(100, Math.max(0, (rawNum / Number(mRatio[1])) * 100)), tone: h.sourceTone || 'radar' };
              }
            }
          }
          return _kpiHeadline(h.label, _ovNum(h.value, h.unit), h.unit, h.sub, opt);
        }).join('');
      } else {
        kpiRow.innerHTML = '<div class="chart-empty">Belum ada data pada rentang terpilih</div>';
      }
    }

    _ovMapLoad(d.wppMap);

    if (d.charts && d.charts.realisasi) {
      var labels = d.charts.trendMonths || [];
      _chartLine('ov-chart-real', labels, [
        { label: 'SP2D', data: d.charts.realisasi.sp2d, color: _CHART_COLORS.sikap, fill: true, fillColor: 'rgba(15, 118, 110, 0.07)', borderWidth: 2.5 },
        { label: 'Akrual', data: d.charts.realisasi.akrual, color: '#64748B', dashed: true, fill: false, borderWidth: 2 }
      ], {
        noEndLabel: true,
        formatMonths: true,
        fmt: _chartCompact,
        yFmt: _chartYBillions,
        emptyMsg: 'Belum ada data realisasi SIKAP pada rentang terpilih'
      });
    }

    var aknPanel = document.getElementById('ov-akn-panel');
    if (aknPanel) {
      var ap = (d.charts && d.charts.aknPostur) || {};
      var lbls = ap.labels || [];
      var kesArr = ap.keseluruhan || [];
      var poaArr = ap.poa || [];
      var maxAll = 0;
      for (var ai = 0; ai < kesArr.length; ai++) {
        if ((Number(kesArr[ai]) || 0) > maxAll) maxAll = Number(kesArr[ai]) || 0;
      }
      if (!lbls.length || maxAll <= 0) {
        aknPanel.innerHTML = '<div class="chart-empty">Data postur AKN Nakhoda belum terhubung</div>';
      } else {
        var sijil = (d.nakhoda && d.nakhoda.sijil) || {};
        var komp = (d.nakhoda && d.nakhoda.kompetensi) || {};
        var rowsHtml = lbls.map(function (lb, i) {
          var totV = Number(kesArr[i]) || 0;
          var poaV = Number(poaArr[i]) || 0;
          var wAll = Math.round((totV / maxAll) * 100);
          var wPoa = Math.round((poaV / maxAll) * 100);
          return '<div class="ov-akn-item">' +
            '<div class="ov-akn-top">' +
            '<span class="ov-akn-lbl">' + _esc(lb) + '</span>' +
            '<span class="ov-akn-num table-num"><strong>' + _idNum(poaV) + '</strong> <span class="ov-akn-all">/ ' + _idNum(totV) + '</span></span>' +
            '</div>' +
            '<div class="ov-akn-track">' +
            '<div class="ov-akn-fill-all" style="width:' + wAll + '%;"></div>' +
            '<div class="ov-akn-fill-poa" style="width:' + wPoa + '%;"></div>' +
            '</div>' +
            '</div>';
        }).join('');
        aknPanel.innerHTML =
          '<div class="ov-akn-list">' + rowsHtml + '</div>' +
          '<div class="ov-akn-foot">' +
          '<span>Laik sijil <strong>' + _idNum(sijil.laikAwak || 0) + '/' + _idNum(sijil.totalKapalEvaluasi || 34) + '</strong></span>' +
          '<span>Kedaluwarsa <strong>' + _idNum(komp.kedaluwarsa || 0) + '</strong></span>' +
          '</div>';
      }
    }

    var execPeriode = document.getElementById('ov-exec-periode');
    if (execPeriode) execPeriode.textContent = d.periode || '\u2014';

    var execBody = document.getElementById('ov-exec-body');
    if (execBody) {
      var gridRows = d.executiveGrid || [];
      if (!gridRows.length) {
        execBody.innerHTML = '<tr><td colspan="5" class="hist-empty">Belum ada ringkasan satelit pada rentang terpilih</td></tr>';
      } else {
        execBody.innerHTML = gridRows.map(function (r) {
          var badgeCls = r.statusTone === 'ok' ? 'badge-ok' : (r.statusTone === 'warn' ? 'badge-warn' : 'badge-neutral');
          var dotCls = r.satTone === 'sikap' ? 'dot-sikap' : (r.satTone === 'nakhoda' ? 'dot-nakhoda' : (r.satTone === 'pusat' ? 'dot-pusat' : 'dot-neut'));
          return '<tr class="' + (r.connected ? '' : 'ov-exec-row-muted') + '">' +
            '<td class="ov-exec-unit">' + _esc(r.unit) + '</td>' +
            '<td><span class="ov-sat-cell"><i class="ov-sat-dot ' + dotCls + '"></i>' + _esc(r.satelit) + '</span></td>' +
            '<td>' + _esc(r.indikatorKunci) + '</td>' +
            '<td><div class="ov-exec-val">' + _esc(r.capaian) + '</div><div class="ov-exec-sub">' + _esc(r.pembanding) + '</div></td>' +
            '<td><span class="badge ' + badgeCls + '">' + _esc(r.statusTeks) + '</span></td>' +
            '</tr>';
        }).join('');
      }
    }
  }

  function _ovNum(v, unit) {
    var n = Number(v);
    if (isNaN(n)) return (v === null || v === undefined || v === '') ? '\u2014' : String(v);
    if (unit === 'Rp') return _rupiah(n);
    return _idNum(n);
  }

  function _ovMetric(m) {
    var v = m.val;
    if (v === null || v === undefined || v === '' || v === '\u2014') {
      return { lbl: m.lbl, val: '\u2014', unit: m.unit, prog: !!m.prog, progMax: m.progMax, stack: m.stack, bars: m.bars, raw: null, badge: m.badge, tone: m.tone };
    }
    var valStr = _ovNum(v, m.unit);
    return { lbl: m.lbl, val: valStr, unit: m.unit, prog: !!m.prog, progMax: m.progMax, stack: m.stack, bars: m.bars, raw: (m.raw !== undefined ? m.raw : v), badge: m.badge, tone: m.tone };
  }

  function _pkLoad() {
    _busyInc();
    google.script.run
      .withSuccessHandler(function (res) {
        try {
          if (res && res.success) _pkRender(res.data);
          else {
            var sub = document.getElementById('pk-sub');
            if (sub) sub.textContent = (res && res.error) ? res.error : 'Gagal memuat data';
          }
        } finally {
          _busyDec();
        }
      })
      .withFailureHandler(function () {
        _busyDec();
        var sub = document.getElementById('pk-sub');
        if (sub) sub.textContent = 'Gagal memuat data';
      })
      .dashboard_profilKapal(APP.token, { kapalId: APP.profilKapalId });
  }

  function _pkBool(v) {
    return v === true || v === 'true' || v === 1 || v === '1' || v === 'TRUE';
  }

  function _pkRender(d) {
    var k = d.kapal || {};
    var s = d.summary || {};
    var statusTok = s.statusTaktis || k.statusTaktis || (s.statusKesiapan ? 'OPERASIONAL' : 'GALANGAN');
    var statusLabel = s.statusLabel || k.statusLabel || _humanEnum(statusTok);
    var statusBadgeCls = statusTok === 'OPERASIONAL' ? 'badge-info' : (statusTok === 'SIAP_PANGKALAN' ? 'badge-ok' : 'badge-warn');

    var namaEl = document.getElementById('pk-h1-name');
    if (namaEl && (k.nama || k.kapalId)) namaEl.textContent = k.nama || k.kapalId;

    var svgEl = document.getElementById('pk-h1-svg');
    if (svgEl) {
      svgEl.innerHTML = _shipClassSvg(k.kelasKapal || 'KELAS_I', _shipStatusColor(statusTok), 'map');
    }

    var clsEl = document.getElementById('pk-h1-class');
    if (clsEl) {
      var clsParts = [];
      if (k.kelasLabel) clsParts.push(k.kelasLabel);
      if (k.panjangMeter) clsParts.push(k.panjangMeter + ' m');
      if (clsParts.length) {
        clsEl.textContent = clsParts.join(' \u00B7 ');
        clsEl.classList.remove('n-hidden');
      } else {
        clsEl.classList.add('n-hidden');
      }
    }

    var wppText = k.wpp && /^\d+$/.test(String(k.wpp).trim()) ? ('WPP ' + String(k.wpp).trim()) : (k.wpp || '\u2014');
    var metaParts = [];
    if (k.homebaseUpt || k.pangkalan) metaParts.push(k.homebaseUpt || k.pangkalan);
    if (wppText !== '\u2014') metaParts.push(wppText);
    if (k.komandan) metaParts.push(k.komandan);
    var sub = document.getElementById('pk-sub');
    if (sub) sub.textContent = metaParts.join(' \u00B7 ') || '\u2014';

    _setPageFinding('');

    var kpi = document.getElementById('pk-kpi');
    if (kpi) {
      var baseLoc = k.pangkalan || k.homebaseUpt || '\u2014';
      var dockSub = s.dockingAktif ? (s.lokasiDocking || 'Galangan') : ('Periode ' + (s.statusKesiapanPeriode || '\u2014'));
      kpi.innerHTML =
        '<div class="pk-spec-strip">' +
        '<div class="pk-spec-cell">' +
        '<div class="pk-spec-lbl">Status Taktis</div>' +
        '<div class="pk-spec-val"><span class="badge ' + statusBadgeCls + '">' + _esc(statusLabel) + '</span></div>' +
        '<div class="pk-spec-sub">' + _esc(dockSub) + '</div>' +
        '</div>' +
        '<div class="pk-spec-cell">' +
        '<div class="pk-spec-lbl">Wilayah &amp; Pangkalan</div>' +
        '<div class="pk-spec-val">' + _esc(wppText) + '</div>' +
        '<div class="pk-spec-sub">' + _esc(baseLoc) + '</div>' +
        '</div>' +
        '<div class="pk-spec-cell">' +
        '<div class="pk-spec-lbl">Hari Layar</div>' +
        '<div class="pk-spec-val table-num">' + _idNum(s.totalHariOperasiLaut || k.hariOperasi || 0) + ' <span class="pk-spec-unit">hari</span></div>' +
        '<div class="pk-spec-sub">Rerata nasional 44 hr</div>' +
        '</div>' +
        '<div class="pk-spec-cell">' +
        '<div class="pk-spec-lbl"><span class="kpi-src"><i class="kpi-src-dot dot-nakhoda"></i>Awak Aktif</span></div>' +
        '<div class="pk-spec-val table-num">' + _idNum(s.totalKruAktif || 0) + ' <span class="pk-spec-unit">personel</span></div>' +
        '<div class="pk-spec-sub">' + _esc(k.komandan || 'Sertifikasi aktif') + '</div>' +
        '</div>' +

        '</div>' +
        '</div>';
    }

    // Stok Amunisi & BBM (Sistik — tampilkan hanya jika sudah terhubung datanya)
    var stok = s.stokAmunisiAkhir || {};

  function _resolveShipClassClient(kelasKapal, kelas, panjangMeter) {
    var tok = String(kelasKapal || '').trim().toUpperCase();
    var ser = String(kelas || '').trim().toUpperCase();
    var len = Number(panjangMeter) || 0;
    var key = '';
    if (_SHIP_CLASS_SPEC[tok]) {
      key = tok;
    } else if (ser.indexOf('ORCA') !== -1) {
      key = 'KELAS_I'; if (!len) len = 60;
    } else if (ser.indexOf('PAUS') !== -1 || ser.indexOf('BARAKUDA') !== -1) {
      key = 'KELAS_II'; if (!len) len = 42;
    } else if (ser.indexOf('TUTUL') !== -1) {
      key = 'KELAS_II'; if (!len) len = 40;
    } else if (ser.indexOf('MACAN') !== -1) {
      key = 'KELAS_II'; if (!len) len = 36;
    } else if (ser.indexOf('HIU') !== -1) {
      key = 'KELAS_III'; if (!len) len = 32;
    } else if (ser.indexOf('AKAR') !== -1) {
      key = 'KELAS_IV'; if (!len) len = 22;
    } else if (len > 60) {
      key = 'KELAS_I';
    } else if (len >= 40) {
      key = 'KELAS_II';
    } else if (len >= 28) {
      key = 'KELAS_III';
    } else if (len >= 18) {
      key = 'KELAS_IV';
    } else {
      key = 'KELAS_V'; if (!len) len = 14;
    }
    var meta = _SHIP_CLASS_SPEC[key] || _SHIP_CLASS_SPEC.KELAS_III;
    var defLen = key === 'KELAS_I' ? 60 : key === 'KELAS_II' ? 40 : key === 'KELAS_III' ? 32 : key === 'KELAS_IV' ? 22 : 14;
    return { key: meta.key, romawi: meta.romawi, label: meta.label, panjangMeter: len || defLen };
  }

    }

    var footHtml = '';
    if (opt.foot && opt.foot.left && opt.foot.right) {
      footHtml = '<div class="kpi-foot">' +
